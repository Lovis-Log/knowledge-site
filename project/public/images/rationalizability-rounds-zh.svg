<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 588" width="1120" height="588" role="img" lang="zh"><rect width="1120" height="588" fill="#fbf9f5"/><text x="40" y="50" font-size="21" fill="#1b2b45" font-weight="bold" text-anchor="start" font-family="'Segoe UI', 'Microsoft YaHei', 'PingFang SC', 'Noto Sans SC', Helvetica, Arial, sans-serif">可理性化的三轮削薄</text><text x="40" y="80" font-size="13" fill="#57534c" font-weight="normal" text-anchor="start" font-family="'Segoe UI', 'Microsoft YaHei', 'PingFang SC', 'Noto Sans SC', Helvetica, Arial, sans-serif">每一轮只看对手上一轮的策略集；灰掉的是这一轮被剔除的策略</text><text x="120" y="136" font-size="13" fill="#1b2b45" font-weight="bold" text-anchor="start" font-family="'Segoe UI', 'Microsoft YaHei', 'PingFang SC', 'Noto Sans SC', Helvetica, Arial, sans-serif">第 1 轮</text><text x="120" y="156" font-size="11.5" fill="#57534c" font-weight="normal" text-anchor="start" font-family="'Segoe UI', 'Microsoft YaHei', 'PingFang SC', 'Noto Sans SC', Helvetica, Arial, sans-serif">双方都理性</text><text x="450" y="136" font-size="13" fill="#1b2b45" font-weight="bold" text-anchor="start" font-family="'Segoe UI', 'Microsoft YaHei', 'PingFang SC', 'Noto Sans SC', Helvetica, Arial, sans-serif">第 2 轮</text><text x="450" y="156" font-size="11.5" fill="#57534c" font-weight="normal" text-anchor="start" font-family="'Segoe UI', 'Microsoft YaHei', 'PingFang SC', 'Noto Sans SC', Helvetica, Arial, sans-serif">知道对方理性</text><text x="780" y="136" font-size="13" fill="#1b2b45" font-weight="bold" text-anchor="start" font-family="'Segoe UI', 'Microsoft YaHei', 'PingFang SC', 'Noto Sans SC', Helvetica, Arial, sans-serif">第 3 轮</text><text x="780" y="156" font-size="11.5" fill="#57534c" font-weight="normal" text-anchor="start" font-family="'Segoe UI', 'Microsoft YaHei', 'PingFang SC', 'Noto Sans SC', Helvetica, Arial, sans-serif">知道对方知道自己理性</text><text x="106" y="232" font-size="13" fill="#1b2b45" font-weight="bold" text-anchor="end" font-family="'Segoe UI', 'Microsoft YaHei', 'PingFang SC', 'Noto Sans SC', Helvetica, Arial, sans-serif">玩家 1</text><rect x="120" y="176" width="300" height="100" rx="12" fill="#fffdf9" stroke="#d8d0c1" stroke-width="1"/><rect x="146" y="209" width="64" height="34" rx="8" fill="#f3ead9" stroke="none" stroke-width="1"/><text x="178" y="232" font-size="14" fill="#7d5a1e" font-weight="bold" text-anchor="middle" font-family="'Segoe UI', 'Microsoft YaHei', 'PingFang SC', 'Noto Sans SC', Helvetica, Arial, sans-serif">T</text><rect x="222" y="209" width="64" height="34" rx="8" fill="#f3ead9" stroke="none" stroke-width="1"/><text x="254" y="232" font-size="14" fill="#7d5a1e" font-weight="bold" text-anchor="middle" font-family="'Segoe UI', 'Microsoft YaHei', 'PingFang SC', 'Noto Sans SC', Helvetica, Arial, sans-serif">B</text><rect x="298" y="209" width="64" height="34" rx="8" fill="#f0ece2" stroke="none" stroke-width="1"/><text x="330" y="232" font-size="14" fill="#a8a196" font-weight="normal" text-anchor="middle" font-family="'Segoe UI', 'Microsoft YaHei', 'PingFang SC', 'Noto Sans SC', Helvetica, Arial, sans-serif">M</text><line x1="312" y1="227" x2="348" y2="227" stroke="#a8a196" stroke-width="1.4"/><line x1="426" y1="226" x2="438.05" y2="226" stroke="#7d5a1e" stroke-width="1.6"/><path d="M 444 226 L 437.5 228.6 L 437.5 223.4 Z" fill="#7d5a1e"/><rect x="450" y="176" width="300" height="100" rx="12" fill="#fffdf9" stroke="#d8d0c1" stroke-width="1"/><rect x="476" y="209" width="64" height="34" rx="8" fill="#f3ead9" stroke="none" stroke-width="1"/><text x="508" y="232" font-size="14" fill="#7d5a1e" font-weight="bold" text-anchor="middle" font-family="'Segoe UI', 'Microsoft YaHei', 'PingFang SC', 'Noto Sans SC', Helvetica, Arial, sans-serif">T</text><rect x="552" y="209" width="64" height="34" rx="8" fill="#f3ead9" stroke="none" stroke-width="1"/><text x="584" y="232" font-size="14" fill="#7d5a1e" font-weight="bold" text-anchor="middle" font-family="'Segoe UI', 'Microsoft YaHei', 'PingFang SC', 'Noto Sans SC', Helvetica, Arial, sans-serif">B</text><rect x="628" y="209" width="64" height="34" rx="8" fill="#f0ece2" stroke="none" stroke-width="1"/><text x="660" y="232" font-size="14" fill="#a8a196" font-weight="normal" text-anchor="middle" font-family="'Segoe UI', 'Microsoft YaHei', 'PingFang SC', 'Noto Sans SC', Helvetica, Arial, sans-serif">M</text><line x1="642" y1="227" x2="678" y2="227" stroke="#a8a196" stroke-width="1.4"/><line x1="756" y1="226" x2="768.05" y2="226" stroke="#7d5a1e" stroke-width="1.6"/><path d="M 774 226 L 767.5 228.6 L 767.5 223.4 Z" fill="#7d5a1e"/><rect x="780" y="176" width="300" height="100" rx="12" fill="#fffdf9" stroke="#d8d0c1" stroke-width="1"/><rect x="806" y="209" width="64" height="34" rx="8" fill="#f3ead9" stroke="none" stroke-width="1"/><text x="838" y="232" font-size="14" fill="#7d5a1e" font-weight="bold" text-anchor="middle" font-family="'Segoe UI', 'Microsoft YaHei', 'PingFang SC', 'Noto Sans SC', Helvetica, Arial, sans-serif">B</text><rect x="882" y="209" width="64" height="34" rx="8" fill="#f0ece2" stroke="none" stroke-width="1"/><text x="914" y="232" font-size="14" fill="#a8a196" font-weight="normal" text-anchor="middle" font-family="'Segoe UI', 'Microsoft YaHei', 'PingFang SC', 'Noto Sans SC', Helvetica, Arial, sans-serif">T</text><line x1="896" y1="227" x2="932" y2="227" stroke="#a8a196" stroke-width="1.4"/><rect x="958" y="209" width="64" height="34" rx="8" fill="#f0ece2" stroke="none" stroke-width="1"/><text x="990" y="232" font-size="14" fill="#a8a196" font-weight="normal" text-anchor="middle" font-family="'Segoe UI', 'Microsoft YaHei', 'PingFang SC', 'Noto Sans SC', Helvetica, Arial, sans-serif">M</text><line x1="972" y1="227" x2="1008" y2="227" stroke="#a8a196" stroke-width="1.4"/><text x="106" y="356" font-size="13" fill="#1b2b45" font-weight="bold" text-anchor="end" font-family="'Segoe UI', 'Microsoft YaHei', 'PingFang SC', 'Noto Sans SC', Helvetica, Arial, sans-serif">玩家 2</text><rect x="120" y="300" width="300" height="100" rx="12