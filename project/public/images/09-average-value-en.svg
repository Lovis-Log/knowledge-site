Noto Sans SC', Helvetica, Arial, sans-serif">2/π ≈ 0.637</text><text x="829.42" y="397.6" font-size="11" fill="#57534c" font-weight="normal" text-anchor="middle" font-family="'Segoe UI', 'Microsoft YaHei', 'PingFang SC', 'Noto Sans SC', Helvetica, Arial, sans-serif">area is still 2</text><line x1="647.39" y1="439.2" x2="647.39" y2="444.2" stroke="#d8d0c1" stroke-width="1.1"/><line x1="829.51" y1="439.2" x2="829.51" y2="444.2" stroke="#d8d0c1" stroke-width="1.1"/><line x1="1011.63" y1="439.2" x2="1011.63" y2="444.2" stroke="#d8d0c1" stroke-width="1.1"/><text x="641.39" y="473.2" font-size="11" fill="#746e64" font-weight="normal" text-anchor="end" font-family="'Segoe UI', 'Microsoft YaHei', 'PingFang SC', 'Noto Sans SC', Helvetica, Arial, sans-serif">0</text><text x="829.51" y="473.2" font-size="11" fill="#746e64" font-weight="normal" text-anchor="middle" font-family="'Segoe UI', 'Microsoft YaHei', 'PingFang SC', 'Noto Sans SC', Helvetica, Arial, sans-serif">π/2</text><text x="1019.63" y="473.2" font-size="11" fill="#746e64" font-weight="normal" text-anchor="start" font-family="'Segoe UI', 'Microsoft YaHei', 'PingFang SC', 'Noto Sans SC', Helvetica, Arial, sans-serif">π</text><text x="638" y="500" font-size="13" fill="#7d5a1e" font-weight="bold" text-anchor="start" font-family="'Segoe UI', 'Microsoft YaHei', 'PingFang SC', 'Noto Sans SC', Helvetica, Arial, sans-serif">2 ÷ π ≈ 0.637</text><text x="598" y="528" font-size="11" fill="#57534c" font-weight="normal" text-anchor="start" font-family="'Segoe UI', 'Microsoft YaHei', 'PingFang SC', 'Noto Sans SC', Helvetica, Arial, sans-serif">Rectangle height = area ÷ width.</text><rect x="40" y="578" width="1040" height="124" rx="12" fill="#f3ead9" stroke="none" stroke-width="1"/><text x="60" y="606" font-size="14" fill="#1b2b45" font-weight="bold" text-anchor="start" font-family="'Segoe UI', 'Microsoft YaHei', 'PingFang SC', 'Noto Sans SC', Helvetica, Arial, sans-serif">Takeaway</text><text x="60" y="632" font-size="13" fill="#57534c" font-weight="normal" text-anchor="start" font-family="'Segoe UI', 'Microsoft YaHei', 'PingFang SC', 'Noto Sans SC', Helvetica, Arial, sans-serif">Averaging n sampled heights is the same as adding n small areas and dividing by the total width; the limit is the integral over the interval length.</text><text x="60" y="658" font-size="13" fill="#57534c" font-weight="normal" text-anchor="start" font-family="'Segoe UI', 'Microsoft YaHei', 'PingFang SC', 'Noto Sans SC', Helvetica, Arial, sans-serif">It also explains why an average lies between the minimum and maximum: it is the height after the area is flattened out.</text></svg>
