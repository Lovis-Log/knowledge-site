<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 710" width="1120" height="710" role="img" lang="en"><rect width="1120" height="710" fill="#fbf9f5"/><text x="40" y="50" font-size="21" fill="#1b2b45" font-weight="bold" text-anchor="start" font-family="'Segoe UI', 'Microsoft YaHei', 'PingFang SC', 'Noto Sans SC', Helvetica, Arial, sans-serif">The chain rule: three nudges, three amplifications</text><text x="40" y="80" font-size="13" fill="#57534c" font-weight="normal" text-anchor="start" font-family="'Segoe UI', 'Microsoft YaHei', 'PingFang SC', 'Noto Sans SC', Helvetica, Arial, sans-serif">Starting at x = 3, how one dx travels through x² and into sin(x²)</text><line x1="150" y1="176" x2="990" y2="176" stroke="#d8d0c1" stroke-width="1.4"/><line x1="150" y1="172" x2="150" y2="180" stroke="#e7e1d6" stroke-width="1"/><line x1="255" y1="172" x2="255" y2="180" stroke="#e7e1d6" stroke-width="1"/><line x1="360" y1="172" x2="360" y2="180" stroke="#e7e1d6" stroke-width="1"/><line x1="465" y1="172" x2="465" y2="180" stroke="#e7e1d6" stroke-width="1"/><line x1="570" y1="172" x2="570" y2="180" stroke="#e7e1d6" stroke-width="1"/><line x1="675" y1="172" x2="675" y2="180" stroke="#e7e1d6" stroke-width="1"/><line x1="780" y1="172" x2="780" y2="180" stroke="#e7e1d6" stroke-width="1"/><line x1="885" y1="172" x2="885" y2="180" stroke="#e7e1d6" stroke-width="1"/><line x1="990" y1="172" x2="990" y2="180" stroke="#e7e1d6" stroke-width="1"/><text x="132" y="181" font-size="13" fill="#1b2b45" font-weight="bold" text-anchor="end" font-family="'Segoe UI', 'Microsoft YaHei', 'PingFang SC', 'Noto Sans SC', Helvetica, Arial, sans-serif">x</text><text x="132" y="199" font-size="11.5" fill="#746e64" font-weight="normal" text-anchor="end" font-family="'Segoe UI', 'Microsoft YaHei', 'PingFang SC', 'Noto Sans SC', Helvetica, Arial, sans-serif">x = 3</text><circle cx="600" cy="176" r="5" fill="#1b2b45" stroke="none" stroke-width="1"/><line x1="150" y1="312" x2="990" y2="312" stroke="#d8d0c1" stroke-width="1.4"/><line x1="150" y1="308" x2="150" y2="316" stroke="#e7e1d6" stroke-width="1"/><line x1="255" y1="308" x2="255" y2="316" stroke="#e7e1d6" stroke-width="1"/><line x1="360" y1="308" x2="360" y2="316" stroke="#e7e1d6" stroke-width="1"/><line x1="465" y1="308" x2="465" y2="316" stroke="#e7e1d6" stroke-width="1"/><line x1="570" y1="308" x2="570" y2="316" stroke="#e7e1d6" stroke-width="1"/><line x1="675" y1="308" x2="675" y2="316" stroke="#e7e1d6" stroke-width="1"/><line x1="780" y1="308" x2="780" y2="316" stroke="#e7e1d6" stroke-width="1"/><line x1="885" y1="308" x2="885" y2="316" stroke="#e7e1d6" stroke-width="1"/><line x1="990" y1="308" x2="990" y2="316" stroke="#e7e1d6" stroke-width="1"/><text x="132" y="317" font-size="13" fill="#1b2b45" font-weight="bold" text-anchor="end" font-family="'Segoe UI', 'Microsoft YaHei', 'PingFang SC', 'Noto Sans SC', Helvetica, Arial, sans-serif">h = x²</text><text x="132" y="335" font-size="11.5" fill="#746e64" font-weight="normal" text-anchor="end" font-family="'Segoe UI', 'Microsoft YaHei', 'PingFang SC', 'Noto Sans SC', Helvetica, Arial, sans-serif">h = 9</text><circle cx="600" cy="312" r="5" fill="#1b2b45" stroke="none" stroke-width="1"/><line x1="150" y1="448" x2="990" y2="448" stroke="#d8d0c1" stroke-width="1.4"/><line x1="150" y1="444" x2="150" y2="452" stroke="#e7e1d6" stroke-width="1"/><line x1="255" y1="444" x2="255" y2="452" stroke="#e7e1d6" stroke-width="1"/><line x1="360" y1="444" x2="360" y2="452" stroke="#e7e1d6" stroke-width="1"/><line x1="465" y1="444" x2="465" y2="452" stroke="#e7e1d6" stroke-width="1"/><line x1="570" y1="444" x2="570" y2="452" stroke="#e7e1d6" stroke-width="1"/><line x1="675" y1="444" x2="675" y2="452" stroke="#e7e1d6" stroke-width="1"/><line x1="780" y1="444" x2="780" y2="452" stroke="#e7e1d6" stroke-width="1"/><line x1="885" y1="444" x2="885" y2="452" stroke="#e7e1d6" stroke-width="1"/><line x1="990" y1="444" x2="990" y2="452" stroke="#e7e1d6" stroke-width="1"/><text x="132" y="453" font-size="13" fill="#1b2b45" font-weight="bold" text-anchor="end" font-family="'Segoe UI', 'Microsoft YaHei', 'PingFang SC', 'Noto Sans SC', Helvetica, Arial, sans-serif">sin h</text><text x="132" y="471" font-size="11.5" fill="#746e64" font-weight="normal" text-anchor="end" font-family="'Segoe UI', 'Microsoft YaHei', 'PingFang SC', 'Noto Sans SC', Helvetica, Arial, sans-serif">sin 9 ≈ 0.41</text><circle cx="600" cy="448" r="5" fill="#1b2b45" stroke="none" stroke-width="1"/><line x1="608" y1="176" x2="653.2" y2="176" stroke="#7d5a1e" stroke-width="1.8"/><path d="M 660 176 L 652.57 178.97 L 652.57 173.03 Z" fill="#7d5a1e"/><rect x="623.28" y="154" width="21.44" height="17.4" rx="4" fill="#fbf9f5" stroke="none" stroke-width="1"/><text x="634" y="166" font-size="12" fill="#7d5a1e" font-weight="bold" text-anchor="middle" font-family="'Segoe UI', 'Microsoft YaHei', 'PingFang SC', 'Noto Sans SC', Helvetica, Arial, sans-serif">dx</text><line x1="608" y1="312" x2="721.2" y2="312" stroke="#7d5a1e" stroke-width="1.8"/><path d="M 728 312 L 720.57 314.97 L 720.57 309.03 Z" fill="#7d5a1e"/><rect x="634.24" y="290" width="67.52" height="17.4" rx="4" fill="#fbf9f5" stroke="none" stroke-width="1"/><text x="668" y="302" font-size="12" fill="#7d5a1e" font-weight="bold" text-anchor="middle" font-family="'Segoe UI', 'Microsoft YaHei', 'PingFang SC', 'Noto Sans SC', Helvetica, Arial, sans-serif">dh = 6·dx</text><line x1="592" y1="448" x2="490.8" y2="448" stroke="#9c4a2f" stroke-width="1.8"/><path d="M 484 448 L 491.43 445.03 L 491.43 450.97 Z" fill="#9c4a2f"/><text x="544" y="436" font-size="12" fill="#9c4a2f" font-weight="bold" text-anchor="end" font-family="'Segoe UI', 'Microsoft YaHei', 'PingFang SC', 'Noto Sans SC', Helvetica, Arial, sans-serif">d sin h ≈ −5.47·dx</text><text x="540" y="474" font-size="11.5" fill="#746e64" font-weight="normal" text-anchor="middle" font-family="'Segoe UI', 'Microsoft YaHei', 'PingFang SC', 'Noto Sans SC', Helvetica, Arial, sans-serif">moves left: cos 9 is negative</text><line x1="560" y1="186" x2="560" y2="296.05" stroke="#1b2b45" stroke-width="1.4" stroke-dasharray="4 4"/><path d="M 560 302 L 557.4 295.5 L 562.6 295.5 Z" fill="#1b2b45"/><line x1="560" y1="322" x2="560" y2="432.05" stroke="#1b2b45" stroke-width="1.4" stroke-dasharray="4 4"/><path d="M 560 438 L 557.4 431.5 L 562.6 431.5 Z" fill="#1b2b45"/><text x="548" y="248" font-size="12" fill="#7d5a1e" font-weight="bold" text-anchor="end" font-family="'Segoe UI', 'Microsoft YaHei', 'PingFang SC', 'Noto Sans SC', Helvetica, Arial, sans-serif">× 2x = 6</text><text x="548" y="384" font-size="12" fill="#7d5a1e" font-weight="bold" text-anchor="end" font-family="'Segoe UI', 'Microsoft YaHei', 'PingFang SC', 'Noto Sans SC', Helvetica, Arial, sans-serif">× cos h = −0.91</text><rect x="426.56" y="486" width="266.88" height="36" rx="8" fill="#f3ead9" stroke="none" stroke-width="1"/><text x="560" y="511" font-size="14" fill="#1b2b45" font-weight="bold" text-anchor="middle" font-family="'Segoe UI', 'Microsoft YaHei', 'PingFang SC', 'Noto Sans SC', Helvetica, Arial, sans-serif">d sin(x²) = cos(x²) · 2x · dx</text><rect x="40" y="546" width="1040" height="124" rx="12" fill="#f3ead9" stroke="none" stroke-width="1"/><text x="60" y="574" font-size="14" fill="#1b2b45" font-weight="bold" text-anchor="start" font-family="'Segoe UI', 'Microsoft YaHei', 'PingFang SC', 'Noto Sans SC', Helvetica, Arial, sans-serif">Takeaway</text><text x="60" y="600" font-size="13" fill="#57534c" font-weight="normal" text-anchor="start" font-family="'Segoe UI', 'Microsoft YaHei', 'PingFang SC', 'Noto Sans SC', Helvetica, Arial, sans-serif">Total amplification = 2x · cos h = 6 × (−0.91) ≈ −5.47, which is the derivative of sin(x²) at x = 3.</text><text x="60" y="626" font-size="13" fill="#57534c" font-weight="normal" text-anchor="start" font-family="'Segoe UI', 'Microsoft YaHei', 'PingFang SC', 'Noto Sans SC', Helvetica, Arial, sans-serif">The intermediate dh is the same number in both stages, so it cancels; multiplying the three ratios gives d sin h over dx.</text></svg>
