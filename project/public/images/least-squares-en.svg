<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 838" width="1120" height="838" role="img" lang="en"><rect width="1120" height="838" fill="#fbf9f5"/><text x="40" y="50" font-size="21" fill="#1b2b45" font-weight="bold" text-anchor="start" font-family="'Segoe UI', 'Microsoft YaHei', 'PingFang SC', 'Noto Sans SC', Helvetica, Arial, sans-serif">Least squares: between the data points and the line</text><text x="40" y="80" font-size="13" fill="#57534c" font-weight="normal" text-anchor="start" font-family="'Segoe UI', 'Microsoft YaHei', 'PingFang SC', 'Noto Sans SC', Helvetica, Arial, sans-serif">Points (1,1), (2,2), (3,2); fit b = C + Dt; solution C=2/3, D=1/2</text><rect x="40" y="104" width="560" height="520" rx="14" fill="#fffdf9" stroke="#d8d0c1" stroke-width="1"/><text x="58" y="137" font-size="14" fill="#1b2b45" font-weight="bold" text-anchor="start" font-family="'Segoe UI', 'Microsoft YaHei', 'PingFang SC', 'Noto Sans SC', Helvetica, Arial, sans-serif">① Fitted line and residuals</text><line x1="135" y1="180" x2="135" y2="495" stroke="#e7e1d6" stroke-width="0.8"/><line x1="310" y1="180" x2="310" y2="495" stroke="#e7e1d6" stroke-width="0.8"/><line x1="485" y1="180" x2="485" y2="495" stroke="#e7e1d6" stroke-width="0.8"/><line x1="100" y1="425" x2="520" y2="425" stroke="#e7e1d6" stroke-width="0.8"/><line x1="100" y1="250" x2="520" y2="250" stroke="#e7e1d6" stroke-width="0.8"/><line x1="100" y1="495" x2="520" y2="495" stroke="#d8d0c1" stroke-width="1.2"/><line x1="100" y1="180" x2="100" y2="495" stroke="#d8d0c1" stroke-width="1.2"/><line x1="135" y1="492" x2="135" y2="498" stroke="#d8d0c1" stroke-width="1"/><text x="135" y="511" font-size="11" fill="#746e64" font-weight="normal" text-anchor="middle" font-family="'Segoe UI', 'Microsoft YaHei', 'PingFang SC', 'Noto Sans SC', Helvetica, Arial, sans-serif">1</text><line x1="310" y1="492" x2="310" y2="498" stroke="#d8d0c1" stroke-width="1"/><text x="310" y="511" font-size="11" fill="#746e64" font-weight="normal" text-anchor="middle" font-family="'Segoe UI', 'Microsoft YaHei', 'PingFang SC', 'Noto Sans SC', Helvetica, Arial, sans-serif">2</text><line x1="485" y1="492" x2="485" y2="498" stroke="#d8d0c1" stroke-width="1"/><text x="485" y="511" font-size="11" fill="#746e64" font-weight="normal" text-anchor="middle" font-family="'Segoe UI', 'Microsoft YaHei', 'PingFang SC', 'Noto Sans SC', Helvetica, Arial, sans-serif">3</text><line x1="97" y1="425" x2="103" y2="425" stroke="#d8d0c1" stroke-width="1"/><text x="92" y="429" font-size="11" fill="#746e64" font-weight="normal" text-anchor="end" font-family="'Segoe UI', 'Microsoft YaHei', 'PingFang SC', 'Noto Sans SC', Helvetica, Arial, sans-serif">1</text><line x1="97" y1="250" x2="103" y2="250" stroke="#d8d0c1" stroke-width="1"/><text x="92" y="254" font-size="11" fill="#746e64" font-weight="normal" text-anchor="end" font-family="'Segoe UI', 'Microsoft YaHei', 'PingFang SC', 'Noto Sans SC', Helvetica, Arial, sans-serif">2</text><text x="520" y="529" font-size="11.5" fill="#746e64" font-weight="normal" text-anchor="end" font-family="'Segoe UI', 'Microsoft YaHei', 'PingFang SC', 'Noto Sans SC', Helvetica, Arial, sans-serif">t</text><text x="90" y="172" font-size="11.5" fill="#746e64" font-weight="normal" text-anchor="end" font-family="'Segoe UI', 'Microsoft YaHei', 'PingFang SC', 'Noto Sans SC', Helvetica, Arial, sans-serif">b</text><path d="M 117.5 404.58 L 502.5 212.08" fill="none" stroke="#1b2b45" stroke-width="2.4"/><path d="M 135 425 L 135 395.83" fill="none" stroke="#9c4a2f" stroke-width="1.4" stroke-dasharray="4 3"/><circle cx="135" cy="425" r="5" fill="#7d5a1e" stroke="none" stroke-width="1"/><circle cx="135" cy="425" r="8" fill="none" stroke="#7d5a1e" stroke-width="1"/><text x="145" y="415" font-size="11.5" fill="#7d5a1e" font-weight="bold" text-anchor="start" font-family="'Segoe UI', 'Microsoft YaHei', 'PingFang SC', 'Noto Sans SC', Helvetica, Arial, sans-serif">(1,1)</text><path d="M 310 250 L 310 308.33" fill="none" stroke="#9c4a2f" stroke-width="1.4" stroke-dasharray="4 3"/><circle cx="310" cy="250" r="5" fill="#7d5a1e" stroke="none" stroke-width="1"/><circle cx="310" cy="250" r="8" fill="none" stroke="#7d5a1e" stroke-width="1"/><text x="320" y="240" font-size="11.5" fill="#7d5a1e" font-weight="bold" text-anchor="start" font-family="'Segoe UI', 'Microsoft YaHei', 'PingFang SC', 'Noto Sans SC', Helvetica, Arial, sans-serif">(2,2)</text><path d="M 485 250 L 485 220.83" fill="none" stroke="#9c4a2f" stroke-width="1.4" stroke-dasharray="4 3"/><circle cx="485" cy="250" r="5" fill="#7d5a1e" stroke="none" stroke-width="1"/><circle cx="485" cy="250" r="8" fill="none" stroke="#7d5a1e" stroke-width="1"/><text x="495" y="240" font-size="11.5" fill="#7d5a1e" font-weight="bold" text-anchor="start" font-family="'Segoe UI', 'Microsoft YaHei', 'PingFang SC', 'Noto Sans SC', Helvetica, Arial, sans-serif">(3,2)</text><text x="320" y="555" font-size="14" fill="#1b2b45" font-weight="bold" text-anchor="middle" font-family="Consolas, monospace">b = 2/3 + (1/2)t</text><text x="320" y="584" font-size="12.5" fill="#57534c" font-weight="normal" text-anchor="middle" font-family="'Segoe UI', 'Microsoft YaHei', 'PingFang SC', 'Noto Sans SC', Helvetica, Arial, sans-serif">residual sum of squares = 1/6 ≈ 0.167</text><rect x="620" y="104" width="460" height="520" rx="14" fill="#fffdf9" stroke="#d8d0c1" stroke-width="1"/><text x="638" y="137" font-size="14" fill="#1b2b45" font-weight="bold" text-anchor="start" font-family="'Segoe UI', 'Microsoft YaHei', 'PingFang SC', 'Noto Sans SC', Helvetica, Arial, sans-serif">② Normal equations</text><text x="650" y="178" font-size="12" fill="#57534c" font-weight="normal" text-anchor="start" font-family="Consolas, monospace">A = [[1,1],[1,2],[1,3]], b = [1,2,2]</text><text x="650" y="220" font-size="14" fill="#7d5a1e" font-weight="bold" text-anchor="start" font-family="Consolas, monospace">AᵀA x = Aᵀb</text><text x="650" y="252" font-size="13" fill="#1b2b45" font-weight="normal" text-anchor="start" font-family="Consolas, monospace">[[3,6],[6,14]] [C,D] = [5,11]</text><text x="650" y="300" font-size="13" fill="#1b2b45" font-weight="normal" text-anchor="start" font-family="Consolas, monospace">3C + 6D = 5</text><text x="650" y="330" font-size="13" fill="#1b2b45" font-weight="normal" text-anchor="start" font-family="Consolas, monospace">6C + 14D = 11</text><text x="650" y="360" font-size="13" fill="#1b2b45" font-weight="normal" text-anchor="start" font-family="Consolas, monospace">→ C = 2/3, D = 1/2</text><text x="650" y="400" font-size="11.5" fill="#746e64" font-weight="bold" text-anchor="start" font-family="'Segoe UI', 'Microsoft YaHei', 'PingFang SC', 'Noto Sans SC', Helvetica, Arial, sans-serif">t</text><text x="745" y="400" font-size="11.5" fill="#746e64" font-weight="bold" text-anchor="start" font-family="'Segoe UI', 'Microsoft YaHei', 'PingFang SC', 'Noto Sans SC', Helvetica, Arial, sans-serif">b</text><text x="840" y="400" font-size="11.5" fill="#746e64" font-weight="bold" text-anchor="start" font-family="'Segoe UI', 'Microsoft YaHei', 'PingFang SC', 'Noto Sans SC', Helvetica, Arial, sans-serif">fit</text><text x="935" y="400" font-size="11.5" fill="#746e64" font-weight="bold" text-anchor="start" font-family="'Segoe UI', 'Microsoft YaHei', 'PingFang SC', 'Noto Sans SC', Helvetica, Arial, sans-serif">residual</text><line x1="650" y1="410" x2="1000" y2="410" stroke="#d8d0c1" stroke-width="1"/><text x="650" y="438" font-size="12.5" fill="#57534c" font-weight="normal" text-anchor="start" font-family="Consolas, monospace">1</text><text x="745" y="438" font-size="12.5" fill="#57534c" font-weight="normal" text-anchor="start" font-family="Consolas, monospace">1</text><text x="840" y="438" font-size="12.5" fill="#57534c" font-weight="normal" text-anchor="start" font-family="Consolas, monospace">7/6</text><text x="935" y="438" font-size="12.5" fill="#9c4a2f" font-weight="normal" text-anchor="start" font-family="Consolas, monospace">−1/6</text><text x="650" y="468" font-size="12.5" fill="#57534c" font-weight="normal" text-anchor="start" font-family="Consolas, monospace">2</text><text x="745" y="468" font-size="12.5" fill="#57534c" font-weight="normal" text-anchor="start" font-family="Consolas, monospace">2</text><text x="840" y="468" font-size="12.5" fill="#57534c" font-weight="normal" text-anchor="start" font-family="Consolas, monospace">5/3</text><text x="935" y="468" font-size="12.5" fill="#9c4a2f" font-weight="normal" text-anchor="start" font-family="Consolas, monospace">1/3</text><text x="650" y="498" font-size="12.5" fill="#57534c" font-weight="normal" text-anchor="start" font-family="Consolas, monospace">3</text><text x="745" y="498" font-size="12.5" fill="#57534c" font-weight="normal" text-anchor="start" font-family="Consolas, monospace">2</text><text x="840" y="498" font-size="12.5" fill="#57534c" font-weight="normal" text-anchor="start" font-family="Consolas, monospace">13/6</text><text x="935" y="498" font-size="12.5" fill="#9c4a2f" font-weight="normal" text-anchor="start" font-family="Consolas, monospace">−1/6</text><rect x="40" y="648" width="1040" height="150" rx="12" fill="#f3ead9" stroke="none" stroke-width="1"/><text x="60" y="676" font-size="14" fill="#1b2b45" font-weight="bold" text-anchor="start" font-family="'Segoe UI', 'Microsoft YaHei', 'PingFang SC', 'Noto Sans SC', Helvetica, Arial, sans-serif">Why the normal equations</text><text x="60" y="702" font-size="13" fill="#57534c" font-weight="normal" text-anchor="start" font-family="'Segoe UI', 'Microsoft YaHei', 'PingFang SC', 'Noto Sans SC', Helvetica, Arial, sans-serif">Least squares minimizes the residual sum of squares; the error vector is orthogonal to the column space.</text><text x="60" y="728" font-size="13" fill="#57534c" font-weight="normal" text-anchor="start" font-family="'Segoe UI', 'Microsoft YaHei', 'PingFang SC', 'Noto Sans SC', Helvetica, Arial, sans-serif">Writing the error as b − Ax, the condition Aᵀ(b − Ax)=0 is the normal equation.</text><text x="60" y="754" font-size="13" fill="#57534c" font-weight="normal" text-anchor="start" font-family="'Segoe UI', 'Microsoft YaHei', 'PingFang SC', 'Noto Sans SC', Helvetica, Arial, sans-serif">The line need not pass through any data point; it minimizes the overall error.</text></svg>
