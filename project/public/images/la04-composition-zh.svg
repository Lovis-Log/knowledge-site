, Arial, sans-serif">det = 1</text><rect x="40" y="578" width="1040" height="124" rx="12" fill="#f3ead9" stroke="none" stroke-width="1"/><text x="60" y="606" font-size="14" fill="#1b2b45" font-weight="bold" text-anchor="start" font-family="'Segoe UI', 'Microsoft YaHei', 'PingFang SC', 'Noto Sans SC', Helvetica, Arial, sans-serif">要点</text><text x="60" y="632" font-size="13" fill="#57534c" font-weight="normal" text-anchor="start" font-family="'Segoe UI', 'Microsoft YaHei', 'PingFang SC', 'Noto Sans SC', Helvetica, Arial, sans-serif">旋转把 î 送到 (0,1)、把 ĵ 送到 (−1,0)；接着的剪切再把它们送到 (1,1) 与 (−1,0)。</text><text x="60" y="658" font-size="13" fill="#57534c" font-weight="normal" text-anchor="start" font-family="'Segoe UI', 'Microsoft YaHei', 'PingFang SC', 'Noto Sans SC', Helvetica, Arial, sans-serif">这两列就是复合矩阵 [[1,−1],[1,0]]；先作用的是右边的矩阵，所以写法是 SR，而不是 RS。</text></svg>
