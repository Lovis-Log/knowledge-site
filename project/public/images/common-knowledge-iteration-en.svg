'PingFang SC', 'Noto Sans SC', Helvetica, Arial, sans-serif">How to read</text><text x="60" y="608" font-size="13" fill="#57534c" font-weight="normal" text-anchor="start" font-family="'Segoe UI', 'Microsoft YaHei', 'PingFang SC', 'Noto Sans SC', Helvetica, Arial, sans-serif">A filled dot means the state is still in the set; a hollow dot means it has been ruled out. The true state is 111.</text><text x="60" y="634" font-size="13" fill="#57534c" font-weight="normal" text-anchor="start" font-family="'Segoe UI', 'Microsoft YaHei', 'PingFang SC', 'Noto Sans SC', Helvetica, Arial, sans-serif">At 111, E≥1 is second-order mutual knowledge but not third-order, hence not common knowledge; the teacher&#39;s announcement is what upgrades it.</text></svg>
