 stroke-width="1.4"/><circle cx="956" cy="300" r="8.5" fill="#1b2b45" stroke="#1b2b45" stroke-width="1.4"/><text x="1008" y="305" font-size="12" fill="#746e64" font-weight="normal" text-anchor="start" font-family="'Segoe UI', 'Microsoft YaHei', 'PingFang SC', 'Noto Sans SC', Helvetica, Arial, sans-serif">4 states</text><text x="40" y="405" font-size="13" fill="#1b2b45" font-weight="bold" text-anchor="start" font-family="'Segoe UI', 'Microsoft YaHei', 'PingFang SC', 'Noto Sans SC', Helvetica, Arial, sans-serif">K²(E≥1) = E3</text><line x1="314" y1="400" x2="982" y2="400" stroke="#e7e1d6" stroke-width="1"/><circle cx="340" cy="400" r="8.5" fill="#fbf9f5" stroke="#d8d0c1" stroke-width="1.4"/><circle cx="428" cy="400" r="8.5" fill="#fbf9f5" stroke="#d8d0c1" stroke-width="1.4"/><circle cx="516" cy="400" r="8.5" fill="#fbf9f5" stroke="#d8d0c1" stroke-width="1.4"/><circle cx="604" cy="400" r="8.5" fill="#fbf9f5" stroke="#d8d0c1" stroke-width="1.4"/><circle cx="692" cy="400" r="8.5" fill="#fbf9f5" stroke="#d8d0c1" stroke-width="1.4"/><circle cx="780" cy="400" r="8.5" fill="#fbf9f5" stroke="#d8d0c1" stroke-width="1.4"/><circle cx="868" cy="400" r="8.5" fill="#fbf9f5" stroke="#d8d0c1" stroke-width="1.4"/><circle cx="956" cy="400" r="8.5" fill="#1b2b45" stroke="#1b2b45" stroke-width="1.4"/><text x="1008" y="405" font-size="12" fill="#746e64" font-weight="normal" text-anchor="start" font-family="'Segoe UI', 'Microsoft YaHei', 'PingFang SC', 'Noto Sans SC', Helvetica, Arial, sans-serif">1 state</text><text x="40" y="505" font-size="13" fill="#746e64" font-weight="bold" text-anchor="start" font-family="'Segoe UI', 'Microsoft YaHei', 'PingFang SC', 'Noto Sans SC', Helvetica, Arial, sans-serif">K³(E≥1) = ∅</text><line x1="314" y1="500" x2="982" y2="500" stroke="#e7e1d6" stroke-width="1"/><circle cx="340" cy="500" r="8.5" fill="#fbf9f5" stroke="#d8d0c1" stroke-width="1.4"/><circle cx="428" cy="500" r="8.5" fill="#fbf9f5" stroke="#d8d0c1" stroke-width="1.4"/><circle cx="516" cy="500"