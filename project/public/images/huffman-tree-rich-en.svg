<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 700" width="1120" height="700" font-family="Segoe UI, Helvetica, Arial, sans-serif" role="img" lang="en"><title>Huffman tree and codes</title><rect width="1120" height="700" fill="#fbf9f5"/><defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1b2b45"/></marker><marker id="ara" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7d5a1e"/></marker></defs><text x="36" y="30" font-size="17" fill="#1b2b45" text-anchor="start" font-weight="bold">Huffman coding: always merge the two smallest</text><text x="36" y="56" font-size="13" fill="#57534c" text-anchor="start" font-weight="normal">Probabilities a .40, b .05, c .18, d .07, e .20, f .10; L = 2.32, H = 2.255.</text><rect x="40" y="96" width="660" height="430" rx="12" fill="#fdfbf7" stroke="#d8d0c1" stroke-width="1"/><text x="56" y="124" font-size="13" fill="#1b2b45" text-anchor="start" font-weight="bold">① The merged tree is the code table</text><line x1="350" y1="158" x2="165" y2="222" stroke="#1b2b45" stroke-width="1.8"/><text x="247.5" y="190.0" font-size="11" fill="#7d5a1e" text-anchor="middle" font-weight="bold">0</text><line x1="350" y1="158" x2="530" y2="222" stroke="#1b2b45" stroke-width="1.8"/><text x="450.0" y="190.0" font-size="11" fill="#7d5a1e" text-anchor="middle" font-weight="bold">1</text><line x1="530" y1="258" x2="440" y2="312" stroke="#1b2b45" stroke-width="1.8"/><text x="475.0" y="285.0" font-size="11" fill="#7d5a1e" text-anchor="middle" font-weight="bold">0</text><line x1="530" y1="258" x2="620" y2="312" stroke="#1b2b45" stroke-width="1.8"/><text x="585.0" y="285.0" font-size="11" fill="#7d5a1e" text-anchor="middle" font-weight="bold">1</text><line x1="440" y1="348" x2="380" y2="402" stroke="#1b2b45" stroke-width="1.8"/><text x="400.0" y="375.0" font-size="11" fill="#7d5a1e" text-anchor="middle" font-weight="bold">0</text><line x1="440" y1="348" x2="510" y2="402" stroke="#1b2b45" stroke-width="1.8"/><text x="485.0" y="375.0" font-size="11" fill="#7d5a1e" text-anchor="middle" font-weight="bold">1</text><line x1="620" y1="348" x2="578" y2="402" stroke="#1b2b45" stroke-width="1.8"/><text x="589.0" y="375.0" font-size="11" fill="#7d5a1e" text-anchor="middle" font-weight="bold">0</text><line x1="620" y1="348" x2="678" y2="402" stroke="#1b2b45" stroke-width="1.8"/><text x="659.0" y="375.0" font-size="11" fill="#7d5a1e" text-anchor="middle" font-weight="bold">1</text><line x1="510" y1="438" x2="470" y2="482" stroke="#1b2b45" stroke-width="1.8"/><text x="480.0" y="460.0" font-size="11" fill="#7d5a1e" text-anchor="middle" font-weight="bold">0</text><line x1="510" y1="438" x2="550" y2="482" stroke="#1b2b45" stroke-width="1.8"/><text x="540.0" y="460.0" font-size="11" fill="#7d5a1e" text-anchor="middle" font-weight="bold">1</text><circle cx="350" cy="140" r="21" fill="#f3ead9" stroke="#1b2b45" stroke-width="1.6"/><text x="350" y="145" font-size="11" fill="#1b2b45" text-anchor="middle" font-weight="bold">1.00</text><circle cx="165" cy="240" r="20" fill="#fbf9f5" stroke="#7d5a1e" stroke-width="2"/><text x="165" y="245" font-size="13" fill="#1b2b45" text-anchor="middle" font-weight="bold">a</text><circle cx="530" cy="240" r="21" fill="#f3ead9" stroke="#1b2b45" stroke-width="1.6"/><text x="530" y="245" font-size="11" fill="#1b2b45" text-anchor="middle" font-weight="bold">.60</text><circle cx="440" cy="330" r="21" fill="#f3ead9" stroke="#1b2b45" stroke-width="1.6"/><text x="440" y="335" font-size="11" fill="#1b2b45" text-anchor="middle" font-weight="bold">.22</text><circle cx="620" cy="330" r="21" fill="#f3ead9" stroke="#1b2b45" stroke-width="1.6"/><text x="620" y="335" font-size="11" fill="#1b2b45" text-anchor="middle" font-weight="bold">.38</text><circle cx="380" cy="420" r="20" fill="#fbf9f5" stroke="#7d5a1e" stroke-width="2"/><text x="380" y="425" font-size="13" fill="#1b2b45" text-anchor="middle" font-weight="bold">f</text><circle cx="510" cy="420" r="21" fill="#f3ead9" stroke="#1b2b45" stroke-width="1.6"/><text x="510" y="425" font-size="11" fill="#1b2b45" text-anchor="middle" font-weight="bold">α .12</text><circle cx="578" cy="420" r="20" fill="#fbf9f5" stroke="#7d5a1e" stroke-width="2"/><text x="578" y="425" font-size="13" fill="#1b2b45" text-anchor="middle" font-weight="bold">c</text><circle cx="678" cy="420" r="20" fill="#fbf9f5" stroke="#7d5a1e" stroke-width="2"/><text x="678" y="425" font-size="13" fill="#1b2b45" text-anchor="middle" font-weight="bold">e</text><circle cx="470" cy="500" r="20" fill="#fbf9f5" stroke="#7d5a1e" stroke-width="2"/><text x="470" y="505" font-size="13" fill="#1b2b45" text-anchor="middle" font-weight="bold">b</text><circle cx="550" cy="500" r="20" fill="#fbf9f5" stroke="#7d5a1e" stroke-width="2"/><text x="550" y="505" font-size="13" fill="#1b2b45" text-anchor="middle" font-weight="bold">d</text><text x="165" y="276" font-size="10.5" fill="#57534c" text-anchor="middle" font-weight="normal">0.40 · 0</text><text x="380" y="456" font-size="10.5" fill="#57534c" text-anchor="middle" font-weight="normal">0.10 · 100</text><text x="470" y="536" font-size="10.5" fill="#57534c" text-anchor="middle" font-weight="normal">0.05 · 1010</text><text x="550" y="536" font-size="10.5" fill="#57534c" text-anchor="middle" font-weight="normal">0.07 · 1011</text><text x="578" y="456" font-size="10.5" fill="#57534c" text-anchor="middle" font-weight="normal">0.18 · 110</text><text x="678" y="456" font-size="10.5" fill="#57534c" text-anchor="middle" font-weight="normal">0.20 · 111</text><text x="56" y="500" font-size="11.5" fill="#57534c" text-anchor="start" font-weight="normal">Left = 0, right = 1; symbols sit only at leaves, so no code is a prefix of another.</text><rect x="720" y="96" width="360" height="430" rx="12" fill="#fdfbf7" stroke="#d8d0c1" stroke-width="1"/><text x="736" y="124" font-size="13" fill="#1b2b45" text-anchor="start" font-weight="bold">② The code table and its cost</text><text x="736" y="158" font-size="11" fill="#57534c" text-anchor="start" font-weight="normal">symbol</text><text x="800" y="158" font-size="11" fill="#57534c" text-anchor="start" font-weight="normal">p</text><text x="856" y="158" font-size="11" fill="#57534c" text-anchor="start" font-weight="normal">code</text><text x="936" y="158" font-size="11" fill="#57534c" text-anchor="start" font-weight="normal">len</text><line x1="736" y1="166" x2="1064" y2="166" stroke="#d8d0c1" stroke-width="1"/><text x="744" y="190" font-size="12.5" fill="#1b2b45" text-anchor="start" font-weight="bold">a</text><text x="806" y="190" font-size="12.5" fill="#57534c" text-anchor="start" font-weight="normal">.40</text><text x="856" y="190" font-size="12.5" fill="#1b2b45" text-anchor="start" font-weight="normal" font-family="Consolas, Cascadia Mono, monospace">0</text><text x="944" y="190" font-size="12.5" fill="#57534c" text-anchor="start" font-weight="normal">1</text><text x="744" y="216" font-size="12.5" fill="#1b2b45" text-anchor="start" font-weight="bold">f</text><text x="806" y="216" font-size="12.5" fill="#57534c" text-anchor="start" font-weight="normal">.10</text><text x="856" y="216" font-size="12.5" fill="#1b2b45" text-anchor="start" font-weight="normal" font-family="Consolas, Cascadia Mono, monospace">100</text><text x="944" y="216" font-size="12.5" fill="#57534c" text-anchor="start" font-weight="normal">3</text><text x="744" y="242" font-size="12.5" fill="#1b2b45" text-anchor="start" font-weight="bold">b</text><text x="806" y="242" font-size="12.5" fill="#57534c" text-anchor="start" font-weight="normal">.05</text><text x="856" y="242" font-size="12.5" fill="#1b2b45" text-anchor="start" font-weight="normal" font-family="Consolas, Cascadia Mono, monospace">1010</text><text x="944" y="242" font-size="12.5" fill="#57534c" text-anchor="start" font-weight="normal">4</text><text x="744" y="268" font-size="12.5" fill="#1b2b45" text-anchor="start" font-weight="bold">d</text><text x="806" y="268" font-size="12.5" fill="#57534c" text-anchor="start" font-weight="normal">.07</text><text x="856" y="268" font-size="12.5" fill="#1b2b45" text-anchor="start" font-weight="normal" font-family="Consolas, Cascadia Mono, monospace">1011</text><text x="944" y="268" font-size="12.5" fill="#57534c" text-anchor="start" font-weight="normal">4</text><text x="744" y="294" font-size="12.5" fill="#1b2b45" text-anchor="start" font-weight="bold">c</text><text x="806" y="294" font-size="12.5" fill="#57534c" text-anchor="start" font-weight="normal">.18</text><text x="856" y="294" font-size="12.5" fill="#1b2b45" text-anchor="start" font-weight="normal" font-family="Consolas, Cascadia Mono, monospace">110</text><text x="944" y="294" font-size="12.5" fill="#57534c" text-anchor="start" font-weight="normal">3</text><text x="744" y="320" font-size="12.5" fill="#1b2b45" text-anchor="start" font-weight="bold">e</text><text x="806" y="320" font-size="12.5" fill="#57534c" text-anchor="start" font-weight="normal">.20</text><text x="856" y="320" font-size="12.5" fill="#1b2b45" text-anchor="start" font-weight="normal" font-family="Consolas, Cascadia Mono, monospace">111</text><text x="944" y="320" font-size="12.5" fill="#57534c" text-anchor="start" font-weight="normal">3</text><line x1="736" y1="356" x2="1064" y2="356" stroke="#d8d0c1" stroke-width="1"/><text x="736" y="384" font-size="12" fill="#1b2b45" text-anchor="start" font-weight="bold">Expected length</text><text x="736" y="408" font-size="12" fill="#1b2b45" text-anchor="start" font-weight="normal" font-family="Consolas, Cascadia Mono, monospace">L = .40·1 + .10·3 + … = 2.32</text><text x="736" y="436" font-size="12" fill="#57534c" text-anchor="start" font-weight="normal">Entropy H ≈ 2.255</text><text x="736" y="462" font-size="12" fill="#7d5a1e" text-anchor="start" font-weight="normal">Theorem: H ≤ L &lt; H + 1</text><text x="736" y="490" font-size="11.5" fill="#57534c" text-anchor="start" font-weight="normal">here 2.255 ≤ 2.32 &lt; 3.255 ✓</text><rect x="40" y="540" width="1040" height="130" rx="12" fill="#f3ead9" stroke="#d8d0c1" stroke-width="1"/><text x="60" y="570" font-size="13" fill="#1b2b45" text-anchor="start" font-weight="bold">Merge order (take the two smallest each time)</text><rect x="60" y="592" width="150" height="42" rx="8" fill="#fbf9f5" stroke="#d8d0c1"/><text x="135.0" y="618" font-size="12" fill="#1b2b45" text-anchor="middle" font-weight="bold">b+d → .12</text><text x="222" y="618" font-size="14" fill="#7d5a1e" text-anchor="middle" font-weight="normal">→</text><rect x="236" y="592" width="150" height="42" rx="8" fill="#fbf9f5" stroke="#d8d0c1"/><text x="311.0" y="618" font-size="12" fill="#1b2b45" text-anchor="middle" font-weight="bold">f+α → .22</text><text x="398" y="618" font-size="14" fill="#7d5a1e" text-anchor="middle" font-weight="normal">→</text><rect x="412" y="592" width="150" height="42" rx="8" fill="#fbf9f5" stroke="#d8d0c1"/><text x="487.0" y="618" font-size="12" fill="#1b2b45" text-anchor="middle" font-weight="bold">c+e → .38</text><text x="574" y="618" font-size="14" fill="#7d5a1e" text-anchor="middle" font-weight="normal">→</text><rect x="588" y="592" width="150" height="42" rx="8" fill="#fbf9f5" stroke="#d8d0c1"/><text x="663.0" y="618" font-size="12" fill="#1b2b45" text-anchor="middle" font-weight="bold">β+γ → .60</text><text x="750" y="618" font-size="14" fill="#7d5a1e" text-anchor="middle" font-weight="normal">→</text><rect x="764" y="592" width="150" height="42" rx="8" fill="#fbf9f5" stroke="#d8d0c1"/><text x="839.0" y="618" font-size="12" fill="#1b2b45" text-anchor="middle" font-weight="bold">a+δ → 1.00</text><text x="60" y="660" font-size="11.5" fill="#57534c" text-anchor="start" font-weight="normal">Each step makes the two shallowest symbols siblings — exactly the two lemmas.</text></svg>