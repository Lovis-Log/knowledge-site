', 'PingFang SC', 'Noto Sans SC', Helvetica, Arial, sans-serif">dr</text><text x="250" y="560" font-size="12.5" fill="#57534c" font-weight="normal" text-anchor="middle" font-family="'Segoe UI', 'Microsoft YaHei', 'PingFang SC', 'Noto Sans SC', Helvetica, Arial, sans-serif">each ring ≈ 2πr·dr</text><rect x="560" y="124" width="520" height="470" rx="14" fill="#fffdf9" stroke="#d8d0c1" stroke-width="1"/><text x="578" y="157" font-size="14" fill="#1b2b45" font-weight="bold" text-anchor="start" font-family="'Segoe UI', 'Microsoft YaHei', 'PingFang SC', 'Noto Sans SC', Helvetica, Arial, sans-serif">② Rings stood upright, tops on the line 2πr</text><line x1="650" y1="218" x2="650" y2="510" stroke="#e7e1d6" stroke-width="0.8"/><line x1="764.46" y1="218" x2="764.46" y2="510" stroke="#e7e1d6" stroke-width="0.8"/><line x1="878.92" y1="218" x2="878.92" y2="510" stroke="#e7e1d6" stroke-width="0.8"/><line x1="993.38" y1="218" x2="993.38" y2="510" stroke="#e7e1d6" stroke-width="0.8"/><line x1="650" y1="510" x2="1022" y2="510" stroke="#e7e1d6" stroke-width="0.8"/><line x1="650" y1="364" x2="1022" y2="364" stroke="#e7e1d6" stroke-width="0.8"/><line x1="650" y1="218" x2="1022" y2="218" stroke="#e7e1d6" stroke-width="0.8"/><line x1="650" y1="510" x2="1022" y2="510" stroke="#d8d0c1" stroke-width="1.2"/><line x1="650" y1="218" x2="650" y2="510" stroke="#d8d0c1" stroke-width="1.2"/><line x1="650" y1="507" x2="650" y2="513" stroke="#d8d0c1" stroke-width="1"/><line x1="764.46" y1="507" x2="764.46" y2="513" stroke="#d8d0c1" stroke-width="1"/><text x="764.46" y="526" font-size="11" fill="#746e64" font-weight="normal" text-anchor="middle" font-family="'Segoe UI', 'Microsoft YaHei', 'PingFang SC', 'Noto Sans SC', Helvetica, Arial, sans-serif">1</text><line x1="878.92" y1="507" x2="878.92" y2="513" stroke="#d8d0c1" stroke-width="1"/><text x="878.92" y="526" font-size="11" fill="#746e64" font-weight="normal" text-anchor="middle" font-family="'Segoe UI', 'Microsoft YaHei', 'PingFang SC', 'Noto Sans SC', Helvetica, Arial, sans-serif">2</text><line x1="993.38" y1="507" x2="993.38" y2="513" stroke="#d8d0c1" stroke-width="1"/><text x="993.38" y="526" font-size="11" fill="#746e64" font-weight="normal" text-anchor="middle" font-family="'Segoe UI', 'Microsoft YaHei', 'PingFang SC', 'Noto Sans SC', Helvetica, Arial, sans-serif">3</text><line x1="647" y1="510" x2="653" y2="510" stroke="#d8d0c1" stroke-width="1"/><line x1="647" y1="364" x2="653" y2="364" stroke="#d8d0c1" stroke-width="1"/><text x="642" y="368" font-size="11" fill="#746e64" font-weight="normal" text-anchor="end" font-family="'Segoe UI', 'Microsoft YaHei', 'PingFang SC', 'Noto Sans SC', Helvetica, Arial, sans-serif">10</text><line x1="647" y1="218" x2="653" y2="218" stroke="#d8d0c1" stroke-width="1"/><text x="642" y="222" font-size="11" fill="#746e64" font-weight="normal" text-anchor="end" font-family="'Segoe UI', 'Microsoft YaHei', 'PingFang SC', 'Noto Sans SC', Helvetica, Arial, sans-serif">20</text><text x="1022" y="544" font-size="11.5" fill="#746e64" font-weight="normal" text-anchor="end" font-family="'Segoe UI', 'Microsoft YaHei', 'PingFang SC', 'Noto Sans SC', Helvetica, Arial, sans-serif">r</text><text x="644" y="200" font-size="11.5" fill="#746e64" font-weight="normal" text-anchor="end" font-family="'Segoe UI', 'Microsoft YaHei', 'PingFang SC', 'Noto Sans SC', Helvetica, Arial, sans-serif">2πr</text><rect x="650" y="510" width="20.86" height="0" rx="0" fill="#f3ead9" stroke="#e7e1d6" stroke-width="0.8"/><rect x="671.46" y="492.8" width="20.86" height="17.2" rx="0" fill="#f3ead9" stroke="#e7e1d6" stroke-width="0.8"/><rect x="692.92" y="475.6" width="20.86" height="34.4" rx="0" fill="#f3ead9" stroke="#e7e1d6" stroke-width="0.8"/><rect x="714.38" y="458.4" width="20.86" height="51.6" rx="0" fill="#f3ead9" stroke="#e7e1d6" stroke-width="0.8"/><rect x="735.85" y="441.2" width="20.86" height="68.8" rx="0" fill="#f3ead9" stroke="#e7e1d6" stroke-width="0.8"/><rect x="757.31" y="424" width="20.86" height="86" rx="0" fill="#f3ead9" stroke="#e7e1d6" stroke-width="0.8"/><rect x="778.77" y="406.8" width="20.86" height="103.2" rx="0" fill="#f3ead9" stroke="#e7e1d6" stroke-width="0.8"/><rect x="800.23" y="389.6" width="20.86" height="120.4" rx="0" fill="#f3ead9" stroke="#e7e1d6" stroke-width="0.8"/><rect x="821.69" y="372.4" width="20.86" height="137.6" rx="0" fill="#f3ead9" stroke="#e7e1d6" stroke-width="0.8"/><rect x="843.15" y="355.2" width="20.86" height="154.8" rx="0" fill="#f3ead9" stroke="#e7e1d6" stroke-width="0.8"/><rect x="864.62" y="338" width="20.86" height="172" rx="0" fill="#f3ead9" stroke="#e7e1d6" stroke-width="0.8"/><rect x="886.08" y="320.8" width="20.86" height="189.2" rx="0" fill="#f3ead9" stroke="#e7e1d6" stroke-width="0.8"/><rect x="907.54" y="303.6" width="20.86" height="206.4" rx="0" fill="#f3ead9" stroke="#e7e1d6" stroke-width="0.8"/><rect x="929" y="286.4" width="20.86" height="223.6" rx="0" fill="#f3ead9" stroke="#e7e1d6" stroke-width="0.8"/><rect x="950.46" y="269.2" width="20.86" height="240.8" rx="0" fill="#f3ead9" stroke="#e7e1d6" stroke-width="0.8"/><rect x="971.92" y="252" width="20.86" height="258" rx="0" fill="#f3ead9" stroke="#e7e1d6" stroke-width="0.8"/><path d="M 650 510 L 993.38 234.8" fill="none" stroke="#7d5a1e" stroke-width="2.6"/><line x1="650" y1="234.8" x2="993.38" y2="234.8" stroke="#9c4a2f" stroke-width="1.2" stroke-dasharray="5 4"/><text x="812.54" y="225.8" font-size="12" fill="#9c4a2f" font-weight="normal" text-anchor="middle" font-family="'Segoe UI', 'Microsoft YaHei', 'PingFang SC', 'Noto Sans SC', Helvetica, Arial, sans-serif">height 2π·3 = 6π</text><rect x="760.01" y="419.08" width="173.72" height="22" rx="4" fill="#fbf9f5" stroke="none" stroke-width="1"/><text x="846.87" y="434.08" font-size="13" fill="#7d5a1e" font-weight="bold" text-anchor="middle" font-family="'Segoe UI', 'Microsoft YaHei', 'PingFang SC', 'Noto Sans SC', Helvetica, Arial, sans-serif">area = ½ · 3 · 6π = 9π</text><rect x="40" y="618" width="1040" height="124" rx="12" fill="#f3ead9" stroke="none" stroke-width="1"/><text x="60" y="646" font-size="14" fill="#1b2b45" font-weight="bold" text-anchor="start" font-family="'Segoe UI', 'Microsoft YaHei', 'PingFang SC', 'Noto Sans SC', Helvetica, Arial, sans-serif">Takeaway</text><text x="60" y="672" font-size="13" fill="#57534c" font-weight="normal" text-anchor="start" font-family="'Segoe UI', 'Microsoft YaHei', 'PingFang SC', 'Noto Sans SC', Helvetica, Arial, sans-serif">A ring&#39;s area is about 2πr·dr: circumference wide, dr thick. Stood upright, the sum is exactly the area under the triangle.</text><text x="60" y="698" font-size="13" fill="#57534c" font-weight="normal" text-anchor="start" font-family="'Segoe UI', 'Microsoft YaHei', 'PingFang SC', 'Noto Sans SC', Helvetica, Arial, sans-serif">Smaller dr hugs the line more tightly, and the true value cannot depend on dr — so the true value is that area.</text></svg>
