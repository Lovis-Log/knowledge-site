<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 782" width="1120" height="782" role="img" lang="en"><rect width="1120" height="782" fill="#fbf9f5"/><text x="40" y="50" font-size="21" fill="#1b2b45" font-weight="bold" text-anchor="start" font-family="'Segoe UI', 'Microsoft YaHei', 'PingFang SC', 'Noto Sans SC', Helvetica, Arial, sans-serif">Why the ring sum equals a triangle&#39;s area</text><text x="40" y="80" font-size="13" fill="#57534c" font-weight="normal" text-anchor="start" font-family="'Segoe UI', 'Microsoft YaHei', 'PingFang SC', 'Noto Sans SC', Helvetica, Arial, sans-serif">Slice the circle into rings, unwrap each into a rectangle, stand them upright</text><rect x="40" y="124" width="480" height="470" rx="14" fill="#fffdf9" stroke="#d8d0c1" stroke-width="1"/><text x="58" y="157" font-size="14" fill="#1b2b45" font-weight="bold" text-anchor="start" font-family="'Segoe UI', 'Microsoft YaHei', 'PingFang SC', 'Noto Sans SC', Helvetica, Arial, sans-serif">① A circle of radius 3, cut into rings</text><circle cx="250" cy="372" r="68.4" fill="none" stroke="#f3ead9" stroke-width="15.2"/><circle cx="250" cy="372" r="60.8" fill="none" stroke="#7d5a1e" stroke-width="1"/><circle cx="250" cy="372" r="76" fill="none" stroke="#7d5a1e" stroke-width="1"/><circle cx="250" cy="372" r="8.11" fill="none" stroke="#e7e1d6" stroke-width="1"/><circle cx="250" cy="372" r="16.21" fill="none" stroke="#e7e1d6" stroke-width="1"/><circle cx="250" cy="372" r="24.32" fill="none" stroke="#e7e1d6" stroke-width="1"/><circle cx="250" cy="372" r="32.43" fill="none" stroke="#e7e1d6" stroke-width="1"/><circle cx="250" cy="372" r="40.53" fill="none" stroke="#e7e1d6" stroke-width="1"/><circle cx="250" cy="372" r="48.64" fill="none" stroke="#e7e1d6" stroke-width="1"/><circle cx="250" cy="372" r="56.75" fill="none" stroke="#e7e1d6" stroke-width="1"/><circle cx="250" cy="372" r="81.07" fill="none" stroke="#e7e1d6" stroke-width="1"/><circle cx="250" cy="372" r="89.17" fill="none" stroke="#e7e1d