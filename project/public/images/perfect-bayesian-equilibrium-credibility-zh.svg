<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 676" width="1120" height="676" role="img" lang="zh"><rect width="1120" height="676" fill="#fbf9f5"/><text x="40" y="50" font-size="21" fill="#1b2b45" font-weight="bold" text-anchor="start" font-family="'Segoe UI', 'Microsoft YaHei', 'PingFang SC', 'Noto Sans SC', Helvetica, Arial, sans-serif">威胁什么时候可信：信念必须把「拒绝」推到最优</text><text x="40" y="80" font-size="13" fill="#57534c" font-weight="normal" text-anchor="start" font-family="'Segoe UI', 'Microsoft YaHei', 'PingFang SC', 'Noto Sans SC', Helvetica, Arial, sans-serif">学校在「没交文书」处的信念 p = 认为学生热情的概率；两条线的相对高低决定威胁成不成立</text><rect x="40" y="116" width="1040" height="372" rx="14" fill="#fffdf9" stroke="#d8d0c1" stroke-width="1"/><line x1="170" y1="194" x2="170" y2="444" stroke="#e7e1d6" stroke-width="0.8"/><line x1="314" y1="194" x2="314" y2="444" stroke="#e7e1d6" stroke-width="0.8"/><line x1="458" y1="194" x2="458" y2="444" stroke="#e7e1d6" stroke-width="0.8"/><line x1="602" y1="194" x2="602" y2="444" stroke="#e7e1d6" stroke-width="0.8"/><line x1="746" y1="194" x2="746" y2="444" stroke="#e7e1d6" stroke-width="0.8"/><line x1="890" y1="194" x2="890" y2="444" stroke="#e7e1d6" stroke-width="0.8"/><line x1="170" y1="444" x2="890" y2="444" stroke="#e7e1d6" stroke-width="0.8"/><line x1="170" y1="394" x2="890" y2="394" stroke="#e7e1d6" stroke-width="0.8"/><line x1="170" y1="344" x2="890" y2="344" stroke="#e7e1d6" stroke-width="0.8"/><line x1="170" y1="294" x2="890" y2="294" stroke="#e7e1d6" stroke-width="0.8"/><line x1="170" y1="244" x2="890" y2="244" stroke="#e7e1d6" stroke-width="0.8"/><line x1="170" y1="194" x2="890" y2="194" stroke="#e7e1d6" stroke-width="0.8"/><line x1="170" y1="444" x2="890" y2="444" stroke="#d8d0c1" stroke-width="1.2"/><line x1="170" y1="194" x2="170" y2="444" stroke="#d8d0c1" stroke-width="1.2"/><line x1="170" y1="441" x2="170" y2="447" stroke="#d8d0c1" stroke-width="1"/><line x1="314" y1="441" x2="314" y2="447" stroke="#d8d0c1" stroke-width="1"/><text x