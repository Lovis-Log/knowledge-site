fill="#9c4a2f" font-weight="bold" text-anchor="start" font-family="'Segoe UI', 'Microsoft YaHei', 'PingFang SC', 'Noto Sans SC', Helvetica, Arial, sans-serif">接受：5p − 2</text><circle cx="458" cy="344" r="5" fill="#7d5a1e" stroke="none" stroke-width="1"/><circle cx="458" cy="344" r="8" fill="none" stroke="#7d5a1e" stroke-width="1"/><circle cx="530" cy="319" r="5" fill="#1b2b45" stroke="none" stroke-width="1"/><circle cx="530" cy="319" r="8" fill="none" stroke="#1b2b45" stroke-width="1"/><circle cx="202.4" cy="204" r="4.5" fill="#7d5a1e" stroke="none" stroke-width="1"/><text x="231.2" y="208" font-size="11.5" fill="#7d5a1e" font-weight="bold" text-anchor="start" font-family="'Segoe UI', 'Microsoft YaHei', 'PingFang SC', 'Noto Sans SC', Helvetica, Arial, sans-serif">p = 2/5：分界点</text><circle cx="202.4" cy="230" r="4.5" fill="#1b2b45" stroke="none" stroke-width="1"/><text x="231.2" y="234" font-size="11.5" fill="#1b2b45" font-weight="bold" text-anchor="start" font-family="'Segoe UI', 'Microsoft YaHei', 'PingFang SC', 'Noto Sans SC', Helvetica, Arial, sans-serif">p = 1/2：混合均衡的信念</text><rect x="40" y="512" width="1040" height="124" rx="12" fill="#f3ead9" stroke="none" stroke-width="1"/><text x="60" y="540" font-size="14" fill="#1b2b45" font-weight="bold" text-anchor="start" font-family="'Segoe UI', 'Microsoft YaHei', 'PingFang SC', 'Noto Sans SC', Helvetica, Arial, sans-serif">读法</text><text x="60" y="566" font-size="13" fill="#57534c" font-weight="normal" text-anchor="start" font-family="'Segoe UI', 'Microsoft YaHei', 'PingFang SC', 'Noto Sans SC', Helvetica, Arial, sans-serif">只要 p ≤ 2/5，「不交就拒」就是序贯理性的，威胁成立；p 一旦超过 2/5，学校宁可录取，威胁垮掉。</text><text x="60" y="592" font-size="13" fill="#57534c" font-weight="normal" text-anchor="start" font-family="'Segoe UI', 'Microsoft YaHei', 'PingFang SC', 'Noto Sans SC', Helvetica, Arial, sans-serif">混合均衡的信念是 1/2，落在接受区——它之所以还能成立，是因为那个信息集根本不会被走到。</text></svg>
