<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 712" width="1120" height="712" role="img" lang="zh"><rect width="1120" height="712" fill="#fbf9f5"/><text x="40" y="50" font-size="21" fill="#1b2b45" font-weight="bold" text-anchor="start" font-family="'Segoe UI', 'Microsoft YaHei', 'PingFang SC', 'Noto Sans SC', Helvetica, Arial, sans-serif">行列式就是面积的缩放倍率</text><text x="40" y="80" font-size="13" fill="#57534c" font-weight="normal" text-anchor="start" font-family="'Segoe UI', 'Microsoft YaHei', 'PingFang SC', 'Noto Sans SC', Helvetica, Arial, sans-serif">两列是 (3, 0) 与 (1, 2)：单位正方形被拉成平行四边形，面积从 1 变成 6</text><rect x="40" y="124" width="460" height="400" rx="14" fill="#fffdf9" stroke="#d8d0c1" stroke-width="1"/><text x="58" y="157" font-size="14" fill="#1b2b45" font-weight="bold" text-anchor="start" font-family="'Segoe UI', 'Microsoft YaHei', 'PingFang SC', 'Noto Sans SC', Helvetica, Arial, sans-serif">① 变换前：单位正方形</text><line x1="242" y1="196" x2="242" y2="446" stroke="#e7e1d6" stroke-width="0.8"/><line x1="324.5" y1="196" x2="324.5" y2="446" stroke="#e7e1d6" stroke-width="0.8"/><line x1="407" y1="196" x2="407" y2="446" stroke="#e7e1d6" stroke-width="0.8"/><line x1="110" y1="312.67" x2="440" y2="312.67" stroke="#e7e1d6" stroke-width="0.8"/><line x1="110" y1="229.33" x2="440" y2="229.33" stroke="#e7e1d6" stroke-width="0.8"/><line x1="110" y1="446" x2="440" y2="446" stroke="#d8d0c1" stroke-width="1.2"/><line x1="110" y1="196" x2="110" y2="446" stroke="#d8d0c1" stroke-width="1.2"/><line x1="242" y1="443" x2="242" y2="449" stroke="#d8d0c1" stroke-width="1"/><text x="242" y="462" font-size="11" fill="#746e64" font-weight="normal" text-anchor="middle" font-family="'Segoe UI', 'Microsoft YaHei', 'PingFang SC', 'Noto Sans SC', Helvetica, Arial, sans-serif">1</text><line x1="324.5" y1="443" x2="324.5" y2="449" stroke="#d8d0c1" stroke-width="1"/><text x="324.5" y="462" font-size="11" fill="#746e64" font-weight="normal" text-anchor="middle" font-family="'Segoe UI', 'Microsoft YaHei', 'PingFang SC', 'Noto Sans SC', Helvetica, Arial, sans-serif">2</text><line x1="407" y1="443" x2="407" y2="449" stroke="#d8d0c1" stroke-width="1"/><text x="407" y="462" font-size="11" fill="#746e64" font-weight="normal" text-anchor="middle" font-family="'Segoe UI', 'Microsoft YaHei', 'PingFang SC', 'Noto Sans SC', Helvetica, Arial, sans-serif">3</text><line x1="107" y1="312.67" x2="113" y2="312.67" stroke="#d8d0c1" stroke-width="1"/><text x="102" y="316.67" font-size="11" fill="#746e64" font-weight="normal" text-anchor="end" font-family="'Segoe UI', 'Microsoft YaHei', 'PingFang SC', 'Noto Sans SC', Helvetica, Arial, sans-serif">1</text><line x1="107" y1="229.33" x2="113" y2="229.33" stroke="#d8d0c1" stroke-width="1"/><text x="102" y="233.33" font-size="11" fill="#746e64" font-weight="normal" text-anchor="end" font-family="'Segoe UI', 'Microsoft YaHei', 'PingFang SC', 'Noto Sans SC', Helvetica, Arial, sans-serif">2</text><text x="440" y="480" font-size="11.5" fill="#746e64" font-weight="normal" text-anchor="end" font-family="'Segoe UI', 'Microsoft YaHei', 'PingFang SC', 'Noto Sans SC', Helvetica, Arial, sans-serif">x</text><text x="98" y="186" font-size="11.5" fill="#746e64" font-weight="normal" text-anchor="end" font-family="'Segoe UI', 'Microsoft YaHei', 'PingFang SC', 'Noto Sans SC', Helvetica, Arial, sans-serif">y</text><polygon points="159.5,396 242,396 242,312.67 159.5,312.67" fill="#f3ead9" stroke="#d8d0c1" stroke-width="1.2"/><line x1="159.5" y1="396" x2="234.35" y2="396" stroke="#9c4a2f" stroke-width="2.4"/><path d="M 242 396 L 233.64 399.34 L 233.64 392.66 Z" fill="#9c4a2f"/><line x1="159.5" y1="396" x2="159.5" y2="320.32" stroke="#9c4a2f" stroke-width="2.4"/><path d="M 159.5 312.67 L 162.84 321.02 L 156.16 321.02 Z" fill="#9c4a2f"/><text x="200.75" y="354.33" font-size="12.5" fill="#7d5a1e" font-weight="bold" text-anchor="middle" font-family="'Segoe UI', 'Microsoft YaHei', 'PingFang SC', 'Noto Sans SC', Helvetica, Arial, sans-serif">面积 = 1</text><rect x="540" y="124" width="540" height="400" rx="14" fill="#fffdf9" stroke="#d8d0c1" stroke-width="1"/><text x="558" y="157" font-size="14" fill="#1b2b45" font-weight="bold" text-anchor="start" font-family="'Segoe UI', 'Microsoft YaHei', 'PingFang SC', 'Noto Sans SC', Helvetica, Arial, sans-serif">② 变换后：平行四边形</text><line x1="743.08" y1="196" x2="743.08" y2="446" stroke="#e7e1d6" stroke-width="0.8"/><line x1="820" y1="196" x2="820" y2="446" stroke="#e7e1d6" stroke-width="0.8"/><line x1="896.92" y1="196" x2="896.92" y2="446" stroke="#e7e1d6" stroke-width="0.8"/><line x1="973.85" y1="196" x2="973.85" y2="446" stroke="#e7e1d6" stroke-width="0.8"/><line x1="620" y1="312.67" x2="1020" y2="312.67" stroke="#e7e1d6" stroke-width="0.8"/><line x1="620" y1="229.33" x2="1020" y2="229.33" stroke="#e7e1d6" stroke-width="0.8"/><line x1="620" y1="446" x2="1020" y2="446" stroke="#d8d0c1" stroke-width="1.2"/><line x1="620" y1="196" x2="620" y2="446" stroke="#d8d0c1" stroke-width="1.2"/><line x1="743.08" y1="443" x2="743.08" y2="449" stroke="#d8d0c1" stroke-width="1"/><text x="743.08" y="462" font-size="11" fill="#746e64" font-weight="normal" text-anchor="middle" font-family="'Segoe UI', 'Microsoft YaHei', 'PingFang SC', 'Noto Sans SC', Helvetica, Arial, sans-serif">1</text><line x1="820" y1="443" x2="820" y2="449" stroke="#d8d0c1" stroke-width="1"/><text x="820" y="462" font-size="11" fill="#746e64" font-weight="normal" text-anchor="middle" font-family="'Segoe UI', 'Microsoft YaHei', 'PingFang SC', 'Noto Sans SC', Helvetica, Arial, sans-serif">2</text><line x1="896.92" y1="443" x2="896.92" y2="449" stroke="#d8d0c1" stroke-width="1"/><text x="896.92" y="462" font-size="11" fill="#746e64" font-weight="normal" text-anchor="middle" font-family="'Segoe UI', 'Microsoft YaHei', 'PingFang SC', 'Noto Sans SC', Helvetica, Arial, sans-serif">3</text><line x1="973.85" y1="443" x2="973.85" y2="449" stroke="#d8d0c1" stroke-width="1"/><text x="973.85" y="462" font-size="11" fill="#746e64" font-weight="normal" text-anchor="middle" font-family="'Segoe UI', 'Microsoft YaHei', 'PingFang SC', 'Noto Sans SC', Helvetica, Arial, sans-serif">4</text><line x1="617" y1="312.67" x2="623" y2="312.67" stroke="#d8d0c1" stroke-width="1"/><text x="612" y="316.67" font-size="11" fill="#746e64" font-weight="normal" text-anchor="end" font-family="'Segoe UI', 'Microsoft YaHei', 'PingFang SC', 'Noto Sans SC', Helvetica, Arial, sans-serif">1</text><line x1="617" y1="229.33" x2="623" y2="229.33" stroke="#d8d0c1" stroke-width="1"/><text x="612" y="233.33" font-size="11" fill="#746e64" font-weight="normal" text-anchor="end" font-family="'Segoe UI', 'Microsoft YaHei', 'PingFang SC', 'Noto Sans SC', Helvetica, Arial, sans-serif">2</text><text x="1020" y="480" font-size="11.5" fill="#746e64" font-weight="normal" text-anchor="end" font-family="'Segoe UI', 'Microsoft YaHei', 'PingFang SC', 'Noto Sans SC', Helvetica, Arial, sans-serif">x</text><text x="608" y="186" font-size="11.5" fill="#746e64" font-weight="normal" text-anchor="end" font-family="'Segoe UI', 'Microsoft YaHei', 'PingFang SC', 'Noto Sans SC', Helvetica, Arial, sans-serif">y</text><polygon points="666.15,396 896.92,396 973.85,229.33 743.08,229.33" fill="#f3ead9" stroke="#d8d0c1" stroke-width="1.2"/><line x1="666.15" y1="396" x2="889.27" y2="396" stroke="#9c4a2f" stroke-width="2.4"/><path d="M 896.92 396 L 888.57 399.34 L 888.57 392.66 Z" fill="#9c4a2f"/><line x1="666.15" y1="396" x2="739.87" y2="236.28" stroke="#9c4a2f" stroke-width="2.4"/><path d="M 743.08 229.33 L 742.61 238.32 L 736.54 235.52 Z" fill="#9c4a2f"/><text x="781.54" y="414" font-size="12" fill="#9c4a2f" font-weight="bold" text-anchor="middle" font-family="'Segoe UI', 'Microsoft YaHei', 'PingFang SC', 'Noto Sans SC', Helvetica, Arial, sans-serif">底 = 3</text><line x1="743.08" y1="229.33" x2="743.08" y2="396" stroke="#9c4a2f" stroke-width="1.2" stroke-dasharray="4 4"/><text x="750.77" y="312.67" font-size="12" fill="#9c4a2f" font-weight="bold" text-anchor="start" font-family="'Segoe UI', 'Microsoft YaHei', 'PingFang SC', 'Noto Sans SC', Helvetica, Arial, sans-serif">高 = 2</text><text x="862.31" y="300.17" font-size="13" fill="#7d5a1e" font-weight="bold" text-anchor="middle" font-family="'Segoe UI', 'Microsoft YaHei', 'PingFang SC', 'Noto Sans SC', Helvetica, Arial, sans-serif">面积 = 6 = det</text><rect x="40" y="548" width="1040" height="124" rx="12" fill="#f3ead9" stroke="none" stroke-width="1"/><text x="60" y="576" font-size="14" fill="#1b2b45" font-weight="bold" text-anchor="start" font-family="'Segoe UI', 'Microsoft YaHei', 'PingFang SC', 'Noto Sans SC', Helvetica, Arial, sans-serif">要点</text><text x="60" y="602" font-size="13" fill="#57534c" font-weight="normal" text-anchor="start" font-family="'Segoe UI', 'Microsoft YaHei', 'PingFang SC', 'Noto Sans SC', Helvetica, Arial, sans-serif">变换把每个网格方块都按同一倍率缩放，所以任意区域的面积都乘上这个倍率——它就是行列式。</text><text x="60" y="628" font-size="13" fill="#57534c" font-weight="normal" text-anchor="start" font-family="'Segoe UI', 'Microsoft YaHei', 'PingFang SC', 'Noto Sans SC', Helvetica, Arial, sans-serif">行列式为 0 表示空间被压扁（两列线性相关）；为负表示定向被翻转，绝对值仍是倍率。</text></svg>
