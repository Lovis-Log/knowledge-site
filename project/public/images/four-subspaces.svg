<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 500" width="920" height="500" font-family="Segoe UI, Helvetica, Arial, sans-serif" role="img"><title>Four fundamental subspaces</title><defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1b2b45"/></marker><marker id="ara" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7d5a1e"/></marker></defs><rect width="920" height="500" fill="#fbf9f5"/><text x="220" y="52" font-size="18" fill="#1b2b45" text-anchor="middle" font-weight="bold">ℝ<tspan dy="-6" font-size="11">n</tspan><tspan dy="6"> </tspan></text><text x="700" y="52" font-size="18" fill="#1b2b45" text-anchor="middle" font-weight="bold">ℝ<tspan dy="-6" font-size="11">m</tspan><tspan dy="6"> </tspan></text><rect x="70" y="75" width="300" height="370" rx="14" fill="none" stroke="#d8d0c1"/><rect x="550" y="75" width="300" height="370" rx="14" fill="none" stroke="#d8d0c1"/><rect x="85" y="95" width="270" height="150" rx="10" fill="#f3ead9" stroke="#d8d0c1"/><text x="220.0" y="164.0" text-anchor="middle" font-size="15" fill="#1b2b45">Row space C(A<tspan dy="-6" font-size="11">T</tspan><tspan dy="6"> </tspan>)</text><text x="220.0" y="188.0" text-anchor="middle" font-size="13" fill="#57534c">dim r</text><rect x="85" y="265" width="270" height="160" rx="10" fill="#f3ead9" stroke="#d8d0c1"/><text x="220.0" y="339.0" text-anchor="middle" font-size="15" fill="#1b2b45">Nullspace N(A)</text><text x="220.0" y="363.0" text-anchor="middle" font-size="13" fill="#57534c">dim n − r</text><rect x="565" y="95" width="270" height="150" rx="10" fill="#f3ead9" stroke="#d8d0c1"/><text x="700.0" y="164.0" text-anchor="middle" font-size="15" fill="#1b2b45">Column space C(A)</text><text x="700.0" y="188.0" text-anchor="middle" font-size="13" fill="#57534c">dim r</text><rect x="565" y="265" width="270" height="160" rx="10" fill="#f3ead9" stroke="#d8d0c1"/><text x="700.0" y="339.0" text-anchor="middle" font-size="15" fill="#1b2b45">Left nullspace N(A<tspan dy="-6" font-size="11">T</tspan><tspan dy="6"> </tspan>)</text><text x="700.0" y="363.0" text-anchor="middle" font-size="13" fill="#57534c">dim m − r</text><line x1="385" y1="170" x2="540" y2="170" stroke="#7d5a1e" stroke-width="2.5" marker-end="url(#ara)"/><text x="462" y="158" font-size="16" fill="#7d5a1e" text-anchor="middle" font-weight="bold">A</text><line x1="385" y1="345" x2="540" y2="345" stroke="#57534c" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#ar)"/><text x="462" y="333" font-size="16" fill="#57534c" text-anchor="middle" font-weight="normal">0</text><text x="460" y="470" font-size="14" fill="#57534c" text-anchor="middle" font-weight="normal">dimensions:  r + (n − r) = n,   r + (m − r) = m</text></svg>