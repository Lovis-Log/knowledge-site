-serif">How to read this</text><circle cx="762" cy="188" r="3" fill="#e0b878" stroke="none" stroke-width="1"/><text x="774" y="192" font-size="12" fill="#57534c" font-weight="normal" text-anchor="start" font-family="'Segoe UI', 'Microsoft YaHei', 'PingFang SC', 'Noto Sans SC', Helvetica, Arial, sans-serif">Solid: the concave utility function u(x) = √x.</text><circle cx="762" cy="222.6" r="3" fill="#e0b878" stroke="none" stroke-width="1"/><text x="774" y="226.6" font-size="12" fill="#57534c" font-weight="normal" text-anchor="start" font-family="'Segoe UI', 'Microsoft YaHei', 'PingFang SC', 'Noto Sans SC', Helvetica, Arial, sans-serif">Dashed: the chord from 0 to 1000, expectation</text><text x="774" y="245.2" font-size="12" fill="#57534c" font-weight="normal" text-anchor="start" font-family="'Segoe UI', 'Microsoft YaHei', 'PingFang SC', 'Noto Sans SC', Helvetica, Arial, sans-serif">first, then utility.</text><circle cx="762" cy="275.8" r="3" fill="#e0b878" stroke="none" stroke-width="1"/><text x="774" y="279.8" font-size="12" fill="#57534c" font-weight="normal" text-anchor="start" font-family="'Segoe UI', 'Microsoft YaHei', 'PingFang SC', 'Noto Sans SC', Helvetica, Arial, sans-serif">Chord at 500 gives expected utility 15.8.</text><circle cx="762" cy="310.4" r="3" fill="#e0b878" stroke="none" stroke-width="1"/><text x="774" y="314.4" font-size="12" fill="#57534c" font-weight="normal" text-anchor="start" font-family="'Segoe UI', 'Microsoft YaHei', 'PingFang SC', 'Noto Sans SC', Helvetica, Arial, sans-serif">Curve at 500 gives u(500) = 22.4.</text><rect x="758" y="374" width="304" height="58" rx="10" fill="#f3ead9" stroke="none" stroke-width="1"/><text x="772" y="398" font-size="12.5" fill="#7d5a1e" font-weight="bold" text-anchor="start" font-family="'Segoe UI', 'Microsoft YaHei', 'PingFang SC', 'Noto Sans SC', Helvetica, Arial, sans-serif">The 6.6-unit gap equals a 250-dollar risk</text><text x="772" y="416.75" font-size="12.5" fill="#7d5a1e" font-weight="bold" text-anchor="start" font-family="'Segoe UI', 'Microsoft YaHei', 'PingFang SC', 'Noto Sans SC', Helvetica, Arial, sans-serif">premium.</text><rect x="40" y="548.02" width="1040" height="124" rx="12" fill="#f3ead9" stroke="none" stroke-width="1"/><text x="60" y="576.02" font-size="14" fill="#1b2b45" font-weight="bold" text-anchor="start" font-family="'Segoe UI', 'Microsoft YaHei', 'PingFang SC', 'Noto Sans SC', Helvetica, Arial, sans-serif">Takeaway</text><text x="60" y="602.02" font-size="13" fill="#57534c" font-weight="normal" text-anchor="start" font-family="'Segoe UI', 'Microsoft YaHei', 'PingFang SC', 'Noto Sans SC', Helvetica, Arial, sans-serif">Concavity makes u(expected value) exceed expected utility; the gap is what the person pays to remove the risk.</text><text x="60" y="628.02" font-size="13" fill="#57534c" font-weight="normal" text-anchor="start" font-family="'Segoe UI', 'Microsoft YaHei', 'PingFang SC', 'Noto Sans SC', Helvetica, Arial, sans-serif">The further apart the two outcomes, the wider the gap between chord and curve, and the larger the risk premium.</text></svg>
