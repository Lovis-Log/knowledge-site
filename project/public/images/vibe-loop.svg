    <text x="420" y="214" font-size="11" fill="#6E6A63">一次一个</text>
    <text x="585" y="214" font-size="11" fill="#6E6A63">验收 + 审查</text>
    <text x="750" y="214" font-size="11" fill="#6E6A63">真实环境</text>
    <text x="400" y="290" font-size="13" fill="#6E6A63">每一轮结束都留下一个可以回退的提交</text>
