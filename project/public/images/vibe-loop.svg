<svg xmlns="http://www.w3.org/2000/svg" width="800" height="340" viewBox="0 0 800 340" role="img" aria-label="Vibe coding 的五步循环">
  <rect width="800" height="340" fill="#FBF9F4"/>
  <g fill="none" stroke="#9A3412" stroke-width="1.6">
    <circle cx="90" cy="120" r="34"/>
    <circle cx="255" cy="120" r="34"/>
    <circle cx="420" cy="120" r="34"/>
    <circle cx="585" cy="120" r="34"/>
    <circle cx="750" cy="120" r="34"/>
    <path d="M124 120 H221 M289 120 H386 M454 120 H551 M619 120 H716"/>
  </g>
  <g fill="#1F1E1B" font-family="system-ui, 'PingFang SC', 'Microsoft YaHei', sans-serif" text-anchor="middle">
    <text x="90" y="126" font-size="20" fill="#9A3412">1</text>
    <text x="255" y="126" font-size="20" fill="#9A3412">2</text>
    <text x="420" y="126" font-size="20" fill="#9A3412">3</text>
    <text x="585" y="126" font-size="20" fill="#9A3412">4</text>
    <text x="750" y="126" font-size="20" fill="#9A3412">5</text>
    <text x="90" y="190" font-size="16">规划</text>
    <text x="255" y="190" font-size="16">定界面</text>
    <text x="420" y="190" font-size="16">做功能</text>
    <text x="585" y="190" font-size="16">自检</text>
    <text x="750" y="190" font-size="16">部署</text>
    <text x="90" y="214" font-size="11" fill="#6E6A63">需求清单</text>
