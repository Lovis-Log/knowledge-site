<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 744" width="1120" height="744" role="img" lang="zh"><rect width="1120" height="744" fill="#fbf9f5"/><text x="40" y="50" font-size="21" fill="#1b2b45" font-weight="bold" text-anchor="start" font-family="'Segoe UI', 'Microsoft YaHei', 'PingFang SC', 'Noto Sans SC', Helvetica, Arial, sans-serif">先出价值多少：v/(1+δ) 与 δv/(1+δ)</text><text x="40" y="80" font-size="13" fill="#57534c" font-weight="normal" text-anchor="start" font-family="'Segoe UI', 'Microsoft YaHei', 'PingFang SC', 'Noto Sans SC', Helvetica, Arial, sans-serif">买方估值为 v = 1 时的均衡成交价；两条曲线的差距就是先动优势</text><line x1="170" y1="178" x2="170" y2="518" stroke="#e7e1d6" stroke-width="0.8"/><line x1="300" y1="178" x2="300" y2="518" stroke="#e7e1d6" stroke-width="0.8"/><line x1="430" y1="178" x2="430" y2="518" stroke="#e7e1d6" stroke-width="0.8"/><line x1="560" y1="178" x2="560" y2="518" stroke="#e7e1d6" stroke-width="0.8"/><line x1="690" y1="178" x2="690" y2="518" stroke="#e7e1d6" stroke-width="0.8"/><line x1="170" y1="348" x2="690" y2="348" stroke="#e7e1d6" stroke-width="0.8"/><line x1="170" y1="178" x2="690" y2="178" stroke="#e7e1d6" stroke-width="0.8"/><line x1="170" y1="518" x2="690" y2="518" stroke="#d8d0c1" stroke-width="1.2"/><line x1="170" y1="178" x2="170" y2="518" stroke="#d8d0c1" stroke-width="1.2"/><line x1="170" y1="515" x2="170" y2="521" stroke="#d8d0c1" stroke-width="1"/><line x1="300" y1="515" x2="300" y2="521" stroke="#d8d0c1" stroke-width="1"/><text x="300" y="534" font-size="11" fill="#746e64" font-weight="normal" text-anchor="middle" font-family="'Segoe UI', 'Microsoft YaHei', 'PingFang SC', 'Noto Sans SC', Helvetica, Arial, sans-serif">0.25</text><line x1="430" y1="515" x2="430" y2="521" stroke="#d8d0c1" stroke-width="1"/><text x="430" y="534" font-size="11" fill="#746e64" font-weight="normal" text-anchor="middle" font-family="'Segoe UI', 'Microsoft YaHei', 'PingFang SC', 'Noto Sans SC', Helvetica, Arial, sans-serif">0.5</text><line x1="560" y1="515" x2="560" y2="521" stroke="#d8d0c1" stroke-width="1"/><text x="560" y="534" font-size="11" fill="#746e64" font-weight="normal" text-anchor="middle" font-family="'Segoe UI', 'Microsoft YaHei', 'PingFang SC', 'Noto Sans SC', Helvetica, Arial, sans-serif">0.75</text><line x1="690" y1="515" x2="690" y2="521" stroke="#d8d0c1" stroke-width="1"/><text x="690" y="534" font-size="11" fill="#746e64" font-weight="normal" text-anchor="middle" font-family="'Segoe UI', 'Microsoft YaHei', 'PingFang SC', 'Noto Sans SC', Helvetica, Arial, sans-serif">1</text><line x1="167" y1="348" x2="173" y2="348" stroke="#d8d0c1" stroke-width="1"/><text x="162" y="352" font-size="11" fill="#746e64" font-weight="normal" text-anchor="end" font-family="'Segoe UI', 'Microsoft YaHei', 'PingFang SC', 'Noto Sans SC', Helvetica, Arial, sans-serif">0.5</text><line x1="167" y1="178" x2="173" y2="178" stroke="#d8d0c1" stroke-width="1"/><text x="162" y="182" font-size="11" fill="#746e64" font-weight="normal" text-anchor="end" font-family="'Segoe UI', 'Microsoft YaHei', 'PingFang SC', 'Noto Sans SC', Helvetica, Arial, sans-serif">1</text><text x="690" y="552" font-size="11.5" fill="#746e64" font-weight="normal" text-anchor="end" font-family="'Segoe UI', 'Microsoft YaHei', 'PingFang SC', 'Noto Sans SC', Helvetica, Arial, sans-serif">δ（折现因子）</text><text x="160" y="170" font-size="11.5" fill="#746e64" font-weight="normal" text-anchor="end" font-family="'Segoe UI', 'Microsoft YaHei', 'PingFang SC', 'Noto Sans SC', Helvetica, Arial, sans-serif">p（成交价格）</text><path d="M 170 178 L 183 186.29 L 196 194.19 L 209 201.72 L 222 208.91 L 235 215.78 L 248 222.35 L 261 228.64 L 274 234.67 L 287 240.45 L 300 246 L 313 251.33 L 326 256.46 L 339 261.4 L 352 266.15 L 365 270.73 L 378 275.14 L 391 279.4 L 404 283.52 L 417 287.49 L 430 291.33 L 443 295.05 L 456 298.65 L 469 302.13 L 482 305.5 L 495 308.77 L 508 311.94 L 521 315.01 L 534 318 L 547 320.9 L 560 323.71 L 573 326.45 L 586 329.11 L 599 331.7 L 612 334.22 L 625 336.67 L 638 339.05 L 651 341.38 L 664 343.64 L 677 345.85 L 690 348" fill="none" stroke="#1b2b45" stroke-width="2.6"/><path d="M 170 518 L 183 509.71 L 196 501.81 L 209 494.28 L 222 487.09 L 235 480.22 L 248 473.65 L 261 467.36 L 274 461.33 L 287 455.55 L 300 450 L 313 444.67 L 326 439.54 L 339 434.6 L 352 429.85 L 365 425.27 L 378 420.86 L 391 416.6 L 404 412.48 L 417 408.51 L 430 404.67 L 443 400.95 L 456 397.35 L 469 393.87 L 482 390.5 L 495 387.23 L 508 384.06 L 521 380.99 L 534 378 L 547 375.1 L 560 372.29 L 573 369.55 L 586 366.89 L 599 364.3 L 612 361.78 L 625 359.33 L 638 356.95 L 651 354.62 L 664 352.36 L 677 350.15 L 690 348" fill="none" stroke="#7d5a1e" stroke-width="2.6"/><path d="M 170 348 L 690 348" fill="none" stroke="#d8d0c1" stroke-width="1.4" stroke-dasharray="6 5"/><text x="466" y="286.65" font-size="12.5" fill="#1b2b45" font-weight="bold" text-anchor="start" font-family="'Segoe UI', 'Microsoft YaHei', 'PingFang SC', 'Noto Sans SC', Helvetica, Arial, sans-serif">卖方先出价 v/(1+δ)</text><text x="466" y="419.35" font-size="12.5" fill="#7d5a1e" font-weight="bold" text-anchor="start" font-family="'Segoe UI', 'Microsoft YaHei', 'PingFang SC', 'Noto Sans SC', Helvetica, Arial, sans-serif">买方先出价 δv/(1+δ)</text><line x1="274" y1="461.33" x2="274" y2="237.47" stroke="#9c4a2f" stroke-width="1.6"/><path d="M 274 230.67 L 276.97 238.1 L 271.03 238.1 Z" fill="#9c4a2f"/><rect x="282" y="314" width="46" height="20" rx="0" fill="#fbf9f5" stroke="none" stroke-width="1"/><text x="284" y="329" font-size="11.5" fill="#9c4a2f" font-weight="bold" text-anchor="start" font-family="'Segoe UI', 'Microsoft YaHei', 'PingFang SC', 'Noto Sans SC', Helvetica, Arial, sans-serif">先动优势</text><circle cx="690" cy="348" r="5" fill="#1b2b45" stroke="none" stroke-width="1"/><text x="680" y="338" font-size="12.5" fill="#746e64" font-weight="bold" text-anchor="end" font-family="'Segoe UI', 'Microsoft YaHei', 'PingFang SC', 'Noto Sans SC', Helvetica, Arial, sans-serif">v/2</text><text x="720" y="205.2" font-size="13.5" fill="#1b2b45" font-weight="bold" text-anchor="start" font-family="'Segoe UI', 'Microsoft YaHei', 'PingFang SC', 'Noto Sans SC', Helvetica, Arial, sans-serif">δ → 1 时</text><text x="720" y="229.2" font-size="12.5" fill="#57534c" font-weight="normal" text-anchor="start" font-family="'Segoe UI', 'Microsoft YaHei', 'PingFang SC', 'Noto Sans SC', Helvetica, Arial, sans-serif">双方都极有耐心，先动优势消失，价格收敛到 v/2。</text><text x="720" y="305.2" font-size="12.5" fill="#57534c" font-weight="normal" text-anchor="start" font-family="'Segoe UI', 'Microsoft YaHei', 'PingFang SC', 'Noto Sans SC', Helvetica, Arial, sans-serif">δ 也可以读成「报价间隔」：每毫秒还一次价，谁先说</text><text x="720" y="325.2" font-size="12.5" fill="#57534c" font-weight="normal" text-anchor="start" font-family="'Segoe UI', 'Microsoft YaHei', 'PingFang SC', 'Noto Sans SC', Helvetica, Arial, sans-serif">就无关紧要。</text><rect x="40" y="580.02" width="1040" height="124" rx="12" fill="#f3ead9" stroke="none" stroke-width="1"/><text x="60" y="608.02" font-size="14" fill="#1b2b45" font-weight="bold" text-anchor="start" font-family="'Segoe UI', 'Microsoft YaHei', 'PingFang SC', 'Noto Sans SC', Helvetica, Arial, sans-serif">要点</text><text x="60" y="634.02" font-size="13" fill="#57534c" font-weight="normal" text-anchor="start" font-family="'Segoe UI', 'Microsoft YaHei', 'PingFang SC', 'Noto Sans SC', Helvetica, Arial, sans-serif">先出价者能报出对对方不利、但对方仍愿意接受的价，把等待成本转嫁出去。</text><text x="60" y="660.02" font-size="13" fill="#57534c" font-weight="normal" text-anchor="start" font-family="'Segoe UI', 'Microsoft YaHei', 'PingFang SC', 'Noto Sans SC', Helvetica, Arial, sans-serif">δ 越小（越不耐烦），两条曲线差距越大，先动者榨取越多。</text></svg>
