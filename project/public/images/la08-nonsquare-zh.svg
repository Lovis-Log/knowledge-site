lvetica, Arial, sans-serif">2 维</text><text x="420" y="528" font-size="10.5" fill="#746e64" font-weight="normal" text-anchor="start" font-family="'Segoe UI', 'Microsoft YaHei', 'PingFang SC', 'Noto Sans SC', Helvetica, Arial, sans-serif">1 维</text><line x1="168" y1="478" x2="216.05" y2="478" stroke="#d8d0c1" stroke-width="1.4"/><path d="M 222 478 L 215.5 480.6 L 215.5 475.4 Z" fill="#d8d0c1"/><rect x="246" y="468" width="26" height="20" rx="0" fill="#fffdf9" stroke="#d8d0c1" stroke-width="1"/><rect x="272" y="468" width="26" height="20" rx="0" fill="#fffdf9" stroke="#d8d0c1" stroke-width="1"/><text x="272" y="458" font-size="12" fill="#7d5a1e" font-weight="bold" text-anchor="middle" font-family="'Segoe UI', 'Microsoft YaHei', 'PingFang SC', 'Noto Sans SC', Helvetica, Arial, sans-serif">1×2</text><line x1="310" y1="478" x2="350.05" y2="478" stroke="#d8d0c1" stroke-width="1.4"/><path d="M 356 478 L 349.5 480.6 L 349.5 475.4 Z" fill="#d8d0c1"/><text x="520" y="466" font-size="12.5" fill="#1b2b45" font-weight="bold" text-anchor="start" font-family="'Segoe UI', 'Microsoft YaHei', 'PingFang SC', 'Noto Sans SC', Helvetica, Arial, sans-serif">平面 → 数轴</text><text x="520" y="488" font-size="11" fill="#57534c" font-weight="normal" text-anchor="start" font-family="'Segoe UI', 'Microsoft YaHei', 'PingFang SC', 'Noto Sans SC', Helvetica, Arial, sans-serif">2 个输入坐标，1 个输出坐标；整个平面被压到一条数轴上。</text><rect x="40" y="618" width="1040" height="124" rx="12" fill="#f3ead9" stroke="none" stroke-width="1"/><text x="60" y="646" font-size="14" fill="#1b2b45" font-weight="bold" text-anchor="start" font-family="'Segoe UI', 'Microsoft YaHei', 'PingFang SC', 'Noto Sans SC', Helvetica, Arial, sans-serif">要点</text><text x="60" y="672" font-size="13" fill="#57534c" font-weight="normal" text-anchor="start" font-family="'Segoe UI', 'Microsoft YaHei', 'PingFang SC', 'Noto Sans SC', Helvetica, Arial, sans-serif">看一个矩阵先看形状：m 行 n 列就是从 n 维到 m 维的线性变换。</text><text x="60" y="698" font-size="13" fill="#57534c" font-weight="normal" text-anchor="start" font-family="'Segoe UI', 'Microsoft YaHei', 'PingFang SC', 'Noto Sans SC', Helvetica, Arial, sans-serif">列数决定需要几个基向量，行数决定每个落点有几个坐标；这就是“非方阵”的全部秘密。</text></svg>
