">ĵ</text><text x="258" y="344" font-size="12.5" fill="#c9d5e6" font-weight="bold" text-anchor="start" font-family="'Segoe UI', 'Microsoft YaHei', 'PingFang SC', 'Noto Sans SC', Helvetica, Arial, sans-serif">k̂</text><text x="64" y="520" font-size="10.5" fill="#57534c" font-weight="normal" text-anchor="start" font-family="'Segoe UI', 'Microsoft YaHei', 'PingFang SC', 'Noto Sans SC', Helvetica, Arial, sans-serif">î=(1,0,0)   ĵ=(0,1,0)   k̂=(0,0,1)</text><rect x="580" y="124" width="500" height="430" rx="14" fill="#fffdf9" stroke="#d8d0c1" stroke-width="1"/><text x="598" y="157" font-size="14" fill="#1b2b45" font-weight="bold" text-anchor="start" font-family="'Segoe UI', 'Microsoft YaHei', 'PingFang SC', 'Noto Sans SC', Helvetica, Arial, sans-serif">② After a 90° turn</text><line x1="790" y1="400" x2="898.16" y2="462.45" stroke="#d8d0c1" stroke-width="1.2"/><path d="M 902.58 465 L 896.64 464.14 L 898.87 460.29 Z" fill="#d8d0c1"/><text x="908.58" y="469" font-size="11" fill="#746e64" font-weight="normal" text-anchor="start" font-family="'Segoe UI', 'Microsoft YaHei', 'PingFang SC', 'Noto Sans SC', Helvetica, Arial, sans-serif">x</text><line x1="790" y1="400" x2="681.84" y2="462.45" stroke="#d8d0c1" stroke-width="1.2"/><path d="M 677.42 465 L 681.13 460.29 L 683.36 464.14 Z" fill="#d8d0c1"/><text x="673.42" y="457" font-size="11" fill="#746e64" font-weight="normal" text-anchor="start" font-family="'Segoe UI', 'Microsoft YaHei', 'PingFang SC', 'Noto Sans SC', Helvetica, Arial, sans-serif">y</text><line x1="790" y1="400" x2="790" y2="285.5" stroke="#d8d0c1" stroke-width="1.2"/><path d="M 790 280.4 L 792.23 285.97 L 787.77 285.97 Z" fill="#d8d0c1"/><text x="786" y="272.4" font-size="11" fill="#746e64" font-weight="normal" text-anchor="start" font-family="'Segoe UI', 'Microsoft YaHei', 'PingFang SC', 'Noto Sans SC', Helvetica, Arial, sans-serif">z</text><line x1="790" y1="504" x2="790" y2="400" stroke="#d8d0c1" stroke-width="1.2"/><line x1="790" y1="504" x2="744.97" y2="530