<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 742" width="1120" height="742" role="img" lang="zh"><rect width="1120" height="742" fill="#fbf9f5"/><text x="40" y="50" font-size="21" fill="#1b2b45" font-weight="bold" text-anchor="start" font-family="'Segoe UI', 'Microsoft YaHei', 'PingFang SC', 'Noto Sans SC', Helvetica, Arial, sans-serif">三个求导公式，都能从一个图形里读出来</text><text x="40" y="80" font-size="13" fill="#57534c" font-weight="normal" text-anchor="start" font-family="'Segoe UI', 'Microsoft YaHei', 'PingFang SC', 'Noto Sans SC', Helvetica, Arial, sans-serif">正方形撑大给出 d(x²)=2x·dx；圆上走一小步给出 d(sinθ)=cosθ·dθ</text><rect x="40" y="124" width="340" height="430" rx="14" fill="#fffdf9" stroke="#d8d0c1" stroke-width="1"/><text x="58" y="157" font-size="14" fill="#1b2b45" font-weight="bold" text-anchor="start" font-family="'Segoe UI', 'Microsoft YaHei', 'PingFang SC', 'Noto Sans SC', Helvetica, Arial, sans-serif">① 正方形：d(x²) = 2x·dx</text><rect x="86" y="248" width="140" height="140" rx="0" fill="#faf4e9" stroke="#d8d0c1" stroke-width="1.2"/><rect x="226" y="248" width="24" height="140" rx="0" fill="#7d5a1e" stroke="#d8d0c1" stroke-width="1" opacity="0.28"/><rect x="86" y="224" width="140" height="24" rx="0" fill="#7d5a1e" stroke="#d8d0c1" stroke-width="1" opacity="0.28"/><rect x="226" y="224" width="24" height="24" rx="0" fill="#9c4a2f" stroke="#d8d0c1" stroke-width="1" opacity="0.4"/><text x="156" y="410" font-size="12.5" fill="#57534c" font-weight="normal" text-anchor="middle" font-family="'Segoe UI', 'Microsoft YaHei', 'PingFang SC', 'Noto Sans SC', Helvetica, Arial, sans-serif">x</text><text x="74" y="322" font-size="12.5" fill="#57534c" font-weight="normal" text-anchor="end" font-family="'Segoe UI', 'Microsoft YaHei', 'PingFang SC', 'Noto Sans SC', Helvetica, Arial, sans-serif">x</text><text x="238" y="410" font-size="11" fill="#9c4a2f" font-weight="normal" text-anchor="middle" font-family="'Segoe UI', 'Microsoft YaHei', 'PingFang SC', 'Noto Sans SC', Helvetica, Arial, sans-serif">dx</text><text x="156" y="240" font-size="10.5" fill="#7d5a1e" font-weight="bold" text-anchor="middle" font-family="'Segoe UI', 'Microsoft YaHei', 'PingFang SC', 'Noto Sans SC', Helvetica, Arial, sans-serif">x·dx</text><line x1="250" y1="318" x2="290" y2="318" stroke="#7d5a1e" stroke-width="1"/><text x="294" y="322" font-size="11" fill="#7d5a1e" font-weight="bold" text-anchor="start" font-family="'Segoe UI', 'Microsoft YaHei', 'PingFang SC', 'Noto Sans SC', Helvetica, Arial, sans-serif">x·dx</text><line x1="238" y1="236" x2="288" y2="218" stroke="#9c4a2f" stroke-width="1"/><text x="292" y="222" font-size="11" fill="#9c4a2f" font-weight="bold" text-anchor="start" font-family="'Segoe UI', 'Microsoft YaHei', 'PingFang SC', 'Noto Sans SC', Helvetica, Arial, sans-serif">dx²</text><text x="58" y="452" font-size="11.5" fill="#57534c" font-weight="normal" text-anchor="start" font-family="'Segoe UI', 'Microsoft YaHei', 'PingFang SC', 'Noto Sans SC', Helvetica, Arial, sans-serif">面积增量 = 2x·dx + dx²；除以 dx 后，dx² 消失。</text><rect x="390" y="124" width="340" height="430" rx="14" fill="#fffdf9" stroke="#d8d0c1" stroke-width="1"/><text x="408" y="157" font-size="14" fill="#1b2b45" font-weight="bold" text-anchor="start" font-family="'Segoe UI', 'Microsoft YaHei', 'PingFang SC', 'Noto Sans SC', Helvetica, Arial, sans-serif">② 单位圆：大三角形</text><path d="M 654.0 352.0 L 653.9 346.6 L 653.4 341.1 L 652.7 335.7 L 651.7 330.4 L 650.5 325.1 L 648.9 319.9 L 647.1 314.7 L 645.0 309.7 L 642.7 304.8 L 640.1 300.0 L 637.2 295.4 L 634.1 290.9 L 630.8 286.6 L 627.3 282.4 L 623.5 278.5 L 619.6 274.7 L 615.4 271.2 L 611.1 267.9 L 606.6 264.8 L 602.0 261.9 L 597.2 259.3 L 592.3 257.0 L 587.3 254.9 L 582.1 253.1 L 576.9 251.5 L 571.6 250.3 L 566.3 249.3 L 560.9 248.6 L 555.4 248.1 L 550.0 248.0 L 544.6 248.1 L 539.1 248.6 L 533.7 249.3 L 528.4 250.3 L 523.1 251.5 L 517.9 253.1 L 512.7 254.9 L 507.7 257.0 L 502.8 259.3 L 498.0 261.9 L 493.4 264.8 L 488.9 267.9 L 484.6 271.2 L 480.4 274.7