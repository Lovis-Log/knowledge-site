th="1.2"/><text x="598" y="336" font-size="12.5" fill="#9c4a2f" font-weight="bold" text-anchor="start" font-family="'Segoe UI', 'Microsoft YaHei', 'PingFang SC', 'Noto Sans SC', Helvetica, Arial, sans-serif">θ</text><text x="580" y="306" font-size="12.5" fill="#7d5a1e" font-weight="bold" text-anchor="middle" font-family="'Segoe UI', 'Microsoft YaHei', 'PingFang SC', 'Noto Sans SC', Helvetica, Arial, sans-serif">1</text><text x="589.83" y="372" font-size="12" fill="#7d5a1e" font-weight="bold" text-anchor="middle" font-family="'Segoe UI', 'Microsoft YaHei', 'PingFang SC', 'Noto Sans SC', Helvetica, Arial, sans-serif">cosθ</text><text x="637.67" y="318.58" font-size="12" fill="#9c4a2f" font-weight="bold" text-anchor="start" font-family="'Segoe UI', 'Microsoft YaHei', 'PingFang SC', 'Noto Sans SC', Helvetica, Arial, sans-serif">sinθ</text><circle cx="629.67" cy="285.15" r="3.4" fill="#1b2b45" stroke="none" stroke-width="1"/><text x="637.67" y="277.15" font-size="12" fill="#1b2b45" font-weight="bold" text-anchor="start" font-family="'Segoe UI', 'Microsoft YaHei', 'PingFang SC', 'Noto Sans SC', Helvetica, Arial, sans-serif">P</text><text x="408" y="486" font-size="11.5" fill="#57534c" font-weight="normal" text-anchor="start" font-family="'Segoe UI', 'Microsoft YaHei', 'PingFang SC', 'Noto Sans SC', Helvetica, Arial, sans-serif">半径 = 1，邻边 = cosθ，对边 = sinθ</text><rect x="740" y="124" width="340" height="430" rx="14" fill="#fffdf9" stroke="#d8d0c1" stroke-width="1"/><text x="758" y="157" font-size="14" fill="#1b2b45" font-weight="bold" text-anchor="start" font-family="'Segoe UI', 'Microsoft YaHei', 'PingFang SC', 'Noto Sans SC', Helvetica, Arial, sans-serif">③ 放大：小三角形相似</text><polygon points="896,455 762,295 896,295" fill="#faf4e9" stroke="none" stroke-width="1"/><line x1="896" y1="455" x2="896" y2="295" stroke="#7d5a1e" stroke-width="2.6"/><line x1="896" y1="455" x2="762" y2="295" stroke="#7d5a1e" stroke-width="2.6"/><line x1="762" y1="295" x2="896" y2="295" stroke="#d8d0c1" stroke-width="1.6" stroke-dasharray="5 4"/><line x1="896" y1="307" x2="884" y2="307" stroke="#d8d0c1" stroke-width="1.1"/><line x1="884" y1="307" x2="884" y2="295" stroke="#d8d0c1" stroke-width="1.1"/><path d="M 896.00 411.00 L 894.72 411.02 L 893.44 411.07 L 892.17 411.17 L 890.89 411.30 L 889.62 411.46 L 888.36 411.67 L 887.10 411.91 L 885.85 412.19 L 884.61 412.50 L 883.38 412.85 L 882.16 413.23 L 880.95 413.65 L 879.75 414.11 L 878.57 414.60 L 877.40 415.12 L 876.25 415.68 L 875.12 416.27 L 874.00 416.89 L 872.90 417.55 L 871.82 418.24 L 870.76 418.96 L 869.73 419.71 L 868.71 420.49 L 867.72 421.29" fill="none" stroke="#9c4a2f" stroke-width="1.2"/><text x="866" y="400" font-size="12.5" fill="#9c4a2f" font-weight="bold" text-anchor="start" font-family="'Segoe UI', 'Microsoft YaHei', 'PingFang SC', 'Noto Sans SC', Helvetica, Arial, sans-serif">θ</text><text x="817" y="379" font-size="12" fill="#7d5a1e" font-weight="bold" text-anchor="end" font-family="'Segoe UI', 'Microsoft YaHei', 'PingFang SC', 'Noto Sans SC', Helvetica, Arial, sans-serif">dθ</text><text x="908" y="386" font-size="12" fill="#9c4a2f" font-weight="bold" text-anchor="start" font-family="'Segoe UI', 'Microsoft YaHei', 'PingFang SC', 'Noto Sans SC', Helvetica, Arial, sans-serif">d sinθ</text><text x="908" y="404" font-size="11" fill="#9c4a2f" font-weight="normal" text-anchor="start" font-family="'Segoe UI', 'Microsoft YaHei', 'PingFang SC', 'Noto Sans SC', Helvetica, Arial, sans-serif">= cosθ·dθ</text><text x="758" y="500" font-size="11.5" fill="#57534c" font-weight="normal" text-anchor="start" font-family="'Segoe UI', 'Microsoft YaHei', 'PingFang SC', 'Noto Sans SC', Helvetica, Arial, sans-serif">斜边 dθ，邻边 cosθ·dθ，比值就是 cosθ</text><rect x="40" y="578" width="1040" height="124" rx="12" fill="#f3ead9" stroke="none" stroke-width="1"/><text x="60" y="606" font-size="14" fill="#1b2b45" font-weight="bold" text-anchor="start" font-family="'Segoe UI', 'Microsoft YaHei', 'PingFang SC', 'Noto Sans SC', Helvetica, Arial, sans-serif">要点</text><text x="60" y="632" font-size="13" fill="#57534c" font-weight="normal" text-anchor="start" font-family="'Segoe UI', 'Microsoft YaHei', 'PingFang SC', 'Noto Sans SC', Helvetica, Arial, sans-serif">正方形多出的两条长条各是 x·dx，角上的 dx² 是二阶小量；这就是幂法则的几何版本。</text><text x="60" y="658" font-size="13" fill="#57534c" font-weight="normal" text-anchor="start" font-family="'Segoe UI', 'Microsoft YaHei', 'PingFang SC', 'Noto Sans SC', Helvetica, Arial, sans-serif">圆上的小三角形与大三角形相似：斜边从 1 缩到 dθ，邻边就从 cosθ 缩到 cosθ·dθ。</text></svg>
