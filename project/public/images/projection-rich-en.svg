<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 700" width="1120" height="700" font-family="Segoe UI, Helvetica, Arial, sans-serif" role="img" lang="en"><title>Projection and least squares</title><rect width="1120" height="700" fill="#fbf9f5"/><defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1b2b45"/></marker><marker id="ara" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7d5a1e"/></marker></defs><text x="36" y="30" font-size="17" fill="#1b2b45" text-anchor="start" font-weight="bold">Projection: from a line to a subspace</text><text x="36" y="56" font-size="13" fill="#57534c" text-anchor="start" font-weight="normal">One condition defines the projection: the error is orthogonal to the target space.</text><rect x="40" y="96" width="340" height="430" rx="12" fill="#fdfbf7" stroke="#d8d0c1" stroke-width="1"/><text x="56" y="124" font-size="13.5" fill="#1b2b45" text-anchor="start" font-weight="bold">① Geometry: projecting onto a line</text><line x1="90" y1="380" x2="360" y2="380" stroke="#d8d0c1" stroke-width="8"/><line x1="120" y1="380" x2="350" y2="380" stroke="#1b2b45" stroke-width="2" marker-end="url(#ar)"/><text x="358" y="385" font-size="14" fill="#1b2b45" text-anchor="start" font-weight="normal">a</text><line x1="120" y1="380" x2="270" y2="210" stroke="#1b2b45" stroke-width="2" marker-end="url(#ar)"/><text x="180" y="290" font-size="14" fill="#1b2b45" text-anchor="start" font-weight="normal">b</text><line x1="270" y1="380" x2="270" y2="210" stroke="#7d5a1e" stroke-width="2.2" stroke-dasharray="6 5"/><text x="280" y="300" font-size="13" fill="#7d5a1e" text-anchor="start" font-weight="normal">e = b − p</text><path d="M270,360 h20 v20" fill="none" stroke="#7d5a1e" stroke-width="1.8"/><circle cx="270" cy="380" r="5" fill="#7d5a1e"/><text x="248" y="402" font-size="14" fill="#7d5a1e" text-anchor="start" font-weight="normal">p</text><text x="56" y="424" font-size="13" fill="#1b2b45" text-anchor="start" font-weight="normal" font-family="Consolas, Cascadia Mono, monospace">x = aᵀb / aᵀa</text><text x="56" y="450" font-size="13" fill="#1b2b45" text-anchor="start" font-weight="normal" font-family="Consolas, Cascadia Mono, monospace">p = a x</text><text x="56" y="476" font-size="13" fill="#1b2b45" text-anchor="start" font-weight="normal" font-family="Consolas, Cascadia Mono, monospace">P = a aᵀ / aᵀa</text><text x="56" y="508" font-size="12" fill="#57534c" text-anchor="start" font-weight="normal">e ⟂ a, so p is the closest point on the line.</text><rect x="420" y="96" width="340" height="430" rx="12" fill="#fdfbf7" stroke="#d8d0c1" stroke-width="1"/><text x="436" y="124" font-size="13.5" fill="#1b2b45" text-anchor="start" font-weight="bold">② Subspaces and properties</text><text x="436" y="158" font-size="12" fill="#57534c" text-anchor="start" font-weight="normal">1-D:</text><text x="486" y="158" font-size="12.5" fill="#1b2b45" text-anchor="start" font-weight="normal" font-family="Consolas, Cascadia Mono, monospace">P = aaᵀ / aᵀa</text><text x="436" y="188" font-size="12" fill="#57534c" text-anchor="start" font-weight="normal">Subspace:</text><text x="500" y="188" font-size="12.5" fill="#1b2b45" text-anchor="start" font-weight="normal" font-family="Consolas, Cascadia Mono, monospace">P = A(AᵀA)⁻¹Aᵀ</text><text x="436" y="218" font-size="12" fill="#57534c" text-anchor="start" font-weight="normal">Normal eq.:</text><text x="512" y="218" font-size="12.5" fill="#1b2b45" text-anchor="start" font-weight="normal" font-family="Consolas, Cascadia Mono, monospace">AᵀA x̂ = Aᵀb</text><line x1="436" y1="240" x2="744" y2="240" stroke="#d8d0c1" stroke-width="1"/><text x="436" y="268" font-size="12.5" fill="#1b2b45" text-anchor="start" font-weight="bold">Two defining properties</text><text x="436" y="296" font-size="12" fill="#57534c" text-anchor="start" font-weight="normal">Pᵀ = P  (symmetric)</text><text x="436" y="322" font-size="12" fill="#57534c" text-anchor="start" font-weight="normal">P² = P  (idempotent)</text><text x="436" y="356" font-size="12" fill="#57534c" text-anchor="start" font-weight="normal">P b is the closest point in C(A) to b</text><text x="436" y="382" font-size="12" fill="#57534c" text-anchor="start" font-weight="normal">e = b − Pb is orthogonal to C(A)</text><line x1="436" y1="404" x2="744" y2="404" stroke="#d8d0c1" stroke-width="1"/><text x="436" y="432" font-size="12" fill="#57534c" text-anchor="start" font-weight="normal">AᵀA invertible ⟺ columns of A independent.</text><text x="436" y="458" font-size="12" fill="#57534c" text-anchor="start" font-weight="normal">Otherwise use the pseudoinverse (later).</text><text x="436" y="492" font-size="12" fill="#7d5a1e" text-anchor="start" font-weight="bold">→ this is least squares in matrix form.</text><rect x="800" y="96" width="300" height="430" rx="12" fill="#fdfbf7" stroke="#d8d0c1" stroke-width="1"/><text x="816" y="124" font-size="13" fill="#1b2b45" text-anchor="start" font-weight="bold">③ Least squares: fit three points</text><line x1="830" y1="430" x2="1064" y2="430" stroke="#1b2b45" stroke-width="1.5" marker-end="url(#ar)"/><text x="1070" y="434" font-size="12" fill="#1b2b45" text-anchor="start" font-weight="normal">t</text><line x1="830" y1="430" x2="830" y2="274" stroke="#1b2b45" stroke-width="1.5" marker-end="url(#ar)"/><text x="826" y="272" font-size="12" fill="#1b2b45" text-anchor="end" font-weight="normal">b</text><text x="887.5" y="446" font-size="11" fill="#57534c" text-anchor="middle" font-weight="normal">1</text><text x="945.0" y="446" font-size="11" fill="#57534c" text-anchor="middle" font-weight="normal">2</text><text x="1002.5" y="446" font-size="11" fill="#57534c" text-anchor="middle" font-weight="normal">3</text><line x1="853.0" y1="386.6666666666667" x2="1037.0" y2="306.6666666666667" stroke="#7d5a1e" stroke-width="2.4"/><line x1="887.5" y1="380.0" x2="887.5" y2="371.6666666666667" stroke="#a8845a" stroke-width="1.4" stroke-dasharray="3 3"/><circle cx="887.5" cy="380.0" r="5" fill="#1b2b45"/><line x1="945.0" y1="330.0" x2="945.0" y2="346.6666666666667" stroke="#a8845a" stroke-width="1.4" stroke-dasharray="3 3"/><circle cx="945.0" cy="330.0" r="5" fill="#1b2b45"/><line x1="1002.5" y1="330.0" x2="1002.5" y2="321.6666666666667" stroke="#a8845a" stroke-width="1.4" stroke-dasharray="3 3"/><circle cx="1002.5" cy="330.0" r="5" fill="#1b2b45"/><text x="1028.375" y="296.6666666666667" font-size="11" fill="#7d5a1e" text-anchor="end" font-weight="normal">best fit</text><text x="816" y="470" font-size="12" fill="#1b2b45" text-anchor="start" font-weight="normal" font-family="Consolas, Cascadia Mono, monospace">C = 2/3,  D = 1/2</text><text x="816" y="494" font-size="12" fill="#7d5a1e" text-anchor="start" font-weight="normal" font-family="Consolas, Cascadia Mono, monospace">b = 2/3 + t/2</text><text x="816" y="516" font-size="11" fill="#57534c" text-anchor="start" font-weight="normal">dashed: the three residuals</text><rect x="40" y="550" width="1060" height="118" rx="12" fill="#f3ead9" stroke="#d8d0c1" stroke-width="1"/><text x="60" y="580" font-size="14" fill="#1b2b45" text-anchor="start" font-weight="bold">Two languages, one idea</text><text x="60" y="610" font-size="13" fill="#57534c" text-anchor="start" font-weight="normal">Geometry: project b onto C(A); the error is orthogonal to C(A).</text><text x="60" y="636" font-size="13" fill="#57534c" text-anchor="start" font-weight="normal">Algebra: Aᵀ(b − Ax̂) = 0, which expands to AᵀA x̂ = Aᵀb.</text></svg>