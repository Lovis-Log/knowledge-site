<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 742" width="1120" height="742" role="img" lang="zh"><rect width="1120" height="742" fill="#fbf9f5"/><text x="40" y="50" font-size="21" fill="#1b2b45" font-weight="bold" text-anchor="start" font-family="'Segoe UI', 'Microsoft YaHei', 'PingFang SC', 'Noto Sans SC', Helvetica, Arial, sans-serif">可逆与不可逆：平面有没有被压扁</text><text x="40" y="80" font-size="13" fill="#57534c" font-weight="normal" text-anchor="start" font-family="'Segoe UI', 'Microsoft YaHei', 'PingFang SC', 'Noto Sans SC', Helvetica, Arial, sans-serif">行列式非零时平面还是平面，每个输出只有一个来源；行列式为零时整条线被压成原点</text><rect x="40" y="124" width="500" height="430" rx="14" fill="#fffdf9" stroke="#d8d0c1" stroke-width="1"/><text x="58" y="157" font-size="14" fill="#1b2b45" font-weight="bold" text-anchor="start" font-family="'Segoe UI', 'Microsoft YaHei', 'PingFang SC', 'Noto Sans SC', Helvetica, Arial, sans-serif">① 可逆：det ≠ 0</text><line x1="90" y1="500" x2="390" y2="500" stroke="#d8d0c1" stroke-width="1.2"/><line x1="90" y1="200" x2="90" y2="500" stroke="#d8d0c1" stroke-width="1.2"/><line x1="141.43" y1="497" x2="141.43" y2="503" stroke="#d8d0c1" stroke-width="1"/><text x="141.43" y="516" font-size="11" fill="#746e64" font-weight="normal" text-anchor="middle" font-family="'Segoe UI', 'Microsoft YaHei', 'PingFang SC', 'Noto Sans SC', Helvetica, Arial, sans-serif">-2</text><line x1="312.86" y1="497" x2="312.86" y2="503" stroke="#d8d0c1" stroke-width="1"/><text x="312.86" y="516" font-size="11" fill="#746e64" font-weight="normal" text-anchor="middle" font-family="'Segoe UI', 'Microsoft YaHei', 'PingFang SC', 'Noto Sans SC', Helvetica, Arial, sans-serif">2</text><line x1="87" y1="448.57" x2="93" y2="448.57" stroke="#d8d0c1" stroke-width="1"/><text x="82" y="452.57" font-size="11" fill="#746e64" font-weight="normal" text-anchor="end" font-family="'Segoe UI', 'Microsoft YaHei', 'PingFang SC', 'Noto Sans SC', Helvetica, Arial, sans-serif">-2</text><line x1="87" y1="277.14" x2="93" y2=