or="start" font-family="'Segoe UI', 'Microsoft YaHei', 'PingFang SC', 'Noto Sans SC', Helvetica, Arial, sans-serif">v</text><text x="355.71" y="290" font-size="12" fill="#7d5a1e" font-weight="bold" text-anchor="start" font-family="'Segoe UI', 'Microsoft YaHei', 'PingFang SC', 'Noto Sans SC', Helvetica, Arial, sans-serif">Av</text><text x="58" y="536" font-size="11" fill="#57534c" font-weight="normal" text-anchor="start" font-family="'Segoe UI', 'Microsoft YaHei', 'PingFang SC', 'Noto Sans SC', Helvetica, Arial, sans-serif">剪切矩阵 det = 1：信息没丢。</text><rect x="580" y="124" width="500" height="430" rx="14" fill="#fffdf9" stroke="#d8d0c1" stroke-width="1"/><text x="598" y="157" font-size="14" fill="#1b2b45" font-weight="bold" text-anchor="start" font-family="'Segoe UI', 'Microsoft YaHei', 'PingFang SC', 'Noto Sans SC', Helvetica, Arial, sans-serif">② 不可逆：det = 0</text><line x1="630" y1="500" x2="930" y2="500" stroke="#d8d0c1" stroke-width="1.2"/><line x1="630" y1="200" x2="630" y2="500" stroke="#d8d0c1" stroke-width="1.2"/><line x1="680" y1="497" x2="680" y2="503" stroke="#d8d0c1" stroke-width="1"/><text x="680" y="516" font-size="11" fill="#746e64" font-weight="normal" text-anchor="middle" font-family="'Segoe UI', 'Microsoft YaHei', 'PingFang SC', 'Noto Sans SC', Helvetica, Arial, sans-serif">-2</text><line x1="880" y1="497" x2="880" y2="503" stroke="#d8d0c1" stroke-width="1"/><text x="880" y="516" font-size="11" fill="#746e64" font-weight="normal" text-anchor="middle" font-family="'Segoe UI', 'Microsoft YaHei', 'PingFang SC', 'Noto Sans SC', Helvetica, Arial, sans-serif">2</text><line x1="627" y1="450" x2="633" y2="450" stroke="#d8d0c1" stroke-width="1"/><text x="622" y="454" font-size="11" fill="#746e64" font-weight="normal" text-anchor="end" font-family="'Segoe UI', 'Microsoft YaHei', 'PingFang SC', 'Noto Sans SC', Helvetica, Arial, sans-serif">-2</text><line x1="627" y1="250" x2="633" y2="250" stroke="#d8d0c1" stroke-width="1"/><text x="622" y="254" font-size="11" fill="#746e64" font-weight="normal" text-anchor="end" font-family="'Segoe UI', 'Microsoft YaHei', 'PingFang SC', 'Noto Sans SC', Helvetica, Arial, sans-serif">2</text><path d="M 630 350 L 630 350" fill="none" stroke="#d8d0c1" stroke-width="1"/><path d="M 630 350 L 930 350" fill="none" stroke="#d8d0c1" stroke-width="1"/><path d="M 680 350 L 680 350" fill="none" stroke="#d8d0c1" stroke-width="1"/><path d="M 630 350 L 930 350" fill="none" stroke="#d8d0c1" stroke-width="1"/><path d="M 730 350 L 730 350" fill="none" stroke="#d8d0c1" stroke-width="1"/><path d="M 630 350 L 930 350" fill="none" stroke="#d8d0c1" stroke-width="1"/><path d="M 780 350 L 780 350" fill="none" stroke="#d8d0c1" stroke-width="1"/><path d="M 630 350 L 930 350" fill="none" stroke="#d8d0c1" stroke-width="1"/><path d="M 830 350 L 830 350" fill="none" stroke="#d8d0c1" stroke-width="1"/><path d="M 630 350 L 930 350" fill="none" stroke="#d8d0c1" stroke-width="1"/><path d="M 880 350 L 880 350" fill="none" stroke="#d8d0c1" stroke-width="1"/><path d="M 630 350 L 930 350" fill="none" stroke="#d8d0c1" stroke-width="1"/><path d="M 930 350 L 930 350" fill="none" stroke="#d8d0c1" stroke-width="1"/><path d="M 630 350 L 930 350" fill="none" stroke="#d8d0c1" stroke-width="1"/><path d="M 630 350 L 930 350" fill="none" stroke="#7d5a1e" stroke-width="3.2"/><path d="M 780 500 L 780 200" fill="none" stroke="#9c4a2f" stroke-width="1.4" stroke-dasharray="5 4"/><line x1="780" y1="270" x2="780" y2="342.35" stroke="#9c4a2f" stroke-width="1.4" stroke-dasharray="3 3"/><path d="M 780 350 L 776.66 341.64 L 783.34 341.64 Z" fill="#9c4a2f"/><line x1="780" y1="430" x2="780" y2="357.65" stroke="#9c4a2f" stroke-width="1.4" stroke-dasharray="3 3"/><path d="M 780 350 L 783.34 358.36 L 776.66 358.36 Z" fill="#9c4a2f"/><text x="789" y="232.5" font-size="10.5" fill="#9c4a2f" font-weight="bold" text-anchor="start" font-family="'Segoe UI', 'Microsoft YaHei', 'PingFang SC', 'Noto Sans SC', Helvetica, Arial, sans-serif">零空间：整条 y 轴 → 0</text><text x="927.5" y="332.5" font-size="10.5" fill="#7d5a1e" font-weight="bold" text-anchor="end" font-family="'Segoe UI', 'Microsoft YaHei', 'PingFang SC', 'Noto Sans SC', Helvetica, Arial, sans-serif">列空间 = x 轴</text><text x="598" y="536" font-size="11" fill="#57534c" font-weight="normal" text-anchor="start" font-family="'Segoe UI', 'Microsoft YaHei', 'PingFang SC', 'Noto Sans SC', Helvetica, Arial, sans-serif">投影矩阵 det = 0：秩为 1，没有逆。</text><rect x="40" y="578" width="1040" height="124" rx="12" fill="#f3ead9" stroke="none" stroke-width="1"/><text x="60" y="606" font-size="14" fill="#1b2b45" font-weight="bold" text-anchor="start" font-family="'Segoe UI', 'Microsoft YaHei', 'PingFang SC', 'Noto Sans SC', Helvetica, Arial, sans-serif">要点</text><text x="60" y="632" font-size="13" fill="#57534c" font-weight="normal" text-anchor="start" font-family="'Segoe UI', 'Microsoft YaHei', 'PingFang SC', 'Noto Sans SC', Helvetica, Arial, sans-serif">可逆意味着能从输出唯一地倒推输入；压扁之后一条线上的所有点都落到同一个输出，倒推就不可能唯一。</text><text x="60" y="658" font-size="13" fill="#57534c" font-weight="normal" text-anchor="start" font-family="'Segoe UI', 'Microsoft YaHei', 'PingFang SC', 'Noto Sans SC', Helvetica, Arial, sans-serif">列空间是所有可能输出的集合，零空间是被送到原点的输入集合；两者共同描述一个变换丢了什么。</text></svg>
