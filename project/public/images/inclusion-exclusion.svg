<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 560" width="860" height="560" font-family="Segoe UI, Helvetica, Arial, sans-serif" role="img"><title>Inclusion-exclusion for three sets</title><defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1b2b45"/></marker><marker id="ara" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7d5a1e"/></marker></defs><rect width="860" height="560" fill="#fbf9f5"/><circle cx="320" cy="230" r="145" fill="#c9b48a" fill-opacity="0.22" stroke="#c9b48a" stroke-width="2"/><circle cx="520" cy="230" r="145" fill="#a8845a" fill-opacity="0.22" stroke="#a8845a" stroke-width="2"/><circle cx="420" cy="340" r="145" fill="#7d5a1e" fill-opacity="0.22" stroke="#7d5a1e" stroke-width="2"/><text x="250" y="150" font-size="20" fill="#1b2b45" text-anchor="middle" font-weight="bold">A</text><text x="590" y="150" font-size="20" fill="#1b2b45" text-anchor="middle" font-weight="bold">B</text><text x="420" y="470" font-size="20" fill="#1b2b45" text-anchor="middle" font-weight="bold">C</text><text x="430" y="535" font-size="15" fill="#1b2b45" text-anchor="middle" font-weight="normal">|A∪B∪C| = |A|+|B|+|C| − |A∩B| − |A∩C| − |B∩C| + |A∩B∩C|</text></svg>