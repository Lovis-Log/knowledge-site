ial, sans-serif">0.75</text><line x1="157" y1="186" x2="163" y2="186" stroke="#d8d0c1" stroke-width="1"/><text x="152" y="190" font-size="11" fill="#746e64" font-weight="normal" text-anchor="end" font-family="'Segoe UI', 'Microsoft YaHei', 'PingFang SC', 'Noto Sans SC', Helvetica, Arial, sans-serif">1</text><polygon points="160,446 420,316 420,186" fill="#f3ead9" stroke="none" stroke-width="1"/><path d="M 160 186 L 420 186" fill="none" stroke="#d8d0c1" stroke-width="1.2" stroke-dasharray="6 5"/><path d="M 160 446 L 420 186" fill="none" stroke="#d8d0c1" stroke-width="1.6" stroke-dasharray="6 5"/><path d="M 160 446 L 420 316" fill="none" stroke="#7d5a1e" stroke-width="2.6"/><text x="347.2" y="238" font-size="12" fill="#746e64" font-weight="normal" text-anchor="start" font-family="'Segoe UI', 'Microsoft YaHei', 'PingFang SC', 'Noto Sans SC', Helvetica, Arial, sans-serif">出价 = 估值</text><text x="295.2" y="394" font-size="13" fill="#7d5a1e" font-weight="bold" text-anchor="start" font-family="'Segoe UI', 'Microsoft YaHei', 'PingFang SC', 'Noto Sans SC', Helvetica, Arial, sans-serif">b = v / 2</text><text x="295.2" y="284.8" font-size="11.5" fill="#7d5a1e" font-weight="normal" text-anchor="middle" font-family="'Segoe UI', 'Microsoft YaHei', 'PingFang SC', 'Noto Sans SC', Helvetica, Arial, sans-serif">压掉的剩余</text><text x="420" y="480" font-size="11.5" fill="#746e64" font-weight="normal" text-anchor="end" font-family="'Segoe UI', 'Microsoft YaHei', 'PingFang SC', 'Noto Sans SC', Helvetica, Arial, sans-serif">估值 v</text><text x="150" y="180" font-size="11.5" fill="#746e64" font-weight="normal" text-anchor="end" font-family="'Segoe UI', 'Microsoft YaHei', 'PingFang SC', 'Noto Sans SC', Helvetica, Arial, sans-serif">出价 b</text><rect x="600" y="110" width="480" height="390" rx="14" fill="#fffdf9" stroke="#d8d0c1" stroke-width="1"/><text x="618" y="143" font-size="14" fill="#1b2b45" font-weight="bold" text-anchor="start" font-family="'Segoe UI', 'Microsoft YaHei', 'PingFang SC', 'Noto Sans SC', Helvetica, Arial, sans-serif">② 估值固定为 0.8 时的期望支付</text><line x1="690" y1="186" x2="690" y2="446" stroke="#e7e1d6" stroke-width="0.8"/><line x1="763.33" y1="186" x2="763.33" y2="446" stroke="#e7e1d6" stroke-width="0.8"/><line x1="836.67" y1="186" x2="836.67" y2="446" stroke="#e7e1d6" stroke-width="0.8"/><line x1="910" y1="186" x2="910" y2="446" stroke="#e7e1d6" stroke-width="0.8"/><line x1="983.33" y1="186" x2="983.33" y2="446" stroke="#e7e1d6" stroke-width="0.8"/><line x1="690" y1="446" x2="1020" y2="446" stroke="#e7e1d6" stroke-width="0.8"/><line x1="690" y1="373.78" x2="1020" y2="373.78" stroke="#e7e1d6" stroke-width="0.8"/><line x1="690" y1="301.56" x2="1020" y2="301.56" stroke="#e7e1d6" stroke-width="0.8"/><line x1="690" y1="229.33" x2="1020" y2="229.33" stroke="#e7e1d6" stroke-width="0.8"/><line x1="690" y1="446" x2="1020" y2="446" stroke="#d8d0c1" stroke-width="1.2"/><line x1="690" y1="186" x2="690" y2="446" stroke="#d8d0c1" stroke-width="1.2"/><line x1="690" y1="443" x2="690" y2="449" stroke="#d8d0c1" stroke-width="1"/><line x1="763.33" y1="443" x2="763.33" y2="449" stroke="#d8d0c1" stroke-width="1"/><text x="763.33" y="462" font-size="11" fill="#746e64" font-weight="normal" text-anchor="middle" font-family="'Segoe UI', 'Microsoft YaHei', 'PingFang SC', 'Noto Sans SC', Helvetica, Arial, sans-serif">0.2</text><line x1="836.67" y1="443" x2="836.67" y2="449" stroke="#d8d0c1" stroke-width="1"/><text x="836.67" y="462" font-size="11" fill="#746e64" font-weight="normal" text-anchor="middle" font-family="'Segoe UI', 'Microsoft YaHei', 'PingFang SC', 'Noto Sans SC', Helvetica, Arial, sans-serif">0.4</text><line x1="910" y1="443" x2="910" y2="449" stroke="#d8d0c1" stroke-width="1"/><text x="910" y="462" font-size="11" fill="#746e64" font-weight="normal" text-anchor="middle" font-family="'Segoe UI', 'Microsoft YaHei', 'PingFang SC', 'Noto Sans SC', Helvetica, Arial, sans-serif">0.6</text><line x1="983.33" y1="443" x2="983.33" y2="449" stroke="#d8d0c1" st