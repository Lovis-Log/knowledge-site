891.67 247.39 L 895.33 251.87 L 899 256.63 L 902.67 261.69 L 906.33 267.03 L 910 272.67 L 913.67 278.59 L 917.33 284.8 L 921 291.3 L 924.67 298.09 L 928.33 305.17 L 932 312.53 L 935.67 320.19 L 939.33 328.13 L 943 336.37 L 946.67 344.89 L 950.33 353.7 L 954 362.8 L 957.67 372.19 L 961.33 381.87 L 965 391.83 L 968.67 402.09 L 972.33 412.63 L 976 423.47 L 979.67 434.59 L 983.33 446" fill="none" stroke="#7d5a1e" stroke-width="2.6"/><path d="M 836.67 446 L 836.67 214.89" fill="none" stroke="#d8d0c1" stroke-width="1.2" stroke-dasharray="5 4"/><circle cx="836.67" cy="214.89" r="4.5" fill="#9c4a2f" stroke="none" stroke-width="1"/><circle cx="836.67" cy="214.89" r="7.5" fill="none" stroke="#9c4a2f" stroke-width="1"/><text x="844" y="204.06" font-size="12" fill="#9c4a2f" font-weight="bold" text-anchor="start" font-family="'Segoe UI', 'Microsoft YaHei', 'PingFang SC', 'Noto Sans SC', Helvetica, Arial, sans-serif">最高点 b = 0.4</text><text x="1020" y="480" font-size="11.5" fill="#746e64" font-weight="normal" text-anchor="end" font-family="'Segoe UI', 'Microsoft YaHei', 'PingFang SC', 'Noto Sans SC', Helvetica, Arial, sans-serif">出价 b</text><text x="680" y="180" font-size="11.5" fill="#746e64" font-weight="normal" text-anchor="end" font-family="'Segoe UI', 'Microsoft YaHei', 'PingFang SC', 'Noto Sans SC', Helvetica, Arial, sans-serif">期望支付</text><rect x="40" y="520" width="1040" height="128" rx="14" fill="#fffdf9" stroke="#d8d0c1" stroke-width="1"/><text x="58" y="553" font-size="14" fill="#1b2b45" font-weight="bold" text-anchor="start" font-family="'Segoe UI', 'Microsoft YaHei', 'PingFang SC', 'Noto Sans SC', Helvetica, Arial, sans-serif">两个格式的分水岭</text><text x="64" y="574" font-size="12.5" fill="#57534c" font-weight="normal" text-anchor="start" font-family="'Segoe UI', 'Microsoft YaHei', 'PingFang SC', 'Noto Sans SC', Helvetica, Arial, sans-serif">右图的曲线是 (0.8 − b) · b / 0.5：出价越高，赢的概率越大，但赢了赚得越少，最高点在 b = 0.4。第一价格里出价同时决定「赢不赢」和「赢了赚多少」，两个力量方向相反，</text><text x="64" y="593.38" font-size="12.5" fill="#57534c" font-weight="normal" text-anchor="start" font-family="'Segoe UI', 'Microsoft YaHei', 'PingFang SC', 'Noto Sans SC', Helvetica, Arial, sans-serif">所以必须压价；第二价格里出价只决定「赢不赢」，赢了付的是别人的出价，所以按估值出价最优——你不需要猜对手怎么出。</text><rect x="40" y="672" width="1040" height="98" rx="12" fill="#f3ead9" stroke="none" stroke-width="1"/><text x="60" y="700" font-size="14" fill="#1b2b45" font-weight="bold" text-anchor="start" font-family="'Segoe UI', 'Microsoft YaHei', 'PingFang SC', 'Noto Sans SC', Helvetica, Arial, sans-serif">结论</text><text x="60" y="726" font-size="13" fill="#57534c" font-weight="normal" text-anchor="start" font-family="'Segoe UI', 'Microsoft YaHei', 'PingFang SC', 'Noto Sans SC', Helvetica, Arial, sans-serif">压价不是保守，而是最优：多出一块钱的边际收益正好在 b = v / 2 处等于边际成本。</text></svg>
