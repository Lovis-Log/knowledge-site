<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 718" width="1120" height="718" role="img" lang="zh"><rect width="1120" height="718" fill="#fbf9f5"/><text x="40" y="50" font-size="21" fill="#1b2b45" font-weight="bold" text-anchor="start" font-family="'Segoe UI', 'Microsoft YaHei', 'PingFang SC', 'Noto Sans SC', Helvetica, Arial, sans-serif">共同知识：每迭代一次，可能的状态就少一层</text><text x="40" y="80" font-size="13" fill="#57534c" font-weight="normal" text-anchor="start" font-family="'Segoe UI', 'Microsoft YaHei', 'PingFang SC', 'Noto Sans SC', Helvetica, Arial, sans-serif">红帽谜题的八个状态；「每个人都知道」这个算子把 7 个状态压到 4 个、1 个、0 个</text><rect x="926" y="158" width="60" height="372" rx="0" fill="#f3ead9" stroke="none" stroke-width="1"/><text x="340" y="172" font-size="12" fill="#57534c" font-weight="normal" text-anchor="middle" font-family="Consolas, monospace">000</text><text x="428" y="172" font-size="12" fill="#57534c" font-weight="normal" text-anchor="middle" font-family="Consolas, monospace">001</text><text x="516" y="172" font-size="12" fill="#57534c" font-weight="normal" text-anchor="middle" font-family="Consolas, monospace">010</text><text x="604" y="172" font-size="12" fill="#57534c" font-weight="normal" text-anchor="middle" font-family="Consolas, monospace">011</text><text x="692" y="172" font-size="12" fill="#57534c" font-weight="normal" text-anchor="middle" font-family="Consolas, monospace">100</text><text x="780" y="172" font-size="12" fill="#57534c" font-weight="normal" text-anchor="middle" font-family="Consolas, monospace">101</text><text x="868" y="172" font-size="12" fill="#57534c" font-weight="normal" text-anchor="middle" font-family="Consolas, monospace">110</text><text x="956" y="172" font-size="12" fill="#57534c" font-weight="normal" text-anchor="middle" font-family="Consolas, monospace">111</text><text x="40" y="205" font-size="13" fill="#1b2b45" font-weight="bold" text-anchor="start" font-family="'Segoe UI', 'Microsoft YaHei', 'PingFang SC', 'Noto Sans SC', Helvetica, Arial, sans-serif">E≥1：至少一顶红帽</text><line x1="314" y1="200" x2="982" y2="200" stroke="#e7e1d6" stroke-width="1"/><circle cx="340" cy="200" r="8.5" fill="#fbf9f5" stroke="#d8d0c1" stroke-width="1.4"/><circle cx="428" cy="200" r="8.5" fill="#1b2b45" stroke="#1b2b45" stroke-width="1.4"/><circle cx="516" cy="200" r="8.5" fill="#1b2b45" stroke="#1b2b45" stroke-width="1.4"/><circle cx="604" cy="200" r="8.5" fill="#1b2b45" stroke="#1b2b45" stroke-width="1.4"/><circle cx="692" cy="200" r="8.5" fill="#1b2b45" stroke="#1b2b45" stroke-width="1.4"/><circle cx="780" cy="200" r="8.5" fill="#1b2b45" stroke="#1b2b45" stroke-width="1.4"/><circle cx="868" cy="200" r="8.5" fill="#1b2b45" stroke="#1b2b45" stroke-width="1.4"/><circle cx="956" cy="200" r="8.5" fill="#1b2b45" stroke="#1b2b45" stroke-width="1.4"/><text x="1008" y="205" font-size="12" fill="#746e64" font-weight="normal" text-anchor="start" font-family="'Segoe UI', 'Microsoft YaHei', 'PingFang SC', 'Noto Sans SC', Helvetica, Arial, sans-serif">7 个状态</text><text x="40" y="305" font-size="13" fill="#1b2b45" font-weight="bold" text-anchor="start" font-family="'Segoe UI', 'Microsoft YaHei', 'PingFang SC', 'Noto Sans SC', Helvetica, Arial, sans-serif">K(E≥1) = E≥2</text><line x1="314" y1="300" x2="982" y2="300" stroke="#e7e1d6" stroke-width="1"/><circle cx="340" cy="300" r="8.5" fill="#fbf9f5" stroke="#d8d0c1" stroke-width="1.4"/><circle cx="428" cy="300" r="8.5" fill="#fbf9f5" stroke="#d8d0c1" stroke-width="1.4"/><circle cx="516" cy="300" r="8.5" fill="#fbf9f5" stroke="#d8d0c1" stroke-width="1.4"/><circle cx="604" cy="300" r="8.5" fill="#1b2b45" stroke="#1b2b45" stroke-width="1.4"/><circle cx="692" cy="300" r="8.5" fill="#fbf9f5" stroke="#d8d0c1" stroke-width="1.4"/><circle cx="780" cy="300" r="8.5" fill="#1b2b45" stroke="#1b2b45" stroke-width="1.4"/><circle cx="868" cy="300" r="8.5" fill="#1b2b45" stroke="#1b2b45" stroke-width="1.4"/><circle cx="956" cy="300" r="8.5" fill="#1b2b45" stroke="#1b2b45" stroke-width="1.4"/><text x="1008" y="305" font-size="12" fill="#746e64" font-weight="normal" text-anchor="start" font-family="'Segoe UI', 'Microsoft YaHei', 'PingFang SC', 'Noto Sans SC', Helvetica, Arial, sans-serif">4 个状态</text><text x="40" y="405" font-size="13" fill="#1b2b45" font-weight="bold" text-anchor="start" font-family="'Segoe UI', 'Microsoft YaHei', 'PingFang SC', 'Noto Sans SC', Helvetica, Arial, sans-serif">K²(E≥1) = E3</text><line x1="314" y1="400" x2="982" y2="400" stroke="#e7e1d6" stroke-width="1"/><circle cx="340" cy="400" r="8.5" fill="#fbf9f5" stroke="#d8d0c1" stroke-width="1.4"/><circle cx="428" cy="400" r="8.5" fill="#fbf9f5" stroke="#d8d0c1" stroke-width="1.4"/><circle cx="516" cy="400" r="8.5" fill="#fbf9f5" stroke="#d8d0c1" stroke-width="1.4"/><circle cx="604" cy="400" r="8.5" fill="#fbf9f5" stroke="#d8d0c1" stroke-width="1.4"/><circle cx="692" cy="400" r="8.5" fill="#fbf9f5" stroke="#d8d0c1" stroke-width="1.4"/><circle cx="780" cy="400" r="8.5" fill="#fbf9f5" stroke="#d8d0c1" stroke-width="1.4"/><circle cx="868" cy="400" r="8.5" fill="#fbf9f5" stroke="#d8d0c1" stroke-width="1.4"/><circle cx="956" cy="400" r="8.5" fill="#1b2b45" stroke="#1b2b45" stroke-width="1.4"/><text x="1008" y="405" font-size="12" fill="#746e64" font-weight="normal" text-anchor="start" font-family="'Segoe UI', 'Microsoft YaHei', 'PingFang SC', 'Noto Sans SC', Helvetica, Arial, sans-serif">1 个状态</text><text x="40" y="505" font-size="13" fill="#746e64" font-weight="bold" text-anchor="start" font-family="'Segoe UI', 'Microsoft YaHei', 'PingFang SC', 'Noto Sans SC', Helvetica, Arial, sans-serif">K³(E≥1) = ∅</text><line x1="314" y1="500" x2="982" y2="500" stroke="#e7e1d6" stroke-width="1"/><circle cx="340" cy="500" r="8.5" fill="#fbf9f5" stroke="#d8d0c1" stroke-width="1.4"/><circle cx="428" cy="500" r="8.5" fill="#fbf9f5" stroke="#d8d0c1" stroke-width="1.4"/><circle cx="516" cy="500" r="8.5" fill="#fbf9f5" stroke="#d8d0c1" stroke-width="1.4"/><circle cx="604" cy="500" r="8.5" fill="#fbf9f5" stroke="#d8d0c1" stroke-width="1.4"/><circle cx="692" cy="500" r="8.5" fill="#fbf9f5" stroke="#d8d0c1" stroke-width="1.4"/><circle cx="780" cy="500" r="8.5" fill="#fbf9f5" stroke="#d8d0c1" stroke-width="1.4"/><circle cx="868" cy="500" r="8.5" fill="#fbf9f5" stroke="#d8d0c1" stroke-width="1.4"/><circle cx="956" cy="500" r="8.5" fill="#fbf9f5" stroke="#d8d0c1" stroke-width="1.4"/><text x="1008" y="505" font-size="12" fill="#746e64" font-weight="normal" text-anchor="start" font-family="'Segoe UI', 'Microsoft YaHei', 'PingFang SC', 'Noto Sans SC', Helvetica, Arial, sans-serif">0 个状态</text><line x1="314" y1="220" x2="314" y2="273.2" stroke="#7d5a1e" stroke-width="1.6"/><path d="M 314 280 L 311.03 272.57 L 316.97 272.57 Z" fill="#7d5a1e"/><text x="306" y="254" font-size="12" fill="#7d5a1e" font-weight="bold" text-anchor="end" font-family="'Segoe UI', 'Microsoft YaHei', 'PingFang SC', 'Noto Sans SC', Helvetica, Arial, sans-serif">K</text><line x1="314" y1="320" x2="314" y2="373.2" stroke="#7d5a1e" stroke-width="1.6"/><path d="M 314 380 L 311.03 372.57 L 316.97 372.57 Z" fill="#7d5a1e"/><text x="306" y="354" font-size="12" fill="#7d5a1e" font-weight="bold" text-anchor="end" font-family="'Segoe UI', 'Microsoft YaHei', 'PingFang SC', 'Noto Sans SC', Helvetica, Arial, sans-serif">K</text><line x1="314" y1="420" x2="314" y2="473.2" stroke="#7d5a1e" stroke-width="1.6"/><path d="M 314 480 L 311.03 472.57 L 316.97 472.57 Z" fill="#7d5a1e"/><text x="306" y="454" font-size="12" fill="#7d5a1e" font-weight="bold" text-anchor="end" font-family="'Segoe UI', 'Microsoft YaHei', 'PingFang SC', 'Noto Sans SC', Helvetica, Arial, sans-serif">K</text><rect x="40" y="554" width="1040" height="124" rx="12" fill="#f3ead9" stroke="none" stroke-width="1"/><text x="60" y="582" font-size="14" fill="#1b2b45" font-weight="bold" text-anchor="start" font-family="'Segoe UI', 'Microsoft YaHei', 'PingFang SC', 'Noto Sans SC', Helvetica, Arial, sans-serif">读法</text><text x="60" y="608" font-size="13" fill="#57534c" font-weight="normal" text-anchor="start" font-family="'Segoe UI', 'Microsoft YaHei', 'PingFang SC', 'Noto Sans SC', Helvetica, Arial, sans-serif">实心点表示「该状态仍在集合里」，空心点表示已被排除。真实状态是 111。</text><text x="60" y="634" font-size="13" fill="#57534c" font-weight="normal" text-anchor="start" font-family="'Segoe UI', 'Microsoft YaHei', 'PingFang SC', 'Noto Sans SC', Helvetica, Arial, sans-serif">在 111 下 E≥1 是二阶相互知识，却不是三阶，因此不是共同知识；老师的公告才把它抬成共同知识。</text></svg>
