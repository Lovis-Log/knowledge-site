" fill="none" stroke="#e7e1d6" stroke-width="1.1" stroke-dasharray="4 4"/><path d="M 516.67 480 L 516.67 210" fill="none" stroke="#e7e1d6" stroke-width="1.1" stroke-dasharray="4 4"/><path d="M 350 480 L 350 210" fill="none" stroke="#e7e1d6" stroke-width="1.1" stroke-dasharray="4 4"/><circle cx="183.33" cy="372" r="4" fill="#7d5a1e" stroke="none" stroke-width="1"/><circle cx="183.33" cy="372" r="7" fill="none" stroke="#7d5a1e" stroke-width="1"/><circle cx="516.67" cy="372" r="4" fill="#7d5a1e" stroke="none" stroke-width="1"/><circle cx="516.67" cy="372" r="7" fill="none" stroke="#7d5a1e" stroke-width="1"/><circle cx="350" cy="458.4" r="3" fill="#7d5a1e" stroke="none" stroke-width="1"/><circle cx="350" cy="458.4" r="6" fill="none" stroke="#7d5a1e" stroke-width="1"/><text x="175.33" y="394" font-size="11.5" fill="#7d5a1e" font-weight="bold" text-anchor="end" font-family="'Segoe UI', 'Microsoft YaHei', 'PingFang SC', 'Noto Sans SC', Helvetica, Arial, sans-serif">λ₁ = 1</text><text x="524.67" y="394" font-size="11.5" fill="#7d5a1e" font-weight="bold" text-anchor="start" font-family="'Segoe UI', 'Microsoft YaHei', 'PingFang SC', 'Noto Sans SC', Helvetica, Arial, sans-serif">λ₂ = 9</text><text x="340" y="362" font-size="11.5" fill="#57534c" font-weight="bold" text-anchor="end" font-family="'Segoe UI', 'Microsoft YaHei', 'PingFang SC', 'Noto Sans SC', Helvetica, Arial, sans-serif">m = 5</text><line x1="350" y1="350.4" x2="516.67" y2="350.4" stroke="#9c4a2f" stroke-width="1.2"/><line x1="350" y1="345.4" x2="350" y2="355.4" stroke="#9c4a2f" stroke-width="1.2"/><line x1="516.67" y1="345.4" x2="516.67" y2="355.4" stroke="#9c4a2f" stroke-width="1.2"/><text x="433.33" y="366.4" font-size="11.5" fill="#9c4a2f" font-weight="bold" text-anchor="middle" font-family="'Segoe UI', 'Microsoft YaHei', 'PingFang SC', 'Noto Sans SC', Helvetica, Arial, sans-serif">d = 4</text><text x="58" y="520" font-size="11" fill="#57534c" font-weight="normal" text-anchor="start" font-family="'Segoe UI', 'Microsoft YaHei', 'PingFang SC', 'Noto Sans SC', Helvetica, Arial, sans-serif">m = (2+8)/2 = 5；p = 2·8 − 7·1 = 9</text><rect x="680" y="124" width="400" height="430" rx="14" fill="#fffdf9" stroke="#d8d0c1" stroke-width="1"/><text x="698" y="157" font-size="14" fill="#1b2b45" font-weight="bold" text-anchor="start" font-family="'Segoe UI', 'Microsoft YaHei', 'PingFang SC', 'Noto Sans SC', Helvetica, Arial, sans-serif">② Example: A = [[2,7],[1,8]]</text><path d="M 727 224 L 721 224 L 721 300 L 727 300" fill="none" stroke="#d8d0c1" stroke-width="1.6"/><path d="M 821 224 L 827 224 L 827 300 L 821 300" fill="none" stroke="#d8d0c1" stroke-width="1.6"/><text x="752" y="249.76" font-size="15" fill="#1b2b45" font-weight="normal" text-anchor="middle" font-family="Consolas, 'Cascadia Mono', 'JetBrains Mono', monospace">2</text><text x="796" y="249.76" font-size="15" fill="#1b2b45" font-weight="normal" text-anchor="middle" font-family="Consolas, 'Cascadia Mono', 'JetBrains Mono', monospace">7</text><text x="752" y="285.76" font-size="15" fill="#1b2b45" font-weight="normal" text-anchor="middle" font-family="Consolas, 'Cascadia Mono', 'JetBrains Mono', monospace">1</text><text x="796" y="285.76" font-size="15" fill="#1b2b45" font-weight="normal" text-anchor="middle" font-family="Consolas, 'Cascadia Mono', 'JetBrains Mono', monospace">8</text><text x="730" y="320" font-size="12" fill="#57534c" font-weight="normal" text-anchor="start" font-family="'Segoe UI', 'Microsoft YaHei', 'PingFang SC', 'Noto Sans SC', Helvetica, Arial, sans-serif">m = (2+8)/2 = 5</text><text x="730" y="352" font-size="12" fill="#57534c" font-weight="normal" text-anchor="start" font-family="'Segoe UI', 'Microsoft YaHei', 'PingFang SC', 'Noto Sans SC', Helvetica, Arial, sans-serif">p = 2·8 − 7·1 = 9</text><text x="730" y="404" font-size="13" fill="#7d5a1e" font-weight="bold" text-anchor="start" font-family="'Segoe UI', 'Microsoft YaHei', 'PingFang SC', 'Noto Sans SC', Helvetica, Arial, sans-serif">λ = 5 ± 4 → 9, 1</text><text x="730" y="452" font-size="11" fill="#57534c" font-weight="normal" text-anchor="start" font-family="'Segoe UI', 'Microsoft YaHei', 'PingFang SC', 'Noto Sans SC', Helvetica, Arial, sans-serif">det(A−λI)=0</text><rect x="40" y="578" width="1040" height="124" rx="12" fill="#f3ead9" stroke="none" stroke-width="1"/><text x="60" y="606" font-size="14" fill="#1b2b45" font-weight="bold" text-anchor="start" font-family="'Segoe UI', 'Microsoft YaHei', 'PingFang SC', 'Noto Sans SC', Helvetica, Arial, sans-serif">Takeaway</text><text x="60" y="632" font-size="13" fill="#57534c" font-weight="normal" text-anchor="start" font-family="'Segoe UI', 'Microsoft YaHei', 'PingFang SC', 'Noto Sans SC', Helvetica, Arial, sans-serif">No quadratic formula needed: take the mean of the diagonal m, then the determinant p, and the eigenvalues are m±√(m²−p).</text><text x="60" y="658" font-size="13" fill="#57534c" font-weight="normal" text-anchor="start" font-family="'Segoe UI', 'Microsoft YaHei', 'PingFang SC', 'Noto Sans SC', Helvetica, Arial, sans-serif">A negative discriminant means no real eigenvalues, which corresponds to a rotation — the parabola misses the λ-axis.</text></svg>
