<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 680" width="1120" height="680" font-family="Segoe UI, Helvetica, Arial, sans-serif" role="img" lang="en"><title>Four fundamental subspaces</title><rect width="1120" height="680" fill="#fbf9f5"/><defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1b2b45"/></marker><marker id="ara" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7d5a1e"/></marker></defs><text x="36" y="30" font-size="17" fill="#1b2b45" text-anchor="start" font-weight="bold">Four fundamental subspaces: one matrix splits two spaces into four</text><text x="36" y="56" font-size="13" fill="#57534c" text-anchor="start" font-weight="normal">A is m×n with rank r; row rank and column rank are both r.</text><rect x="40" y="96" width="340" height="400" rx="14" fill="none" stroke="#d8d0c1" stroke-width="1"/><text x="210" y="122" font-size="13" fill="#1b2b45" text-anchor="middle" font-weight="normal">ℝⁿ (input space)</text><rect x="55" y="140" width="310" height="150" rx="10" fill="#f3ead9" stroke="#d8d0c1" stroke-width="1"/><text x="210" y="205" font-size="15" fill="#1b2b45" text-anchor="middle" font-weight="bold">Row space C(Aᵀ)</text><text x="210" y="232" font-size="13" fill="#57534c" text-anchor="middle" font-weight="normal">dim r</text><text x="210" y="262" font-size="12" fill="#57534c" text-anchor="middle" font-weight="normal">basis: first r rows of R</text><rect x="55" y="330" width="310" height="150" rx="10" fill="#fdfbf7" stroke="#d8d0c1" stroke-width="1"/><text x="210" y="392" font-size="15" fill="#1b2b45" text-anchor="middle" font-weight="bold">Nullspace N(A)</text><text x="210" y="419" font-size="13" fill="#57534c" text-anchor="middle" font-weight="normal">dim n − r</text><text x="210" y="449" font-size="12" fill="#57534c" text-anchor="middle" font-weight="normal">basis: n−r special solutions</text><text x="210" y="312" font-size="16" fill="#7d5a1e" text-anchor="middle" font-weight="bold">⟂</text><rect x="420" y="96" width="340" height="400" rx="14" fill="none" stroke="#d8d0c1" stroke-width="1"/><text x="590" y="122" font-size="13" fill="#1b2b45" text-anchor="middle" font-weight="normal">ℝᵐ (output space)</text><rect x="435" y="140" width="310" height="150" rx="10" fill="#f3ead9" stroke="#d8d0c1" stroke-width="1"/><text x="590" y="205" font-size="15" fill="#1b2b45" text-anchor="middle" font-weight="bold">Column space C(A)</text><text x="590" y="232" font-size="13" fill="#57534c" text-anchor="middle" font-weight="normal">dim r</text><text x="590" y="262" font-size="12" fill="#57534c" text-anchor="middle" font-weight="normal">basis: pivot columns of A</text><rect x="435" y="330" width="310" height="150" rx="10" fill="#fdfbf7" stroke="#d8d0c1" stroke-width="1"/><text x="590" y="392" font-size="15" fill="#1b2b45" text-anchor="middle" font-weight="bold">Left nullspace N(Aᵀ)</text><text x="590" y="419" font-size="13" fill="#57534c" text-anchor="middle" font-weight="normal">dim m − r</text><text x="590" y="449" font-size="12" fill="#57534c" text-anchor="middle" font-weight="normal">basis: last m−r rows of E</text><text x="590" y="312" font-size="16" fill="#7d5a1e" text-anchor="middle" font-weight="bold">⟂</text><line x1="367" y1="215" x2="432" y2="215" stroke="#7d5a1e" stroke-width="2.5" marker-end="url(#ara)"/><text x="400" y="203" font-size="13" fill="#7d5a1e" text-anchor="middle" font-weight="bold">A</text><line x1="432" y1="250" x2="367" y2="250" stroke="#57534c" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#ar)"/><text x="400" y="268" font-size="12" fill="#57534c" text-anchor="middle" font-weight="normal">Aᵀ</text><line x1="367" y1="405" x2="432" y2="405" stroke="#57534c" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#ar)"/><text x="400" y="393" font-size="13" fill="#57534c" text-anchor="middle" font-weight="normal">0</text><rect x="780" y="96" width="305" height="400" rx="14" fill="#fdfbf7" stroke="#d8d0c1" stroke-width="1"/><text x="796" y="124" font-size="13" fill="#1b2b45" text-anchor="start" font-weight="bold">The four at a glance</text><text x="796" y="150" font-size="12.5" fill="#1b2b45" text-anchor="start" font-weight="bold">Column C(A)</text><text x="960" y="150" font-size="12.5" fill="#7d5a1e" text-anchor="middle" font-weight="normal">r</text><text x="996" y="150" font-size="12" fill="#57534c" text-anchor="start" font-weight="normal">pivot cols</text><line x1="790" y1="164" x2="1072" y2="164" stroke="#d8d0c1" stroke-width="1"/><text x="796" y="212" font-size="12.5" fill="#1b2b45" text-anchor="start" font-weight="bold">Row C(Aᵀ)</text><text x="960" y="212" font-size="12.5" fill="#7d5a1e" text-anchor="middle" font-weight="normal">r</text><text x="996" y="212" font-size="12" fill="#57534c" text-anchor="start" font-weight="normal">first r rows</text><line x1="790" y1="226" x2="1072" y2="226" stroke="#d8d0c1" stroke-width="1"/><text x="796" y="274" font-size="12.5" fill="#1b2b45" text-anchor="start" font-weight="bold">Null N(A)</text><text x="960" y="274" font-size="12.5" fill="#7d5a1e" text-anchor="middle" font-weight="normal">n−r</text><text x="996" y="274" font-size="12" fill="#57534c" text-anchor="start" font-weight="normal">special sols</text><line x1="790" y1="288" x2="1072" y2="288" stroke="#d8d0c1" stroke-width="1"/><text x="796" y="336" font-size="12.5" fill="#1b2b45" text-anchor="start" font-weight="bold">Left null N(Aᵀ)</text><text x="960" y="336" font-size="12.5" fill="#7d5a1e" text-anchor="middle" font-weight="normal">m−r</text><text x="996" y="336" font-size="12" fill="#57534c" text-anchor="start" font-weight="normal">last m−r rows</text><line x1="790" y1="350" x2="1072" y2="350" stroke="#d8d0c1" stroke-width="1"/><text x="796" y="380" font-size="12" fill="#57534c" text-anchor="start" font-weight="normal">m rows, n columns, rank r</text><text x="796" y="404" font-size="12" fill="#57534c" text-anchor="start" font-weight="normal">r ≤ min(m, n)</text><text x="796" y="428" font-size="12" fill="#57534c" text-anchor="start" font-weight="normal">dimension sums:</text><text x="796" y="450" font-size="12" fill="#1b2b45" text-anchor="start" font-weight="normal" font-family="Consolas, Cascadia Mono, monospace">r + (n−r) = n</text><text x="796" y="472" font-size="12" fill="#1b2b45" text-anchor="start" font-weight="normal" font-family="Consolas, Cascadia Mono, monospace">r + (m−r) = m</text><rect x="40" y="528" width="1045" height="116" rx="12" fill="#f3ead9" stroke="#d8d0c1" stroke-width="1"/><text x="60" y="558" font-size="14" fill="#1b2b45" text-anchor="start" font-weight="bold">Three facts to remember</text><text x="60" y="588" font-size="13" fill="#57534c" text-anchor="start" font-weight="normal">① row rank = column rank = r, one number</text><text x="60" y="612" font-size="13" fill="#57534c" text-anchor="start" font-weight="normal">② row space ⟂ nullspace: reach vs. collapse to 0</text><text x="60" y="636" font-size="13" fill="#57534c" text-anchor="start" font-weight="normal">③ column space ⟂ left nullspace: Ax=b solvable ⟺ b ⟂ left null</text></svg>