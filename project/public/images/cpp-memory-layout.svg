<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 600" width="880" height="600" font-family="Segoe UI, Helvetica, Arial, sans-serif" role="img"><title>C++ program memory layout</title><defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1b2b45"/></marker><marker id="ara" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7d5a1e"/></marker></defs><rect width="880" height="600" fill="#fbf9f5"/><rect x="300" y="70" width="360" height="80" fill="#f3ead9" stroke="#d8d0c1"/><text x="480.0" y="116.0" font-size="15" fill="#1b2b45" text-anchor="middle" font-weight="bold">Text (code)</text><text x="676" y="115.0" font-size="13" fill="#57534c" text-anchor="start" font-weight="normal">read-only machine code</text><rect x="300" y="150" width="360" height="80" fill="#f3ead9" stroke="#d8d0c1"/><text x="480.0" y="196.0" font-size="15" fill="#1b2b45" text-anchor="middle" font-weight="bold">Data</text><text x="676" y="195.0" font-size="13" fill="#57534c" text-anchor="start" font-weight="normal">initialized globals / statics</text><rect x="300" y="230" width="360" height="70" fill="#f3ead9" stroke="#d8d0c1"/><text x="480.0" y="271.0" font-size="15" fill="#1b2b45" text-anchor="middle" font-weight="bold">BSS</text><text x="676" y="270.0" font-size="13" fill="#57534c" text-anchor="start" font-weight="normal">zero-initialized globals</text><rect x="300" y="300" width="360" height="120" fill="#f3ead9" stroke="#d8d0c1"/><text x="480.0" y="366.0" font-size="15" fill="#1b2b45" text-anchor="middle" font-weight="bold">Heap</text><text x="676" y="365.0" font-size="13" fill="#57534c" text-anchor="start" font-weight="normal">new / malloc   grows up</text><rect x="300" y="420" width="360" height="50" fill="none" stroke="#d8d0c1" stroke-dasharray="6 5"/><text x="676" y="450.0" font-size="13" fill="#57534c" text-anchor="start" font-weight="normal">free space</text><rect x="300" y="470" width="360" height="90" fill="#f3ead9" stroke="#d8d0c1"/><text x="480.0" y="521.0" font-size="15" fill="#1b2b45" text-anchor="middle" font-weight="bold">Stack</text><text x="676" y="520.0" font-size="13" fill="#57534c" text-anchor="start" font-weight="normal">locals, call frames   grows down</text><line x1="240" y1="470" x2="240" y2="300" stroke="#7d5a1e" stroke-width="2" marker-end="url(#ara)"/><text x="230" y="390" font-size="13" fill="#7d5a1e" text-anchor="end" font-weight="normal">new</text><line x1="830" y1="300" x2="830" y2="470" stroke="#57534c" stroke-width="2" marker-end="url(#ar)"/><text x="840" y="390" font-size="13" fill="#57534c" text-anchor="start" font-weight="normal">delete</text><text x="300" y="585" font-size="12" fill="#57534c" text-anchor="start" font-weight="normal">low addresses</text><text x="660" y="585" font-size="12" fill="#57534c" text-anchor="end" font-weight="normal">high addresses</text></svg>