<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1020 470" width="1020" height="470" font-family="'Microsoft YaHei','Noto Sans SC','PingFang SC',sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#64748b"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="1020" height="470" rx="18" fill="#fbfcfe"/>
  <rect x="1" y="1" width="1018" height="468" rx="17" fill="none" stroke="#e2e8f0"/>

  <text x="34" y="42" font-size="23" font-weight="700" fill="#0f172a">int** 动态二维数组：两级分配，行与行不连续</text>
  <text x="34" y="72" font-size="15" fill="#475569">先申请存放行指针的数组，再逐行申请；释放时反过来。</text>

  <!-- stack pointer -->
  <rect x="34" y="150" width="128" height="62" rx="8" fill="#e0f2fe" stroke="#0284c7" stroke-width="2"/>
  <text x="98" y="176" text-anchor="middle" font-size="17" font-family="'Cascadia Code','Consolas',monospace" fill="#0c4a6e">int** arr</text>
  <text x="98" y="198" text-anchor="middle" font-size="12" fill="#0369a1">栈上的指针变量</text>
  <line x1="162" y1="181" x2="236" y2="181" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- pointer array, vertical -->
  <text x="246" y="132" font-size="14" font-weight="700" fill="#334155">指针数组（rows 个 int*）</text>
  <g>
    <rect x="246" y="150" width="150" height="60" rx="6" fill="#fef3c7" stroke="#d97706" stroke-width="2"/>
    <text x="321" y="177" text-anchor="middle" font-size="15" font-family="'Cascadia Code','Consolas',monospace" fill="#92400e">arr[0]</text>
    <text x="321" y="198" text-anchor="middle" font-size="12" fill="#b45309">行 0 首地址</text>

    <rect x="246" y="210" width="150" height="60" rx="6" fill="#fef3c7" stroke="#d97706" stroke-width="2"/>
    <text x="321" y="237" text-anchor="middle" font-size="15" font-family="'Cascadia Code','Consolas',monospace" fill="#92400e">arr[1]</text>
    <text x="321" y="258" text-anchor="middle" font-size="12" fill="#b45309">行 1 首地址</text>

    <rect x="246" y="270" width="150" height="60" rx="6" fill="#fef3c7" stroke="#d97706" stroke-width="2"/>
    <text x="321" y="297" text-anchor="middle" font-size="15" font-family="'Cascadia Code','Consolas',monospace" fill="#92400e">arr[2]</text>
    <text x="321" y="318" text-anchor="middle" font-size="12" fill="#b45309">行 2 首地址</text>
  </g>
  <text x="321" y="354" text-anchor="middle" font-size="12" fill="#64748b">new int*[rows] 得到这一整块</text>

  <!-- rows -->
  <g>
    <text x="640" y="84" font-size="14" font-weight="700" fill="#334155">第 0 行：new int[cols]，5 个 int</text>
    <rect x="640" y="96" width="50" height="44" rx="4" fill="#dcfce7" stroke="#16a34a"/>
    <text x="665" y="124" text-anchor="middle" font-size="18" font-family="'Cascadia Code','Consolas',monospace" fill="#14532d">0</text>
    <rect x="690" y="96" width="50" height="44" rx="4" fill="#dcfce7" stroke="#16a34a"/>
    <text x="715" y="124" text-anchor="middle" font-size="18" font-family="'Cascadia Code','Consolas',monospace" fill="#14532d">1</text>
    <rect x="740" y="96" width="50" height="44" rx="4" fill="#dcfce7" stroke="#16a34a"/>
    <text x="765" y="124" text-anchor="middle" font-size="18" font-family="'Cascadia Code','Consolas',monospace" fill="#14532d">2</text>
    <rect x="790" y="96" width="50" height="44" rx="4" fill="#dcfce7" stroke="#16a34a"/>
    <text x="815" y="124" text-anchor="middle" font-size="18" font-family="'Cascadia Code','Consolas',monospace" fill="#14532d">3</text>
    <rect x="840" y="96" width="50" height="44" rx="4" fill="#dcfce7" stroke="#16a34a"/>
    <text x="865" y="124" text-anchor="middle" font-size="18" font-family="'Cascadia Code','Consolas',monospace" fill="#14532d">4</text>
    <text x="906" y="123" font-size="12" fill="#15803d">arr[0][0..4]</text>

    <text x="640" y="196" font-size="14" font-weight="700" fill="#334155">第 1 行：另一块独立内存</text>
    <rect x="640" y="208" width="50" height="44" rx="4" fill="#dcfce7" stroke="#16a34a"/>
    <text x="665" y="236" text-anchor="middle" font-size="18" font-family="'Cascadia Code','Consolas',monospace" fill="#14532d">5</text>
    <rect x="690" y="208" width="50" height="44" rx="4" fill="#dcfce7" stroke="#16a34a"/>
    <text x="715" y="236" text-anchor="middle" font-size="18" font-family="'Cascadia Code','Consolas',monospace" fill="#14532d">6</text>
    <rect x="740" y="208" width="50" height="44" rx="4" fill="#dcfce7" stroke="#16a34a"/>
    <text x="765" y="236" text-anchor="middle" font-size="18" font-family="'Cascadia Code','Consolas',monospace" fill="#14532d">7</text>
    <rect x="790" y="208" width="50" height="44" rx="4" fill="#dcfce7" stroke="#16a34a"/>
    <text x="815" y="236" text-anchor="middle" font-size="18" font-family="'Cascadia Code','Consolas',monospace" fill="#14532d">8</text>
    <rect x="840" y="208" width="50" height="44" rx="4" fill="#dcfce7" stroke="#16a34a"/>
    <text x="865" y="236" text-anchor="middle" font-size="18" font-family="'Cascadia Code','Consolas',monospace" fill="#14532d">9</text>
    <text x="906" y="235" font-size="12" fill="#15803d">arr[1][0..4]</text>

    <text x="640" y="308" font-size="14" font-weight="700" fill="#334155">第 2 行：再申请一块</text>
    <rect x="640" y="320" width="50" height="44" rx="4" fill="#dcfce7" stroke="#16a34a"/>
    <text x="665" y="348" text-anchor="middle" font-size="18" font-family="'Cascadia Code','Consolas',monospace" fill="#14532d">10</text>
    <rect x="690" y="320" width="50" height="44" rx="4" fill="#dcfce7" stroke="#16a34a"/>
    <text x="715" y="348" text-anchor="middle" font-size="18" font-family="'Cascadia Code','Consolas',monospace" fill="#14532d">11</text>
    <rect x="740" y="320" width="50" height="44" rx="4" fill="#dcfce7" stroke="#16a34a"/>
    <text x="765" y="348" text-anchor="middle" font-size="18" font-family="'Cascadia Code','Consolas',monospace" fill="#14532d">12</text>
    <rect x="790" y="320" width="50" height="44" rx="4" fill="#dcfce7" stroke="#16a34a"/>
    <text x="815" y="348" text-anchor="middle" font-size="18" font-family="'Cascadia Code','Consolas',monospace" fill="#14532d">13</text>
    <rect x="840" y="320" width="50" height="44" rx="4" fill="#dcfce7" stroke="#16a34a"/>
    <text x="865" y="348" text-anchor="middle" font-size="18" font-family="'Cascadia Code','Consolas',monospace" fill="#14532d">14</text>
    <text x="906" y="347" font-size="12" fill="#15803d">arr[2][0..4]</text>
  </g>

  <!-- arrows from pointer cells to rows -->
  <path d="M396 180 C 500 180, 520 118, 634 118" fill="none" stroke="#64748b" stroke-width="1.8" marker-end="url(#arrow)"/>
  <path d="M396 240 C 500 240, 520 230, 634 230" fill="none" stroke="#64748b" stroke-width="1.8" marker-end="url(#arrow)"/>
  <path d="M396 300 C 500 300, 520 342, 634 342" fill="none" stroke="#64748b" stroke-width="1.8" marker-end="url(#arrow)"/>

  <rect x="246" y="392" width="644" height="48" rx="8" fill="#f1f5f9" stroke="#cbd5e1"/>
  <text x="262" y="422" font-size="14" fill="#334155">释放顺序：for (i = 0; i &lt; rows; ++i) delete[] arr[i]; 然后 delete[] arr;</text>
</svg>
