<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 450" width="1040" height="450" role="img" aria-labelledby="fibTitle fibDesc">
  <title id="fibTitle">fib(5) 的递归调用树</title>
  <desc id="fibDesc">fib(5) 展开后共 15 次函数调用；fib(3) 被重复计算 2 次，fib(2) 3 次，fib(1) 5 次，fib(0) 3 次。相同颜色的节点表示同参数子问题被重复求值。</desc>
  <defs>
    <style>
      .title { font-family: "Noto Sans SC", "Microsoft YaHei", "PingFang SC", sans-serif; font-size: 21px; font-weight: 700; fill: #0f172a; }
      .subtitle { font-family: "Noto Sans SC", "Microsoft YaHei", "PingFang SC", sans-serif; font-size: 14px; fill: #64748b; }
      .node { font-family: "Noto Sans SC", "Microsoft YaHei", "PingFang SC", sans-serif; font-size: 12px; font-weight: 700; }
      .count { font-family: "Noto Sans SC", "Microsoft YaHei", "PingFang SC", sans-serif; font-size: 9px; }
      .legend { font-family: "Noto Sans SC", "Microsoft YaHei", "PingFang SC", sans-serif; font-size: 12px; fill: #475569; }
      .foot { font-family: "Noto Sans SC", "Microsoft YaHei", "PingFang SC", sans-serif; font-size: 13px; fill: #334155; }
      .edge { stroke: #94a3b8; stroke-width: 1.5; fill: none; }
    </style>
  </defs>

  <rect width="1040" height="450" fill="#ffffff"/>
  <text class="title" x="520" y="32" text-anchor="middle">fib(5) 的递归调用树</text>
  <text class="subtitle" x="520" y="56" text-anchor="middle">同一个子问题被反复求值：fib(3) 算 2 次，fib(2) 算 3 次</text>

  <!-- 边 -->
  <path class="edge" d="M520 112 L360 153"/>
  <path class="edge" d="M520 112 L680 153"/>
  <path class="edge" d="M360 187 L250 218"/>
  <path class="edge" d="M360 187 L480 218"/>
  <path class="edge" d="M680 187 L620 218"/>
  <path class="edge" d="M680 187 L800 218"/>
  <path class="edge" d="M250 252 L170 283"/>
  <path class="edge" d="M250 252 L330 283"/>
  <path class="edge" d="M480 252 L440 283"/>
  <path class="edge" d="M480 252 L535 283"/>
  <path class="edge" d="M620 252 L610 283"/>
  <path class="edge" d="M620 252 L705 283"/>
  <path class="edge" d="M170 317 L130 348"/>
  <path class="edge" d="M170 317 L210 348"/>

  <!-- 根 -->
  <rect x="487" y="78" width="66" height="34" rx="7" fill="#f1f5f9" stroke="#64748b" stroke-width="1.5"/>
  <text class="node" x="520" y="96" text-anchor="middle" fill="#334155">fib(5)</text>
  <text class="count" x="520" y="108" text-anchor="middle" fill="#64748b">×1</text>

  <!-- 第 2 层 -->
  <rect x="327" y="153" width="66" height="34" rx="7" fill="#f1f5f9" stroke="#64748b" stroke-width="1.5"/>
  <text class="node" x="360" y="171" text-anchor="middle" fill="#334155">fib(4)</text>
  <text class="count" x="360" y="183" text-anchor="middle" fill="#64748b">×1</text>

  <rect x="647" y="153" width="66" height="34" rx="7" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.8"/>
  <text class="node" x="680" y="171" text-anchor="middle" fill="#b45309">fib(3)</text>
  <text class="count" x="680" y="183" text-anchor="middle" fill="#b45309">×2</text>

  <!-- 第 3 层 -->
  <rect x="217" y="218" width="66" height="34" rx="7" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.8"/>
  <text class="node" x="250" y="236" text-anchor="middle" fill="#b45309">fib(3)</text>
  <text class="count" x="250" y="248" text-anchor="middle" fill="#b45309">×2</text>

  <rect x="447" y="218" width="66" height="34" rx="7" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.8"/>
  <text class="node" x="480" y="236" text-anchor="middle" fill="#1d4ed8">fib(2)</text>
  <text class="count" x="480" y="248" text-anchor="middle" fill="#1d4ed8">×3</text>

  <rect x="587" y="218" width="66" height="34" rx="7" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.8"/>
  <text class="node" x="620" y="236" text-anchor="middle" fill="#1d4ed8">fib(2)</text>
  <text class="count" x="620" y="248" text-anchor="middle" fill="#1d4ed8">×3</text>

  <rect x="767" y="218" width="66" height="34" rx="7" fill="#ecfdf5" stroke="#10b981" stroke-width="1.8"/>
  <text class="node" x="800" y="236" text-anchor="middle" fill="#047857">fib(1)</text>
  <text class="count" x="800" y="248" text-anchor="middle" fill="#047857">×5</text>

  <!-- 第 4 层 -->
  <rect x="137" y="283" width="66" height="34" rx="7" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.8"/>
  <text class="node" x="170" y="301" text-anchor="middle" fill="#1d4ed8">fib(2)</text>
  <text class="count" x="170" y="313" text-anchor="middle" fill="#1d4ed8">×3</text>

  <rect x="297" y="283" width="66" height="34" rx="7" fill="#ecfdf5" stroke="#10b981" stroke-width="1.8"/>
  <text class="node" x="330" y="301" text-anchor="middle" fill="#047857">fib(1)</text>
  <text class="count" x="330" y="313" text-anchor="middle" fill="#047857">×5</text>

  <rect x="407" y="283" width="66" height="34" rx="7" fill="#ecfdf5" stroke="#10b981" stroke-width="1.8"/>
  <text class="node" x="440" y="301" text-anchor="middle" fill="#047857">fib(1)</text>
  <text class="count" x="440" y="313" text-anchor="middle" fill="#047857">×5</text>

  <rect x="502" y="283" width="66" height="34" rx="7" fill="#fdf2f8" stroke="#ec4899" stroke-width="1.8"/>
  <text class="node" x="535" y="301" text-anchor="middle" fill="#be185d">fib(0)</text>
  <text class="count" x="535" y="313" text-anchor="middle" fill="#be185d">×3</text>

  <rect x="577" y="283" width="66" height="34" rx="7" fill="#ecfdf5" stroke="#10b981" stroke-width="1.8"/>
  <text class="node" x="610" y="301" text-anchor="middle" fill="#047857">fib(1)</text>
  <text class="count" x="610" y="313" text-anchor="middle" fill="#047857">×5</text>

  <rect x="672" y="283" width="66" height="34" rx="7" fill="#fdf2f8" stroke="#ec4899" stroke-width="1.8"/>
  <text class="node" x="705" y="301" text-anchor="middle" fill="#be185d">fib(0)</text>
  <text class="count" x="705" y="313" text-anchor="middle" fill="#be185d">×3</text>

  <!-- 第 5 层 -->
  <rect x="97" y="348" width="66" height="34" rx="7" fill="#ecfdf5" stroke="#10b981" stroke-width="1.8"/>
  <text class="node" x="130" y="366" text-anchor="middle" fill="#047857">fib(1)</text>
  <text class="count" x="130" y="378" text-anchor="middle" fill="#047857">×5</text>

  <rect x="177" y="348" width="66" height="34" rx="7" fill="#fdf2f8" stroke="#ec4899" stroke-width="1.8"/>
  <text class="node" x="210" y="366" text-anchor="middle" fill="#be185d">fib(0)</text>
  <text class="count" x="210" y="378" text-anchor="middle" fill="#be185d">×3</text>

  <!-- 图例与结论 -->
  <rect x="60" y="404" width="10" height="10" rx="2" fill="#f1f5f9" stroke="#64748b"/>
  <text class="legend" x="76" y="414">调用 1 次</text>
  <rect x="156" y="404" width="10" height="10" rx="2" fill="#fffbeb" stroke="#f59e0b"/>
  <text class="legend" x="172" y="414">fib(3)：2 次</text>
  <rect x="276" y="404" width="10" height="10" rx="2" fill="#eff6ff" stroke="#3b82f6"/>
  <text class="legend" x="292" y="414">fib(2)：3 次</text>
  <rect x="396" y="404" width="10" height="10" rx="2" fill="#ecfdf5" stroke="#10b981"/>
  <text class="legend" x="412" y="414">fib(1)：5 次</text>
  <rect x="516" y="404" width="10" height="10" rx="2" fill="#fdf2f8" stroke="#ec4899"/>
  <text class="legend" x="532" y="414">fib(0)：3 次</text>
  <text class="foot" x="640" y="414">总调用 1+1+2+3+5+3 = 15 次</text>
  <text class="foot" x="520" y="438" text-anchor="middle">每多一层，调用规模约按 1.618 倍增长，直接递归的时间复杂度为指数级</text>
</svg>