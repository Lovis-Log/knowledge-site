<svg xmlns="http://www.w3.org/2000/svg" width="800" height="400" viewBox="0 0 800 400" role="img" aria-label="Agent 的观察、决策、行动循环">
  <rect width="800" height="400" fill="#FBF9F4"/>
  <g fill="none" stroke="#9A3412" stroke-width="2">
    <rect x="70" y="150" width="170" height="100" rx="2"/>
    <rect x="315" y="150" width="170" height="100" rx="2"/>
    <rect x="560" y="150" width="170" height="100" rx="2"/>
    <path d="M240 200 H305" marker-end="url(#arrow)"/>
    <path d="M485 200 H550" marker-end="url(#arrow)"/>
    <path d="M645 250 V330 H155 V260" marker-end="url(#arrow)" stroke-dasharray="6 6"/>
  </g>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#9A3412"/>
    </marker>
  </defs>
  <g fill="#1F1E1B" font-family="system-ui, 'PingFang SC', 'Microsoft YaHei', sans-serif" text-anchor="middle">
    <text x="155" y="192" font-size="22">观察</text>
    <text x="155" y="220" font-size="12" fill="#6E6A63">环境返回的新状态</text>
    <text x="400" y="192" font-size="22">决策</text>
    <text x="400" y="220" font-size="12" fill="#6E6A63">选择下一个动作</text>
    <text x="645" y="192" font-size="22">行动</text>
    <text x="645" y="220" font-size="12" fill="#6E6A63">调用工具、改变世界</text>
    <text x="400" y="362" font-size="12" fill="#6E6A63">循环直到任务完成，或预算耗尽</text>
  </g>
</svg>
