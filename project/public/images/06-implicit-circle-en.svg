adius, so its slope is −3/4; implicit</text><text x="58" y="552.1" font-size="11.5" fill="#57534c" font-weight="normal" text-anchor="start" font-family="'Segoe UI', 'Microsoft YaHei', 'PingFang SC', 'Noto Sans SC', Helvetica, Arial, sans-serif">differentiation agrees.</text><rect x="580" y="124" width="500" height="430" rx="14" fill="#fffdf9" stroke="#d8d0c1" stroke-width="1"/><text x="598" y="157" font-size="14" fill="#1b2b45" font-weight="bold" text-anchor="start" font-family="'Segoe UI', 'Microsoft YaHei', 'PingFang SC', 'Noto Sans SC', Helvetica, Arial, sans-serif">② Ladder: same constraint, plus time</text><line x1="690" y1="190" x2="690" y2="478" stroke="#d8d0c1" stroke-width="2"/><line x1="620" y1="478" x2="1040" y2="478" stroke="#d8d0c1" stroke-width="2"/><line x1="690" y1="458" x2="710" y2="458" stroke="#d8d0c1" stroke-width="1.1"/><line x1="710" y1="458" x2="710" y2="478" stroke="#d8d0c1" stroke-width="1.1"/><line x1="690" y1="270" x2="846" y2="478" stroke="#7d5a1e" stroke-width="3"/><line x1="690" y1="270" x2="690" y2="309.2" stroke="#9c4a2f" stroke-width="1.8"/><path d="M 690 316 L 687.03 308.57 L 692.97 308.57 Z" fill="#9c4a2f"/><text x="678" y="302" font-size="11.5" fill="#9c4a2f" font-weight="bold" text-anchor="end" font-family="'Segoe UI', 'Microsoft YaHei', 'PingFang SC', 'Noto Sans SC', Helvetica, Arial, sans-serif">dy/dt = −1</text><line x1="846" y1="478" x2="887.2" y2="478" stroke="#9c4a2f" stroke-width="1.8"/><path d="M 894 478 L 886.57 480.97 L 886.57 475.03 Z" fill="#9c4a2f"/><text x="870" y="502" font-size="11.5" fill="#9c4a2f" font-weight="bold" text-anchor="middle" font-family="'Segoe UI', 'Microsoft YaHei', 'PingFang SC', 'Noto Sans SC', Helvetica, Arial, sans-serif">dx/dt = 4/3</text><text x="780" y="370" font-size="12" fill="#7d5a1e" font-weight="bold" text-anchor="start" font-family="'Segoe UI', 'Microsoft YaHei', 'PingFang SC', 'Noto Sans SC', Helvetica, Arial, sans-serif">5 m</text><text x="678" y="378" font-size="12" fill="#57534c" font-weight="normal" text-anchor="end" font-family="'Segoe UI', 'Microsoft YaHei', 'PingFang SC', 'Noto Sans SC', Helvetica, Arial, sans-serif">4 m</text><text x="768" y="496" font-size="12" fill="#57534c" font-weight="normal" text-anchor="middle" font-family="'Segoe UI', 'Microsoft YaHei', 'PingFang SC', 'Noto Sans SC', Helvetica, Arial, sans-serif">3 m</text><text x="598" y="530" font-size="11" fill="#57534c" font-weight="normal" text-anchor="start" font-family="'Segoe UI', 'Microsoft YaHei', 'PingFang SC', 'Noto Sans SC', Helvetica, Arial, sans-serif">Differentiate x² + y² = 25 in t: 2x·dx/dt + 2y·dy/dt = 0; with x=3, y=4 this gives</text><text x="598" y="544.85" font-size="11" fill="#57534c" font-weight="normal" text-anchor="start" font-family="'Segoe UI', 'Microsoft YaHei', 'PingFang SC', 'Noto Sans SC', Helvetica, Arial, sans-serif">dx/dt = 4/3.</text><rect x="40" y="580.12" width="1040" height="124" rx="12" fill="#f3ead9" stroke="none" stroke-width="1"/><text x="60" y="608.12" font-size="14" fill="#1b2b45" font-weight="bold" text-anchor="start" font-family="'Segoe UI', 'Microsoft YaHei', 'PingFang SC', 'Noto Sans SC', Helvetica, Arial, sans-serif">Takeaway</text><text x="60" y="634.12" font-size="13" fill="#57534c" font-weight="normal" text-anchor="start" font-family="'Segoe UI', 'Microsoft YaHei', 'PingFang SC', 'Noto Sans SC', Helvetica, Arial, sans-serif">Treat x²+y² as one quantity: a step along the curve must leave it unchanged, so dS = 2x·dx + 2y·dy = 0.</text><text x="60" y="660.12" font-size="13" fill="#57534c" font-weight="normal" text-anchor="start" font-family="'Segoe UI', 'Microsoft YaHei', 'PingFang SC', 'Noto Sans SC', Helvetica, Arial, sans-serif">The ladder is the same equation: one question asks for a slope, the other for a rate, and both come from dS=0.</text></svg>
