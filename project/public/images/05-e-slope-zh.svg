xt x="650.36" y="460.44" font-size="12" fill="#7d5a1e" font-weight="bold" text-anchor="start" font-family="'Segoe UI', 'Microsoft YaHei', 'PingFang SC', 'Noto Sans SC', Helvetica, Arial, sans-serif">k = ln b</text><text x="598" y="512" font-size="11.5" fill="#57534c" font-weight="normal" text-anchor="start" font-family="'Segoe UI', 'Microsoft YaHei', 'PingFang SC', 'Noto Sans SC', Helvetica, Arial, sans-serif">底数为 b 时，导数 = k·bᵗ，其中 k = ln b；只有 b = e 让 k = 1。</text><rect x="40" y="578" width="1040" height="124" rx="12" fill="#f3ead9" stroke="none" stroke-width="1"/><text x="60" y="606" font-size="14" fill="#1b2b45" font-weight="bold" text-anchor="start" font-family="'Segoe UI', 'Microsoft YaHei', 'PingFang SC', 'Noto Sans SC', Helvetica, Arial, sans-serif">要点</text><text x="60" y="632" font-size="13" fill="#57534c" font-weight="normal" text-anchor="start" font-family="'Segoe UI', 'Microsoft YaHei', 'PingFang SC', 'Noto Sans SC', Helvetica, Arial, sans-serif">把一天切成 n 份、每份增长 1/n，极限就是 e≈2.718；它存在的意义是让导数等于自己。</text><text x="60" y="658" font-size="13" fill="#57534c" font-weight="normal" text-anchor="start" font-family="'Segoe UI', 'Microsoft YaHei', 'PingFang SC', 'Noto Sans SC', Helvetica, Arial, sans-serif">任何指数函数都满足“导数与自身成正比”，e 只是把比例常数调成 1 的那个底数。</text></svg>
