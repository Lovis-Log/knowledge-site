<svg xmlns="http://www.w3.org/2000/svg" width="820" height="340" viewBox="0 0 820 340">
  <defs>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#374151"/>
    </marker>
  </defs>
  <rect width="820" height="340" fill="#ffffff"/>
  <style>
    .ink{fill:#1f2937;font-family:'Microsoft YaHei','Noto Sans SC',sans-serif}
    .muted{fill:#6b7280;font-family:'Microsoft YaHei','Noto Sans SC',sans-serif}
    .ell{fill:#f8fafc;stroke:#374151;stroke-width:1.8}
    .arrow{stroke:#374151;stroke-width:1.6;fill:none;marker-end:url(#arrow)}
    .pt{fill:#2563eb}
  </style>

  <text x="40" y="34" class="ink" font-size="18" font-weight="600">映射 f : X → Y</text>
  <text x="40" y="58" class="muted" font-size="15">每个 x 的像唯一；一个 y 的原像可以不唯一</text>

  <ellipse cx="170" cy="180" rx="110" ry="100" class="ell"/>
  <text x="170" y="118" class="ink" font-size="17" text-anchor="middle">X</text>
  <text x="170" y="300" class="muted" font-size="14" text-anchor="middle">定义域 D_f = X</text>

  <ellipse cx="660" cy="180" rx="110" ry="100" class="ell"/>
  <text x="660" y="118" class="ink" font-size="17" text-anchor="middle">Y</text>
  <text x="660" y="300" class="muted" font-size="14" text-anchor="middle">陪域</text>
  <ellipse cx="660" cy="200" rx="72" ry="54" fill="#dbeafe" stroke="#2563eb" stroke-width="1.4" stroke-dasharray="5 4"/>
  <text x="660" y="205" class="ink" font-size="15" text-anchor="middle">R_f</text>

  <circle cx="130" cy="140" r="5" class="pt"/><text x="112" y="136" class="ink" font-size="15">x₁</text>
  <circle cx="130" cy="205" r="5" class="pt"/><text x="112" y="201" class="ink" font-size="15">x₂</text>
  <circle cx="205" cy="245" r="5" class="pt"/><text x="215" y="241" class="ink" font-size="15">x₃</text>

  <circle cx="620" cy="160" r="5" class="pt"/><text x="602" y="156" class="ink" font-size="15">y₁</text>
  <circle cx="700" cy="225" r="5" class="pt"/><text x="710" y="221" class="ink" font-size="15">y₂</text>

  <path d="M136,143 C260,120 430,130 612,157" class="arrow"/>
  <path d="M136,208 C280,220 430,190 612,165" class="arrow"/>
  <path d="M210,242 C360,250 520,240 692,228" class="arrow"/>

  <text x="400" y="92" class="muted" font-size="14" text-anchor="middle">y₁ 有两个原像：x₁、x₂</text>
  <text x="410" y="326" class="muted" font-size="13">值域 R_f = f(X) = { f(x) : x ∈ X }，它是陪域 Y 的子集。</text>
</svg>