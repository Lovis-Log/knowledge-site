<svg xmlns="http://www.w3.org/2000/svg" width="820" height="250" viewBox="0 0 820 250">
  <rect width="820" height="250" fill="#ffffff"/>
  <style>
    .axis{stroke:#1f2937;stroke-width:1.6}
    .ink{fill:#1f2937;font-family:'Microsoft YaHei','Noto Sans SC',sans-serif}
    .muted{fill:#6b7280;font-family:'Microsoft YaHei','Noto Sans SC',sans-serif}
    .dash{stroke:#9ca3af;stroke-width:1.2;stroke-dasharray:5 4}
  </style>

  <text x="40" y="34" class="ink" font-size="18" font-weight="600">上确界是最小上界</text>
  <text x="40" y="58" class="muted" font-size="15">μ = sup X：μ 是 X 的上界，且任何小于 μ 的数都不是 X 的上界</text>

  <rect x="520" y="88" width="240" height="42" fill="#fee2e2"/>
  <line x1="60" y1="150" x2="760" y2="150" class="axis"/>
  <polygon points="760,150 748,145 748,155" fill="#1f2937"/>
  <text x="768" y="155" class="muted" font-size="15">x</text>

  <line x1="160" y1="150" x2="480" y2="150" stroke="#2563eb" stroke-width="9" stroke-linecap="round"/>
  <circle cx="160" cy="150" r="5" fill="#ffffff" stroke="#2563eb" stroke-width="2"/>
  <circle cx="480" cy="150" r="5" fill="#2563eb"/>
  <text x="320" y="180" class="ink" font-size="15" text-anchor="middle">集合 X</text>

  <line x1="520" y1="80" x2="520" y2="190" stroke="#dc2626" stroke-width="2" stroke-dasharray="6 4"/>
  <circle cx="520" cy="150" r="6" fill="#dc2626"/>
  <text x="520" y="212" class="ink" font-size="15" text-anchor="middle" fill="#dc2626">sup X = μ</text>
  <text x="640" y="112" class="muted" font-size="14" text-anchor="middle">大于 μ 的数都是上界</text>

  <text x="160" y="212" class="muted" font-size="14" text-anchor="middle">X 可以不含 μ</text>
  <text x="40" y="236" class="muted" font-size="13">确界原理：非空且有上界的实数集一定有上确界；有理数集不具备这一性质。</text>
</svg>