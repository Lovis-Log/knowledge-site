<svg xmlns="http://www.w3.org/2000/svg" width="880" height="360" viewBox="0 0 880 360">
  <defs>
    <marker id="arrow2" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#374151"/>
    </marker>
  </defs>
  <rect width="880" height="360" fill="#ffffff"/>
  <style>
    .ink{fill:#1f2937;font-family:'Microsoft YaHei','Noto Sans SC',sans-serif}
    .muted{fill:#6b7280;font-family:'Microsoft YaHei','Noto Sans SC',sans-serif}
    .ell{fill:#f8fafc;stroke:#374151;stroke-width:1.8}
    .dashed{fill:#f9fafb;stroke:#2563eb;stroke-width:1.4;stroke-dasharray:6 4}
    .arrow{stroke:#374151;stroke-width:1.7;fill:none;marker-end:url(#arrow2)}
  </style>

  <text x="40" y="34" class="ink" font-size="18" font-weight="600">复合映射 f ∘ g：先 g，后 f</text>
  <text x="40" y="58" class="muted" font-size="15">能复合的关键条件：R_g ⊆ U₂ = D_f</text>

  <ellipse cx="110" cy="185" rx="80" ry="76" class="ell"/>
  <text x="110" y="192" class="ink" font-size="17" text-anchor="middle">X</text>
  <text x="110" y="292" class="muted" font-size="14" text-anchor="middle">D_g</text>

  <ellipse cx="390" cy="125" rx="92" ry="75" class="dashed"/>
  <text x="390" y="72" class="ink" font-size="16" text-anchor="middle">U₁</text>
  <ellipse cx="390" cy="245" rx="92" ry="75" class="dashed"/>
  <text x="390" y="302" class="ink" font-size="16" text-anchor="middle">U₂ = D_f</text>

  <rect x="330" y="155" width="120" height="58" rx="8" fill="#fee2e2" stroke="#dc2626" stroke-width="1.8"/>
  <text x="390" y="190" class="ink" font-size="16" text-anchor="middle" fill="#b91c1c">R_g</text>

  <ellipse cx="740" cy="185" rx="82" ry="76" class="ell"/>
  <text x="740" y="192" class="ink" font-size="17" text-anchor="middle">Y</text>
  <text x="740" y="292" class="muted" font-size="14" text-anchor="middle">陪域</text>

  <path d="M188,170 C250,150 290,140 320,140" class="arrow"/>
  <text x="248" y="132" class="ink" font-size="15" text-anchor="middle">g</text>
  <path d="M452,182 L652,182" class="arrow"/>
  <text x="552" y="170" class="ink" font-size="15" text-anchor="middle">f</text>
  <text x="390" y="344" class="muted" font-size="13" text-anchor="middle">中间变量 u = g(x)；f ∘ g 的定义域是 { x ∈ D_g : g(x) ∈ D_f }。</text>
</svg>