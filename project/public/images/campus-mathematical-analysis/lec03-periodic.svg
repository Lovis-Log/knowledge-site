<svg xmlns="http://www.w3.org/2000/svg" width="820" height="230" viewBox="0 0 820 230">
  <defs>
    <marker id="axp" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1f2937"/>
    </marker>
    <marker id="both" markerWidth="8" markerHeight="8" refX="4" refY="4" orient="auto">
      <path d="M4,0 L4,8" stroke="#dc2626" stroke-width="2"/>
    </marker>
  </defs>
  <rect width="820" height="230" fill="#ffffff"/>
  <style>
    .axis{stroke:#1f2937;stroke-width:1.5}
    .ink{fill:#1f2937;font-family:'Microsoft YaHei','Noto Sans SC',sans-serif}
    .muted{fill:#6b7280;font-family:'Microsoft YaHei','Noto Sans SC',sans-serif}
  </style>

  <text x="40" y="30" class="ink" font-size="18" font-weight="600">周期函数：f(x + T) = f(x)</text>

  <line x1="50" y1="140" x2="780" y2="140" class="axis" marker-end="url(#axp)"/>
  <text x="786" y="146" class="ink" font-size="14">x</text>
  <text x="42" y="130" class="ink" font-size="14">O</text>

  <path d="M50,140 C90,60 130,60 170,140 C210,220 250,220 290,140 C330,60 370,60 410,140 C450,220 490,220 530,140 C570,60 610,60 650,140 C690,220 730,220 770,140"
        fill="none" stroke="#2563eb" stroke-width="2.6"/>

  <line x1="50" y1="70" x2="50" y2="175" stroke="#dc2626" stroke-width="1.4" stroke-dasharray="5 4"/>
  <line x1="290" y1="70" x2="290" y2="175" stroke="#dc2626" stroke-width="1.4" stroke-dasharray="5 4"/>
  <line x1="50" y1="82" x2="290" y2="82" stroke="#dc2626" stroke-width="1.4" marker-start="url(#both)" marker-end="url(#both)"/>
  <text x="170" y="72" class="ink" font-size="14" text-anchor="middle" fill="#b91c1c">T</text>
  <text x="290" y="196" class="muted" font-size="13" text-anchor="middle">x + T</text>
  <text x="50" y="196" class="muted" font-size="13" text-anchor="middle">x</text>
</svg>