<svg xmlns="http://www.w3.org/2000/svg" width="620" height="430" viewBox="0 0 620 430">
  <defs>
    <marker id="axisarrow" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1f2937"/>
    </marker>
  </defs>
  <rect width="620" height="430" fill="#ffffff"/>
  <style>
    .axis{stroke:#1f2937;stroke-width:1.6}
    .ink{fill:#1f2937;font-family:'Microsoft YaHei','Noto Sans SC',sans-serif}
    .muted{fill:#6b7280;font-family:'Microsoft YaHei','Noto Sans SC',sans-serif}
  </style>

  <text x="30" y="32" class="ink" font-size="18" font-weight="600">原函数与反函数的图像关于 y = x 对称</text>

  <line x1="80" y1="350" x2="560" y2="350" class="axis" marker-end="url(#axisarrow)"/>
  <line x1="80" y1="390" x2="80" y2="40" class="axis" marker-end="url(#axisarrow)"/>
  <text x="566" y="356" class="ink" font-size="15">x</text>
  <text x="86" y="42" class="ink" font-size="15">y</text>
  <text x="64" y="368" class="ink" font-size="14">O</text>

  <line x1="80" y1="350" x2="350" y2="80" stroke="#f59e0b" stroke-width="1.6" stroke-dasharray="7 5"/>
  <text x="330" y="100" class="ink" font-size="14" fill="#b45309">y = x</text>

  <path d="M80,350 C130,300 160,220 220,110" fill="none" stroke="#2563eb" stroke-width="2.8"/>
  <text x="225" y="102" class="ink" font-size="15" fill="#1d4ed8">y = f(x)</text>

  <path d="M80,350 C130,300 210,270 320,210" fill="none" stroke="#dc2626" stroke-width="2.8"/>
  <text x="326" y="206" class="ink" font-size="15" fill="#b91c1c">y = f⁻¹(x)</text>

  <circle cx="160" cy="220" r="4.5" fill="#2563eb"/>
  <text x="168" y="214" class="muted" font-size="13">(a, b)</text>
  <circle cx="210" cy="270" r="4.5" fill="#dc2626"/>
  <text x="218" y="288" class="muted" font-size="13">(b, a)</text>
  <line x1="160" y1="220" x2="210" y2="270" stroke="#9ca3af" stroke-width="1.2" stroke-dasharray="4 4"/>

  <text x="30" y="414" class="muted" font-size="13">若 (a, b) 在 f 的图像上，则 (b, a) 在 f⁻¹ 的图像上；两点连线垂直于 y = x。</text>
</svg>