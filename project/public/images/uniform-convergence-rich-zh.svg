<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 690" width="1000" height="690" font-family="Segoe UI, Helvetica, Arial, sans-serif" role="img" lang="zh"><title>Pointwise versus uniform convergence</title><rect width="1000" height="690" fill="#fbf9f5"/><defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1b2b45"/></marker><marker id="ara" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7d5a1e"/></marker></defs><text x="36" y="26" font-size="17" fill="#1b2b45" text-anchor="start" font-weight="bold">同一个收敛，两种量词顺序</text><rect x="36" y="44" width="452" height="108" rx="12" fill="#fdfbf7" stroke="#d8d0c1" stroke-width="1"/><text x="52" y="72" font-size="15" fill="#1b2b45" text-anchor="start" font-weight="bold">逐点收敛</text><text x="52" y="100" font-size="12" fill="#1b2b45" text-anchor="start" font-weight="normal" font-family="Consolas, Cascadia Mono, monospace">∀x  ∀ε&gt;0  ∃N(x,ε)  ∀n&gt;N : |fₙ(x)−f(x)| &lt; ε</text><text x="52" y="128" font-size="12.5" fill="#57534c" text-anchor="start" font-weight="normal">N 允许依赖 x：每个点可以有自己的门槛</text><rect x="512" y="44" width="452" height="108" rx="12" fill="#f3ead9" stroke="#7d5a1e" stroke-width="2"/><text x="528" y="72" font-size="15" fill="#7d5a1e" text-anchor="start" font-weight="bold">一致收敛</text><text x="528" y="100" font-size="12" fill="#1b2b45" text-anchor="start" font-weight="normal" font-family="Consolas, Cascadia Mono, monospace">∀ε&gt;0  ∃N(ε)  ∀n&gt;N  ∀x : |fₙ(x)−f(x)| &lt; ε</text><text x="528" y="128" font-size="12.5" fill="#57534c" text-anchor="start" font-weight="normal">N 只依赖 ε：一个门槛管住整条曲线</text><rect x="36" y="176" width="296" height="420" rx="12" fill="#fdfbf7" stroke="#d8d0c1" stroke-width="1"/><text x="52" y="204" font-size="14" fill="#1b2b45" text-anchor="start" font-weight="bold">① 逐点：固定 x 看</text><line x1="76" y1="396" x2="316" y2="396" stroke="#1b2b45" stroke-width="1.5" marker-end="url(#ar)"/><text x="322" y="400" font-size="12" fill="#1b2b45" text-anchor="start" font-weight="normal">x</text><line x1="76" y1="396" x2="76" y2="230" stroke="#1b2b45" stroke-width="1.5" marker-end="url(#ar)"/><text x="72" y="226" font-size="12" fill="#1b2b45" text-anchor="end" font-weight="normal">y</text><text x="76" y="414" font-size="11" fill="#57534c" text-anchor="middle" font-weight="normal">0</text><text x="312" y="414" font-size="11" fill="#57534c" text-anchor="middle" font-weight="normal">1</text><rect x="352" y="176" width="296" height="420" rx="12" fill="#fdfbf7" stroke="#d8d0c1" stroke-width="1"/><text x="368" y="204" font-size="14" fill="#1b2b45" text-anchor="start" font-weight="bold">② 一致：整条曲线进带</text><line x1="392" y1="396" x2="632" y2="396" stroke="#1b2b45" stroke-width="1.5" marker-end="url(#ar)"/><text x="638" y="400" font-size="12" fill="#1b2b45" text-anchor="start" font-weight="normal">x</text><line x1="392" y1="396" x2="392" y2="230" stroke="#1b2b45" stroke-width="1.5" marker-end="url(#ar)"/><text x="388" y="226" font-size="12" fill="#1b2b45" text-anchor="end" font-weight="normal">y</text><text x="392" y="414" font-size="11" fill="#57534c" text-anchor="middle" font-weight="normal">0</text><text x="628" y="414" font-size="11" fill="#57534c" text-anchor="middle" font-weight="normal">1</text><rect x="668" y="176" width="296" height="420" rx="12" fill="#fdfbf7" stroke="#d8d0c1" stroke-width="1"/><text x="684" y="204" font-size="14" fill="#1b2b45" text-anchor="start" font-weight="bold">③ 反例 xⁿ：进不去</text><line x1="708" y1="396" x2="948" y2="396" stroke="#1b2b45" stroke-width="1.5" marker-end="url(#ar)"/><text x="954" y="400" font-size="12" fill="#1b2b45" text-anchor="start" font-weight="normal">x</text><line x1="708" y1="396" x2="708" y2="230" stroke="#1b2b45" stroke-width="1.5" marker-end="url(#ar)"/><text x="704" y="226" font-size="12" fill="#1b2b45" text-anchor="end" font-weight=