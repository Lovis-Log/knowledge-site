<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 790" width="1120" height="790" font-family="Segoe UI, Helvetica, Arial, sans-serif" role="img" lang="zh"><title>C++ memory layout</title><rect width="1120" height="790" fill="#fbf9f5"/><defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1b2b45"/></marker><marker id="ara" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7d5a1e"/></marker></defs><text x="36" y="30" font-size="17" fill="#1b2b45" text-anchor="start" font-weight="bold">同一段代码，落在内存的哪里</text><rect x="36" y="52" width="430" height="330" rx="10" fill="#fdfbf7" stroke="#d8d0c1" stroke-width="1"/><text x="50" y="86" font-size="11" fill="#57534c" text-anchor="end" font-weight="normal" font-family="Consolas, Cascadia Mono, monospace">1</text><text x="60" y="86" font-size="12" fill="#1b2b45" text-anchor="start" font-weight="normal" font-family="Consolas, Cascadia Mono, monospace">int   g_a = 42;        // 已初始化全局</text><text x="50" y="118" font-size="11" fill="#57534c" text-anchor="end" font-weight="normal" font-family="Consolas, Cascadia Mono, monospace">2</text><text x="60" y="118" font-size="12" fill="#1b2b45" text-anchor="start" font-weight="normal" font-family="Consolas, Cascadia Mono, monospace">int   g_b;             // 未初始化全局</text><text x="50" y="150" font-size="11" fill="#57534c" text-anchor="end" font-weight="normal" font-family="Consolas, Cascadia Mono, monospace">3</text><text x="60" y="150" font-size="12" fill="#1b2b45" text-anchor="start" font-weight="normal" font-family="Consolas, Cascadia Mono, monospace">static int g_c = 7;    // 静态存储</text><text x="50" y="182" font-size="11" fill="#57534c" text-anchor="end" font-weight="normal" font-family="Consolas, Cascadia Mono, monospace">4</text><text x="60" y="182" font-size="12" fill="#1b2b45" text-anchor="start" font-weight="normal" font-family="Consolas, Cascadia Mono, monospace"></text><text x="50" y="214" font-size="11" fill="#57534c" text-anchor="end" font-weight="normal" font-family="Consolas, Cascadia Mono, monospace">5</text><text x="60" y="214" font-size="12" fill="#1b2b45" text-anchor="start" font-weight="normal" font-family="Consolas, Cascadia Mono, monospace">int main() {</text><text x="50" y="246" font-size="11" fill="#57534c" text-anchor="end" font-weight="normal" font-family="Consolas, Cascadia Mono, monospace">6</text><text x="60" y="246" font-size="12" fill="#1b2b45" text-anchor="start" font-weight="normal" font-family="Consolas, Cascadia Mono, monospace">  int  local = 1;      // 栈</text><text x="50" y="278" font-size="11" fill="#57534c" text-anchor="end" font-weight="normal" font-family="Consolas, Cascadia Mono, monospace">7</text><text x="60" y="278" font-size="12" fill="#1b2b45" text-anchor="start" font-weight="normal" font-family="Consolas, Cascadia Mono, monospace">  int* p = new int(5); // 堆</text><text x="50" y="310" font-size="11" fill="#57534c" text-anchor="end" font-weight="normal" font-family="Consolas, Cascadia Mono, monospace">8</text><text x="60" y="310" font-size="12" fill="#1b2b45" text-anchor="start" font-weight="normal" font-family="Consolas, Cascadia Mono, monospace">  delete p;</text><text x="50" y="342" font-size="11" fill="#57534c" text-anchor="end" font-weight="normal" font-family="Consolas, Cascadia Mono, monospace">9</text><text x="60" y="342" font-size="12" fill="#1b2b45" text-anchor="start" font-weight="normal" font-family="Consolas, Cascadia Mono, monospace">}</text><rect x="520" y="70" width="250" height="70" fill="#dfe6ef" stroke="#d8d0c1"/><text x="645.0" y="110.0" font-size="13" fill="#1b2b45" text-anchor="middle" font-weight="bold">Text</text><rect x="520" y="140" width="250" height="70" fill="#f3ead9" stroke="#d8d0c1"/><text x="645.0" y="180.0" font-size="13" fill="#1b2b45" text-anchor="middle" font-weight="bold">Data  g_a, g_c</text><rect x="520" y="210" width="250" height="60" fill="#f3ead9" stroke="#d8d0c1"/><text x="645.0" y="245.0" font-size="13" fill="#1b2b45" text-anchor="middle" font-weight="bold">BSS  g_b</text><rect x="520" y="270" width="250" height="110" fill="#e8d7b6" stroke="#d8d0c1"/><text x="645.0" y="330.0" font-size="13" fill="#1b2b45" text-anchor="middle" font-weight="bold">Heap  ← new</text><rect x="520" y="380" width="250" height="44" fill="none" stroke="#d8d0c1" stroke-dasharray="5 5"/><text x="645.0" y="407.0" font-size="12" fill="#57534c" text-anchor="middle" font-weight="normal">空闲</text><rect x="520" y="424" width="250" height="110" fill="#c9d3e0" stroke="#d8d0c1"/><text x="645.0" y="484.0" font-size="13" fill="#1b2b45" text-anchor="middle" font-weight="bold">Stack ↓</text><path d="M466,82 C493.0,82 493.0,175 520,175" fill="none" stroke="#7d5a1e" stroke-width="1.8" marker-end="url(#ara)"/><path d="M466,114 C493.0,114 493.0,240 520,240" fill="none" stroke="#7d5a1e" stroke-width="1.8" marker-end="url(#ara)"/><path d="M466,146 C493.0,146 493.0,175 520,175" fill="none" stroke="#7d5a1e" stroke-width="1.8" marker-end="url(#ara)"/><path d="M466,242 C493.0,242 493.0,470 520,470" fill="none" stroke="#7d5a1e" stroke-width="1.8" marker-end="url(#ara)"/><path d="M466,274 C493.0,274 493.0,325 520,325" fill="none" stroke="#7d5a1e" stroke-width="1.8" marker-end="url(#ara)"/><text x="796" y="100" font-size="12" fill="#57534c" text-anchor="start" font-weight="normal">机器码：只读、可共享</text><text x="796" y="175" font-size="12" fill="#57534c" text-anchor="start" font-weight="normal">已初始化全局 / 静态：启动时写入</text><text x="796" y="240" font-size="12" fill="#57534c" text-anchor="start" font-weight="normal">零初始化：启动时清零</text><text x="796" y="325" font-size="12" fill="#57534c" text-anchor="start" font-weight="normal">堆：new 分配、delete 归还；忘记就泄漏</text><text x="796" y="470" font-size="12" fill="#57534c" text-anchor="start" font-weight="normal">栈：调用时自动分配，返回时回收</text><rect x="520" y="560" width="470" height="150" rx="10" fill="#fdfbf7" stroke="#d8d0c1" stroke-width="1"/><text x="534" y="586" font-size="13" fill="#1b2b45" text-anchor="start" font-weight="bold">main 的栈帧（向下增长）</text><rect x="540.0" y="602" width="101.5" height="62" rx="6" fill="#c9d3e0" stroke="#d8d0c1"/><text x="590.75" y="630" font-size="11" fill="#1b2b45" text-anchor="middle" font-weight="bold">返回地址</text><text x="590.75" y="651" font-size="11" fill="#57534c" text-anchor="middle" font-weight="normal">调用者</text><rect x="647.5" y="602" width="101.5" height="62" rx="6" fill="#c9d3e0" stroke="#d8d0c1"/><text x="698.25" y="630" font-size="11" fill="#1b2b45" text-anchor="middle" font-weight="bold">保存的 rbp</text><text x="698.25" y="651" font-size="11" fill="#57534c" text-anchor="middle" font-weight="normal">调用者</text><rect x="755.0" y="602" width="101.5" height="62" rx="6" fill="#f3ead9" stroke="#d8d0c1"/><text x="805.75" y="630" font-size="11" fill="#1b2b45" text-anchor="middle" font-weight="bold">local = 1</text><text x="805.75" y="651" font-size="11" fill="#57534c" text-anchor="middle" font-weight="normal">本函数</text><rect x="862.5" y="602" width="101.5" height="62" rx="6" fill="#f3ead9" stroke="#d8d0c1"/><text x="913.25" y="630" font-size="11" fill="#1b2b45" text-anchor="middle" font-weight="bold">p = 0x…</text><text x="913.25" y="651" font-size="11" fill="#57534c" text-anchor="middle" font-weight="normal">指向堆</text><text x="540" y="692" font-size="12" fill="#57534c" text-anchor="start" font-weight="normal">p 存的是堆上那个 int 的地址；栈帧回收后 p 就悬空了。</text><rect x="36" y="730" width="1048" height="34" rx="8" fill="#f3ead9" stroke="#d8d0c1" stroke-width="1"/><text x="52" y="752" font-size="12.5" fill="#1b2b45" text-anchor="start" font-weight="normal">存储期决定生命周期：栈随作用域、堆随 delete、全局随程序、Text 只读且共享。</text></svg>