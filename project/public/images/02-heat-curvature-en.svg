age → cools</text><circle cx="957.26" cy="388.41" r="4.5" fill="#1b2b45" stroke="none" stroke-width="1"/><circle cx="957.26" cy="388.41" r="7.5" fill="none" stroke="#1b2b45" stroke-width="1"/><line x1="957.26" y1="465.85" x2="957.26" y2="405.98" stroke="#7d5a1e" stroke-width="1.8"/><path d="M 957.26 399.18 L 960.23 406.61 L 954.29 406.61 Z" fill="#7d5a1e"/><text x="947.26" y="456.87" font-size="13" fill="#7d5a1e" font-weight="bold" text-anchor="end" font-family="'Segoe UI', 'Microsoft YaHei', 'PingFang SC', 'Noto Sans SC', Helvetica, Arial, sans-serif">below the average → warms</text><rect x="40" y="544.02" width="1040" height="124" rx="12" fill="#f3ead9" stroke="none" stroke-width="1"/><text x="60" y="572.02" font-size="14" fill="#1b2b45" font-weight="bold" text-anchor="start" font-family="'Segoe UI', 'Microsoft YaHei', 'PingFang SC', 'Noto Sans SC', Helvetica, Arial, sans-serif">How to read it</text><text x="60" y="598.02" font-size="13" fill="#57534c" font-weight="normal" text-anchor="start" font-family="'Segoe UI', 'Microsoft YaHei', 'PingFang SC', 'Noto Sans SC', Helvetica, Arial, sans-serif">Positive second derivative: the point sits below the average of its two neighbours and warms. Negative: above the average and cools.</text><text x="60" y="624.02" font-size="13" fill="#57534c" font-weight="normal" text-anchor="start" font-family="'Segoe UI', 'Microsoft YaHei', 'PingFang SC', 'Noto Sans SC', Helvetica, Arial, sans-serif">Between the two marks lies an inflection point where the second derivative is zero and nothing changes instantly. Arrows show direction only, not size.</text></svg>
