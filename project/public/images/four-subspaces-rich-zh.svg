<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 680" width="1120" height="680" font-family="Segoe UI, Helvetica, Arial, sans-serif" role="img" lang="zh"><title>Four fundamental subspaces</title><rect width="1120" height="680" fill="#fbf9f5"/><defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1b2b45"/></marker><marker id="ara" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7d5a1e"/></marker></defs><text x="36" y="30" font-size="17" fill="#1b2b45" text-anchor="start" font-weight="bold">四个基本子空间：一个矩阵把两个空间切成四块</text><text x="36" y="56" font-size="13" fill="#57534c" text-anchor="start" font-weight="normal">A 是 m×n 矩阵，秩为 r；行秩与列秩都等于 r。</text><rect x="40" y="96" width="340" height="400" rx="14" fill="none" stroke="#d8d0c1" stroke-width="1"/><text x="210" y="122" font-size="13" fill="#1b2b45" text-anchor="middle" font-weight="normal">ℝⁿ（输入空间）</text><rect x="55" y="140" width="310" height="150" rx="10" fill="#f3ead9" stroke="#d8d0c1" stroke-width="1"/><text x="210" y="205" font-size="15" fill="#1b2b45" text-anchor="middle" font-weight="bold">行空间 C(Aᵀ)</text><text x="210" y="232" font-size="13" fill="#57534c" text-anchor="middle" font-weight="normal">维数 r</text><text x="210" y="262" font-size="12" fill="#57534c" text-anchor="middle" font-weight="normal">基：R 的前 r 行</text><rect x="55" y="330" width="310" height="150" rx="10" fill="#fdfbf7" stroke="#d8d0c1" stroke-width="1"/><text x="210" y="392" font-size="15" fill="#1b2b45" text-anchor="middle" font-weight="bold">零空间 N(A)</text><text x="210" y="419" font-size="13" fill="#57534c" text-anchor="middle" font-weight="normal">维数 n − r</text><text x="210" y="449" font-size="12" fill="#57534c" text-anchor="middle" font-weight="normal">基：n−r 个特殊解</text><text x="210" y="312" font-size="16" fill="#7d5a1e" text-anchor="middle" font-weight="bold">⟂</text><rect x="420" y="96" width="340" height="400" rx="14" fill="none" stroke="#d8d0c1" stroke-width="1"/><text x="590" y="122" font-size="13" fill="#1b2b45" text-anchor="middle" font-weight="normal">ℝᵐ（输出空间）</text><rect x="435" y="140" width="310" height="150" rx="10" fill="#f3ead9" stroke="#d8d0c1" stroke-width="1"/><text x="590" y="205" font-size="15" fill="#1b2b45" text-anchor="middle" font-weight="bold">列空间 C(A)</text><text x="590" y="232" font-size="13" fill="#57534c" text-anchor="middle" font-weight="normal">维数 r</text><text x="590" y="262" font-size="12" fill="#57534c" text-anchor="middle" font-weight="normal">基：A 的主元列</text><rect x="435" y="330" width="310" height="150" rx="10" fill="#fdfbf7" stroke="#d8d0c1" stroke-width="1"/><text x="590" y="392" font-size="15" fill="#1b2b45" text-anchor="middle" font-weight="bold">左零空间 N(Aᵀ)</text><text x="590" y="419" font-size="13" fill="#57534c" text-anchor="middle" font-weight="normal">维数 m − r</text><text x="590" y="449" font-size="12" fill="#57534c" text-anchor="middle" font-weight="normal">基：E 的后 m−r 行</text><text x="590" y="312" font-size="16" fill="#7d5a1e" text-anchor="middle" font-weight="bold">⟂</text><line x1="367" y1="215" x2="432" y2="215" stroke="#7d5a1e" stroke-width="2.5" marker-end="url(#ara)"/><text x="400" y="203" font-size="13" fill="#7d5a1e" text-anchor="middle" font-weight="bold">A</text><line x1="432" y1="250" x2="367" y2="250" stroke="#57534c" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#ar)"/><text x="400" y="268" font-size="12" fill="#57534c" text-anchor="middle" font-weight="normal">Aᵀ</text><line x1="367" y1="405" x2="432" y2="405" stroke="#57534c" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#ar)"/><text x="400" y="393" font-size="13" fill="#57534c" text-anchor="middle" font-weight="normal">0</text><rect x="780" y="96" width="305" height="400" rx="14" fill="#fdfbf7" stroke="#d8d0c1" stroke-width="1"/><text x="796" y="124" font-size="13" fill="#1b2b45" text-anchor="start" font-weight="bold">四个空间一览</text><text x="796" y="150" font-size="12.5" fill="#1b2b45" text-anchor="start" font-weight="bold">列空间 C(A)</text><text x="960" y="150" font-size="12.5" fill="#7d5a1e" text-anchor="middle" font-weight="normal">r</text><text x="996" y="150" font-size="12" fill="#57534c" text-anchor="start" font-weight="normal">主元列</text><line x1="790" y1="164" x2="1072" y2="164" stroke="#d8d0c1" stroke-width="1"/><text x="796" y="212" font-size="12.5" fill="#1b2b45" text-anchor="start" font-weight="bold">行空间 C(Aᵀ)</text><text x="960" y="212" font-size="12.5" fill="#7d5a1e" text-anchor="middle" font-weight="normal">r</text><text x="996" y="212" font-size="12" fill="#57534c" text-anchor="start" font-weight="normal">R 的前 r 行</text><line x1="790" y1="226" x2="1072" y2="226" stroke="#d8d0c1" stroke-width="1"/><text x="796" y="274" font-size="12.5" fill="#1b2b45" text-anchor="start" font-weight="bold">零空间 N(A)</text><text x="960" y="274" font-size="12.5" fill="#7d5a1e" text-anchor="middle" font-weight="normal">n−r</text><text x="996" y="274" font-size="12" fill="#57534c" text-anchor="start" font-weight="normal">特殊解</text><line x1="790" y1="288" x2="1072" y2="288" stroke="#d8d0c1" stroke-width="1"/><text x="796" y="336" font-size="12.5" fill="#1b2b45" text-anchor="start" font-weight="bold">左零空间 N(Aᵀ)</text><text x="960" y="336" font-size="12.5" fill="#7d5a1e" text-anchor="middle" font-weight="normal">m−r</text><text x="996" y="336" font-size="12" fill="#57534c" text-anchor="start" font-weight="normal">最后 m−r 行</text><line x1="790" y1="350" x2="1072" y2="350" stroke="#d8d0c1" stroke-width="1"/><text x="796" y="380" font-size="12" fill="#57534c" text-anchor="start" font-weight="normal">行数 m，列数 n，秩 r</text><text x="796" y="404" font-size="12" fill="#57534c" text-anchor="start" font-weight="normal">r ≤ min(m, n)</text><text x="796" y="428" font-size="12" fill="#57534c" text-anchor="start" font-weight="normal">四个维数之和：</text><text x="796" y="450" font-size="12" fill="#1b2b45" text-anchor="start" font-weight="normal" font-family="Consolas, Cascadia Mono, monospace">r + (n−r) = n</text><text x="796" y="472" font-size="12" fill="#1b2b45" text-anchor="start" font-weight="normal" font-family="Consolas, Cascadia Mono, monospace">r + (m−r) = m</text><rect x="40" y="528" width="1045" height="116" rx="12" fill="#f3ead9" stroke="#d8d0c1" stroke-width="1"/><text x="60" y="558" font-size="14" fill="#1b2b45" text-anchor="start" font-weight="bold">三条要记住的结论</text><text x="60" y="588" font-size="13" fill="#57534c" text-anchor="start" font-weight="normal">① 行秩 = 列秩 = r，这是同一个数</text><text x="60" y="612" font-size="13" fill="#57534c" text-anchor="start" font-weight="normal">② 行空间 ⟂ 零空间：一个管「能到达哪里」，一个管「怎么回到 0」</text><text x="60" y="636" font-size="13" fill="#57534c" text-anchor="start" font-weight="normal">③ 列空间 ⟂ 左零空间：b 有解 ⟺ b 与左零空间正交</text></svg>