<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 700" width="1120" height="700" font-family="Segoe UI, Helvetica, Arial, sans-serif" role="img" lang="en"><title>Max-flow min-cut</title><rect width="1120" height="700" fill="#fbf9f5"/><defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1b2b45"/></marker><marker id="ara" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7d5a1e"/></marker></defs><text x="36" y="30" font-size="17" fill="#1b2b45" text-anchor="start" font-weight="bold">Max-flow = min-cut: one equality, two directions</text><text x="36" y="56" font-size="13" fill="#57534c" text-anchor="start" font-weight="normal">Labels are flow/capacity. Interior nodes conserve flow; maximize inflow at t.</text><rect x="40" y="90" width="660" height="500" rx="12" fill="#fdfbf7" stroke="#d8d0c1" stroke-width="1"/><text x="56" y="118" font-size="13" fill="#1b2b45" text-anchor="start" font-weight="bold">A five-node network with max flow 9</text><line x1="133" y1="321" x2="264" y2="212" stroke="#1b2b45" stroke-width="2" marker-end="url(#ar)"/><text x="182.46355744080526" y="258.2803687993289" font-size="12.5" fill="#7d5a1e" text-anchor="middle" font-weight="bold">4/4</text><line x1="133" y1="359" x2="264" y2="468" stroke="#1b2b45" stroke-width="2" marker-end="url(#ar)"/><text x="182.46355744080526" y="421.7196312006711" font-size="12.5" fill="#7d5a1e" text-anchor="middle" font-weight="bold">3/3</text><line x1="140" y1="340" x2="446" y2="340" stroke="#1b2b45" stroke-width="2" marker-end="url(#ar)"/><text x="293.0" y="328.0" font-size="12.5" fill="#7d5a1e" text-anchor="middle" font-weight="bold">2/2</text><line x1="290" y1="220" x2="290" y2="456" stroke="#1b2b45" stroke-width="2" marker-end="url(#ar)"/><text x="308.0" y="400.0" font-size="12.5" fill="#7d5a1e" text-anchor="middle" font-weight="bold">1/1</text><line x1="318" y1="200" x2="668" y2="328" stroke="#1b2b45" stroke-width="2" marker-end="url(#ar)"/><text x="493.1217542957594" y="252.31283693747292" font-size="12.5" fill="#7d5a1e" text-anchor="middle" font-weight="bold">3/3</text><line x1="318" y1="480" x2="668" y2="352" stroke="#1b2b45" stroke-width="2" marker-end="url(#ar)"/><text x="493.1217542957594" y="427.687163062527" font-size="12.5" fill="#7d5a1e" text-anchor="middle" font-weight="bold">4/4</text><line x1="510" y1="340" x2="666" y2="340" stroke="#1b2b45" stroke-width="2" marker-end="url(#ar)"/><text x="588.0" y="328.0" font-size="12.5" fill="#7d5a1e" text-anchor="middle" font-weight="bold">2/2</text><circle cx="110" cy="340" r="26" fill="#f3ead9" stroke="#1b2b45" stroke-width="2"/><text x="110" y="346" font-size="15" fill="#1b2b45" text-anchor="middle" font-weight="bold">s</text><circle cx="290" cy="190" r="26" fill="#f3ead9" stroke="#1b2b45" stroke-width="2"/><text x="290" y="196" font-size="15" fill="#1b2b45" text-anchor="middle" font-weight="bold">a</text><circle cx="290" cy="490" r="26" fill="#f3ead9" stroke="#1b2b45" stroke-width="2"/><text x="290" y="496" font-size="15" fill="#1b2b45" text-anchor="middle" font-weight="bold">b</text><circle cx="480" cy="340" r="26" fill="#f3ead9" stroke="#1b2b45" stroke-width="2"/><text x="480" y="346" font-size="15" fill="#1b2b45" text-anchor="middle" font-weight="bold">c</text><circle cx="700" cy="340" r="26" fill="#f3ead9" stroke="#1b2b45" stroke-width="2"/><text x="700" y="346" font-size="15" fill="#1b2b45" text-anchor="middle" font-weight="bold">t</text><line x1="610" y1="110" x2="610" y2="570" stroke="#7d5a1e" stroke-width="2.4" stroke-dasharray="8 6"/><text x="596" y="104" font-size="12" fill="#7d5a1e" text-anchor="end" font-weight="bold">cut {s,a,b,c}</text><text x="626" y="250" font-size="12" fill="#7d5a1e" text-anchor="start" font-weight="normal" font-family="Consolas, Cascadia Mono, monospace">3 + 4 + 2</text><text x="626" y="270" font-size="13" fill="#7d5a1e" text-anchor="start" font-weight="bold">= 9</text><text x="70" y="560" font-size="11.5" fill="#57534c" text-anchor="start" font-weight="normal">Flow 9: s→a 4, s→b 3, s→c 2; a→b 1; into t totals 9.</text><rect x="720" y="90" width="380" height="500" rx="12" fill="#fdfbf7" stroke="#d8d0c1" stroke-width="1"/><text x="736" y="118" font-size="13" fill="#1b2b45" text-anchor="start" font-weight="bold">Why the two sides must meet</text><text x="736" y="150" font-size="12.5" fill="#7d5a1e" text-anchor="start" font-weight="bold">① flow ≤ cut (easy)</text><text x="736" y="172" font-size="11.5" fill="#57534c" text-anchor="start" font-weight="normal">Sum net outflow over C:</text><text x="736" y="191" font-size="11.5" fill="#57534c" text-anchor="start" font-weight="normal">interior terms cancel, leaving z;</text><text x="736" y="210" font-size="11.5" fill="#57534c" text-anchor="start" font-weight="normal">each crossing edge ≤ its capacity.</text><text x="736" y="247" font-size="12.5" fill="#7d5a1e" text-anchor="start" font-weight="bold">② cut ≤ flow (via dual)</text><text x="736" y="269" font-size="11.5" fill="#57534c" text-anchor="start" font-weight="normal">Write max flow as an LP;</text><text x="736" y="288" font-size="11.5" fill="#57534c" text-anchor="start" font-weight="normal">the dual β reduces to 0/1,</text><text x="736" y="307" font-size="11.5" fill="#57534c" text-anchor="start" font-weight="normal">and its objective is a cut's capacity.</text><text x="736" y="344" font-size="12.5" fill="#7d5a1e" text-anchor="start" font-weight="bold">③ sandwich</text><text x="736" y="366" font-size="11.5" fill="#57534c" text-anchor="start" font-weight="normal">min cut ≤ max flow ≤ min cut,</text><text x="736" y="385" font-size="11.5" fill="#57534c" text-anchor="start" font-weight="normal">so they are equal. With integer</text><text x="736" y="404" font-size="11.5" fill="#57534c" text-anchor="start" font-weight="normal">capacities an integral flow exists.</text><rect x="40" y="610" width="1060" height="70" rx="12" fill="#f3ead9" stroke="#d8d0c1" stroke-width="1"/><text x="60" y="640" font-size="13" fill="#1b2b45" text-anchor="start" font-weight="bold">To prove optimality you need only two objects:</text><text x="60" y="664" font-size="13" fill="#57534c" text-anchor="start" font-weight="normal">a feasible flow of value 9 and a cut of capacity 9 — squeezed, done.</text></svg>