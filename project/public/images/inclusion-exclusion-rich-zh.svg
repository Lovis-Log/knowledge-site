<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 680" width="1120" height="680" font-family="Segoe UI, Helvetica, Arial, sans-serif" role="img" lang="zh"><title>Inclusion–exclusion</title><rect width="1120" height="680" fill="#fbf9f5"/><defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1b2b45"/></marker><marker id="ara" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7d5a1e"/></marker></defs><text x="36" y="30" font-size="17" fill="#1b2b45" text-anchor="start" font-weight="bold">容斥：先加过头，再一条条修正</text><text x="36" y="56" font-size="13" fill="#57534c" text-anchor="start" font-weight="normal">例子：3 个人的作业随机发回，求至少一人拿对的概率。6 种排列中恰有 2 种全错。</text><rect x="40" y="96" width="390" height="380" rx="12" fill="#fdfbf7" stroke="#d8d0c1" stroke-width="1"/><text x="56" y="124" font-size="13" fill="#1b2b45" text-anchor="start" font-weight="bold">① 把 6 种排列画成三个集合</text><rect x="60" y="146" width="350" height="270" rx="10" fill="none" stroke="#d8d0c1" stroke-dasharray="6 5"/><text x="74" y="168" font-size="11" fill="#57534c" text-anchor="start" font-weight="normal">全部 6 种</text><circle cx="190" cy="250" r="88" fill="#c9b48a" fill-opacity="0.18" stroke="#c9b48a" stroke-width="1.6"/><circle cx="300" cy="250" r="88" fill="#a8845a" fill-opacity="0.18" stroke="#a8845a" stroke-width="1.6"/><circle cx="245" cy="335" r="88" fill="#7d5a1e" fill-opacity="0.18" stroke="#7d5a1e" stroke-width="1.6"/><text x="140" y="205" font-size="14" fill="#1b2b45" text-anchor="middle" font-weight="bold">A₁</text><text x="352" y="205" font-size="14" fill="#1b2b45" text-anchor="middle" font-weight="bold">A₂</text><text x="245" y="405" font-size="14" fill="#1b2b45" text-anchor="middle" font-weight="bold">A₃</text><text x="150" y="268" font-size="13" fill="#1b2b45" text-anchor="middle" font-weight="normal">1</text><text x="342" y="268" font-size="13" fill="#1b2b45" text-anchor="middle" font-weight="normal">1</text><text x="245" y="372" font-size="13" fill="#1b2b45" text-anchor="middle" font-weight="normal">1</text><text x="245" y="296" font-size="13" fill="#7d5a1e" text-anchor="middle" font-weight="bold">1</text><text x="245" y="245" font-size="11" fill="#57534c" text-anchor="middle" font-weight="normal">0</text><text x="186" y="330" font-size="11" fill="#57534c" text-anchor="middle" font-weight="normal">0</text><text x="304" y="330" font-size="11" fill="#57534c" text-anchor="middle" font-weight="normal">0</text><text x="378" y="160" font-size="13" fill="#57534c" text-anchor="middle" font-weight="normal">2</text><text x="56" y="440" font-size="11.5" fill="#57534c" text-anchor="start" font-weight="normal">中心 = 三人都拿对；三个单块各 1；两两交的剩余部分为 0。</text><rect x="450" y="96" width="330" height="380" rx="12" fill="#fdfbf7" stroke="#d8d0c1" stroke-width="1"/><text x="466" y="124" font-size="13" fill="#1b2b45" text-anchor="start" font-weight="bold">② 逐层加减</text><text x="466" y="160" font-size="12" fill="#57534c" text-anchor="start" font-weight="normal">加上三个单事件</text><text x="466" y="182" font-size="13" fill="#1b2b45" text-anchor="start" font-weight="normal" font-family="Consolas, Cascadia Mono, monospace">+ 3 × 2 = 6</text><text x="466" y="222" font-size="12" fill="#57534c" text-anchor="start" font-weight="normal">减去三个两两交</text><text x="466" y="244" font-size="13" fill="#1b2b45" text-anchor="start" font-weight="normal" font-family="Consolas, Cascadia Mono, monospace">− 3 × 1 = 3</text><text x="466" y="284" font-size="12" fill="#57534c" text-anchor="start" font-weight="normal">加回一个三重交</text><text x="466" y="306" font-size="13" fill="#1b2b45" text-anchor="start" font-weight="normal" font-family="Consolas, Cascadia Mono, monospace">+ 1 × 1 = 1</text><line x1="466" y1="340" x2="764" y2="340" stroke="#d8d0c1" stroke-width="1"/><text x="466" y="368" font-size="12" fill="#57534c" text-anchor="start" font-weight="normal">至少一人拿对</text><text x="466" y="392" font-size="13" fill="#7d5a1e" text-anchor="start" font-weight="normal" font-family="Consolas, Cascadia Mono, monospace">4 / 6 = 2/3</text><text x="466" y="424" font-size="12" fill="#57534c" text-anchor="start" font-weight="normal">没人拿对</text><text x="466" y="448" font-size="13" fill="#7d5a1e" text-anchor="start" font-weight="normal" font-family="Consolas, Cascadia Mono, monospace">1 − 2/3 = 1/3 = 2/6</text><text x="466" y="470" font-size="11.5" fill="#57534c" text-anchor="start" font-weight="normal">= 错排数 D₃ / 3!</text><rect x="800" y="96" width="300" height="380" rx="12" fill="#fdfbf7" stroke="#d8d0c1" stroke-width="1"/><text x="816" y="124" font-size="13" fill="#1b2b45" text-anchor="start" font-weight="bold">③ 一般形式</text><text x="816" y="158" font-size="12.5" fill="#1b2b45" text-anchor="start" font-weight="normal" font-family="Consolas, Cascadia Mono, monospace">|A₁∪…∪Aₙ| =</text><text x="816" y="182" font-size="12.5" fill="#1b2b45" text-anchor="start" font-weight="normal" font-family="Consolas, Cascadia Mono, monospace">Σ|Aᵢ| − Σ|Aᵢ∩Aⱼ|</text><text x="816" y="206" font-size="12.5" fill="#1b2b45" text-anchor="start" font-weight="normal" font-family="Consolas, Cascadia Mono, monospace">+ Σ|Aᵢ∩Aⱼ∩Aₖ| − …</text><line x1="816" y1="226" x2="1084" y2="226" stroke="#d8d0c1" stroke-width="1"/><text x="816" y="252" font-size="12" fill="#57534c" text-anchor="start" font-weight="normal">第 k 层有 C(n,k) 项，</text><text x="816" y="274" font-size="12" fill="#57534c" text-anchor="start" font-weight="normal">符号正负交替：+ − + −</text><text x="816" y="304" font-size="12" fill="#1b2b45" text-anchor="start" font-weight="bold">为什么修正一次就够？</text><text x="816" y="330" font-size="11.5" fill="#57534c" text-anchor="start" font-weight="normal">任取一个恰好属于 k 个集合的元素：</text><text x="816" y="352" font-size="11.5" fill="#57534c" text-anchor="start" font-weight="normal">它被数了 C(k,1) − C(k,2) + …</text><text x="816" y="374" font-size="11.5" fill="#57534c" text-anchor="start" font-weight="normal">= 1 次（当 k ≥ 1）。</text><text x="816" y="404" font-size="11.5" fill="#7d5a1e" text-anchor="start" font-weight="normal">k = 0 的元素一次都没被数。</text><text x="816" y="440" font-size="11.5" fill="#57534c" text-anchor="start" font-weight="normal">所以结果是「至少属于一个」的个数。</text><rect x="40" y="500" width="1060" height="150" rx="12" fill="#f3ead9" stroke="#d8d0c1" stroke-width="1"/><text x="60" y="530" font-size="14" fill="#1b2b45" text-anchor="start" font-weight="bold">和独立性的区别</text><text x="60" y="560" font-size="13" fill="#57534c" text-anchor="start" font-weight="normal">若 A₁、A₂ 独立，应有 P(A₁∩A₂) = 1/3 × 1/3 = 1/9；实际是 1/6。</text><text x="60" y="586" font-size="13" fill="#57534c" text-anchor="start" font-weight="normal">原因：第一个人拿对后，剩下的作业只剩一种分法，第二个人必然也对。</text><text x="60" y="612" font-size="13" fill="#7d5a1e" text-anchor="start" font-weight="normal">容斥不需要独立性——这正是它在错排、筛法、计数中通用的原因。</text><text x="60" y="636" font-size="12" fill="#57534c" text-anchor="start" font-weight="normal">记忆：单 − 双 + 三 − 四 …，每层按交集大小加权。</text></svg>