<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 766" width="1120" height="766" role="img" lang="zh"><rect width="1120" height="766" fill="#fbf9f5"/><text x="40" y="50" font-size="21" fill="#1b2b45" font-weight="bold" text-anchor="start" font-family="'Segoe UI', 'Microsoft YaHei', 'PingFang SC', 'Noto Sans SC', Helvetica, Arial, sans-serif">固定成本落在哪一段，就决定几家进入</text><text x="40" y="80" font-size="13" fill="#57534c" font-weight="normal" text-anchor="start" font-family="'Segoe UI', 'Microsoft YaHei', 'PingFang SC', 'Noto Sans SC', Helvetica, Arial, sans-serif">古诺利润 π_k 随进入企业数递减；纵轴以 (1−c)² 为单位</text><line x1="160.32" y1="180" x2="160.32" y2="540" stroke="#e7e1d6" stroke-width="0.8"/><line x1="244.19" y1="180" x2="244.19" y2="540" stroke="#e7e1d6" stroke-width="0.8"/><line x1="328.06" y1="180" x2="328.06" y2="540" stroke="#e7e1d6" stroke-width="0.8"/><line x1="411.94" y1="180" x2="411.94" y2="540" stroke="#e7e1d6" stroke-width="0.8"/><line x1="495.81" y1="180" x2="495.81" y2="540" stroke="#e7e1d6" stroke-width="0.8"/><line x1="579.68" y1="180" x2="579.68" y2="540" stroke="#e7e1d6" stroke-width="0.8"/><line x1="110" y1="475.71" x2="630" y2="475.71" stroke="#e7e1d6" stroke-width="0.8"/><line x1="110" y1="411.43" x2="630" y2="411.43" stroke="#e7e1d6" stroke-width="0.8"/><line x1="110" y1="347.14" x2="630" y2="347.14" stroke="#e7e1d6" stroke-width="0.8"/><line x1="110" y1="282.86" x2="630" y2="282.86" stroke="#e7e1d6" stroke-width="0.8"/><line x1="110" y1="218.57" x2="630" y2="218.57" stroke="#e7e1d6" stroke-width="0.8"/><line x1="110" y1="540" x2="630" y2="540" stroke="#d8d0c1" stroke-width="1.2"/><line x1="110" y1="180" x2="110" y2="540" stroke="#d8d0c1" stroke-width="1.2"/><line x1="160.32" y1="537" x2="160.32" y2="543" stroke="#d8d0c1" stroke-width="1"/><text x="160.32" y="556" font-size="11" fill="#746e64" font-weight="normal" text-anchor="middle" font-family="'Segoe UI', 'Microsoft YaHei', 'PingFang SC', 'Noto Sans SC', Helvetica, Arial, sans-serif">1</text><li