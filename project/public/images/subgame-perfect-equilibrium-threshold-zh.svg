s SC', Helvetica, Arial, sans-serif">0.1</text><line x1="107" y1="347.14" x2="113" y2="347.14" stroke="#d8d0c1" stroke-width="1"/><text x="102" y="351.14" font-size="11" fill="#746e64" font-weight="normal" text-anchor="end" font-family="'Segoe UI', 'Microsoft YaHei', 'PingFang SC', 'Noto Sans SC', Helvetica, Arial, sans-serif">0.15</text><line x1="107" y1="282.86" x2="113" y2="282.86" stroke="#d8d0c1" stroke-width="1"/><text x="102" y="286.86" font-size="11" fill="#746e64" font-weight="normal" text-anchor="end" font-family="'Segoe UI', 'Microsoft YaHei', 'PingFang SC', 'Noto Sans SC', Helvetica, Arial, sans-serif">0.2</text><line x1="107" y1="218.57" x2="113" y2="218.57" stroke="#d8d0c1" stroke-width="1"/><text x="102" y="222.57" font-size="11" fill="#746e64" font-weight="normal" text-anchor="end" font-family="'Segoe UI', 'Microsoft YaHei', 'PingFang SC', 'Noto Sans SC', Helvetica, Arial, sans-serif">0.25</text><text x="630" y="574" font-size="11.5" fill="#746e64" font-weight="normal" text-anchor="end" font-family="'Segoe UI', 'Microsoft YaHei', 'PingFang SC', 'Noto Sans SC', Helvetica, Arial, sans-serif">进入企业数 k</text><text x="100" y="172" font-size="11.5" fill="#746e64" font-weight="normal" text-anchor="end" font-family="'Segoe UI', 'Microsoft YaHei', 'PingFang SC', 'Noto Sans SC', Helvetica, Arial, sans-serif">π_k / (1−c)²</text><rect x="110" y="397.14" width="520" height="62.5" rx="0" fill="#f3ead9" stroke="none" stroke-width="1" opacity="0.9"/><line x1="110" y1="450" x2="630" y2="450" stroke="#9c4a2f" stroke-width="1.5" stroke-dasharray="7 5"/><text x="128" y="443" font-size="12" fill="#9c4a2f" font-weight="bold" text-anchor="start" font-family="'Segoe UI', 'Microsoft YaHei', 'PingFang SC', 'Noto Sans SC', Helvetica, Arial, sans-serif">F = 0.07</text><text x="416.13" y="424.29" font-size="12" fill="#9c4a2f" font-weight="normal" text-anchor="start" font-family="'Segoe UI', 'Microsoft YaHei', 'PingFang SC', 'Noto Sans SC', Helvetica, Arial, sans-serif">F 在这一带 → 2 家进入</text><line x1="160.32" y1="540" x2="160.32" y2="218.57" stroke="#d8d0c1" stroke-width="1"/><circle cx="160.32" cy="218.57" r="3.4" fill="#7d5a1e" stroke="none" stroke-width="1"/><circle cx="160.32" cy="218.57" r="6.4" fill="none" stroke="#7d5a1e" stroke-width="1"/><text x="160.32" y="208.57" font-size="12" fill="#1b2b45" font-weight="bold" text-anchor="middle" font-family="'Segoe UI', 'Microsoft YaHei', 'PingFang SC', 'Noto Sans SC', Helvetica, Arial, sans-serif">1/4</text><line x1="244.19" y1="540" x2="244.19" y2="397.14" stroke="#d8d0c1" stroke-width="1"/><circle cx="244.19" cy="397.14" r="3.4" fill="#7d5a1e" stroke="none" stroke-width="1"/><circle cx="244.19" cy="397.14" r="6.4" fill="none" stroke="#7d5a1e" stroke-width="1"/><text x="244.19" y="387.14" font-size="12" fill="#1b2b45" font-weight="bold" text-anchor="middle" font-family="'Segoe UI', 'Microsoft YaHei', 'PingFang SC', 'Noto Sans SC', Helvetica, Arial, sans-serif">1/9</text><line x1="328.06" y1="540" x2="328.06" y2="459.64" stroke="#d8d0c1" stroke-width="1"/><circle cx="328.06" cy="459.64" r="3.4" fill="#57534c" stroke="none" stroke-width="1"/><circle cx="328.06" cy="459.64" r="6.4" fill="none" stroke="#57534c" stroke-width="1"/><text x="328.06" y="449.64" font-size="12" fill="#1b2b45" font-weight="bold" text-anchor="middle" font-family="'Segoe UI', 'Microsoft YaHei', 'PingFang SC', 'Noto Sans SC', Helvetica, Arial, sans-serif">1/16</text><line x1="411.94" y1="540" x2="411.94" y2="488.57" stroke="#d8d0c1" stroke-width="1"/><circle cx="411.94" cy="488.57" r="3.4" fill="#57534c" stroke="none" stroke-width="1"/><circle cx="411.94" cy="488.57" r="6.4" fill="none" stroke="#57534c" stroke-width="1"/><text x="411.94" y="478.57" font-size="12" fill="#1b2b45" font-weight="bold" text-anchor="middle" font-family="'Segoe UI', 'Microsoft YaHei', 'PingFang SC', 'Noto Sans SC', Helvetica, Arial, sans-serif">1/25</text><line x1="495.81" y1="540" x2="495.81" y2="504.29" stroke="#d8d0c1" stroke-width="1"/><circle cx="495.81" cy="504.29" r="3.4" fill="#57534c" stroke="none" stroke-width="1"/><circle cx="495.81" cy="504.29" r="6.4" fill="none" stroke="#57534c" stroke-width="1"/><text x="495.81" y="494.29" font-size="12" fill="#1b2b45" font-weight="bold" text-anchor="middle" font-family="'Segoe UI', 'Microsoft YaHei', 'PingFang SC', 'Noto Sans SC', Helvetica, Arial, sans-serif">1/36</text><line x1="579.68" y1="540" x2="579.68" y2="513.76" stroke="#d8d0c1" stroke-width="1"/><circle cx="579.68" cy="513.76" r="3.4" fill="#57534c" stroke="none" stroke-width="1"/><circle cx="579.68" cy="513.76" r="6.4" fill="none" stroke="#57534c" stroke-width="1"/><rect x="676" y="180" width="404" height="360" rx="14" fill="#fffdf9" stroke="#d8d0c1" stroke-width="1"/><text x="694" y="213" font-size="14" fill="#1b2b45" font-weight="bold" text-anchor="start" font-family="'Segoe UI', 'Microsoft YaHei', 'PingFang SC', 'Noto Sans SC', Helvetica, Arial, sans-serif">门槛条件</text><text x="694" y="240" font-size="12.5" fill="#1b2b45" font-weight="normal" text-anchor="start" font-family="'Segoe UI', 'Microsoft YaHei', 'PingFang SC', 'Noto Sans SC', Helvetica, Arial, sans-serif">每家企业利润   π_k = (1−c)² / (k+1)²</text><text x="694" y="278" font-size="12.5" fill="#57534c" font-weight="normal" text-anchor="start" font-family="'Segoe UI', 'Microsoft YaHei', 'PingFang SC', 'Noto Sans SC', Helvetica, Arial, sans-serif">进入者不后悔：   π_k − F ≥ 0</text><text x="694" y="310" font-size="12.5" fill="#57534c" font-weight="normal" text-anchor="start" font-family="'Segoe UI', 'Microsoft YaHei', 'PingFang SC', 'Noto Sans SC', Helvetica, Arial, sans-serif">未进入者不眼红：   π_(k+1) − F ≤ 0</text><rect x="692" y="335" width="372" height="36" rx="8" fill="#f3ead9" stroke="none" stroke-width="1"/><text x="702" y="359" font-size="12.5" fill="#7d5a1e" font-weight="bold" text-anchor="start" font-family="'Segoe UI', 'Microsoft YaHei', 'PingFang SC', 'Noto Sans SC', Helvetica, Arial, sans-serif">合起来：  π_(k+1) ≤ F ≤ π_k</text><line x1="692" y1="384" x2="1064" y2="384" stroke="#d8d0c1" stroke-width="1"/><text x="694" y="408" font-size="12" fill="#57534c" font-weight="normal" text-anchor="start" font-family="'Segoe UI', 'Microsoft YaHei', 'PingFang SC', 'Noto Sans SC', Helvetica, Arial, sans-serif">F &gt; π₁：无人进入</text><text x="694" y="440" font-size="12" fill="#57534c" font-weight="normal" text-anchor="start" font-family="'Segoe UI', 'Microsoft YaHei', 'PingFang SC', 'Noto Sans SC', Helvetica, Arial, sans-serif">F &lt; π_n：n 家全进</text><text x="694" y="486" font-size="11.5" fill="#57534c" font-weight="normal" text-anchor="start" font-family="'Segoe UI', 'Microsoft YaHei', 'PingFang SC', 'Noto Sans SC', Helvetica, Arial, sans-serif" font-style="italic">π_k 递减 ⇒ 每个 F 至多对应一个 k</text><rect x="40" y="602.02" width="1040" height="124" rx="12" fill="#f3ead9" stroke="none" stroke-width="1"/><text x="60" y="630.02" font-size="14" fill="#1b2b45" font-weight="bold" text-anchor="start" font-family="'Segoe UI', 'Microsoft YaHei', 'PingFang SC', 'Noto Sans SC', Helvetica, Arial, sans-serif">要点</text><text x="60" y="656.02" font-size="13" fill="#57534c" font-weight="normal" text-anchor="start" font-family="'Segoe UI', 'Microsoft YaHei', 'PingFang SC', 'Noto Sans SC', Helvetica, Arial, sans-serif">读图：把 F 画成水平线，落在 π_k 与 π_(k+1) 之间就有 k 家进入。</text><text x="60" y="682.02" font-size="13" fill="#57534c" font-weight="normal" text-anchor="start" font-family="'Segoe UI', 'Microsoft YaHei', 'PingFang SC', 'Noto Sans SC', Helvetica, Arial, sans-serif">固定成本高（移动网络、公用事业）→ 企业少；固定成本低 → 企业多。</text></svg>
