<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 700" width="1120" height="700" font-family="Segoe UI, Helvetica, Arial, sans-serif" role="img" lang="zh"><title>Virtual table dispatch</title><rect width="1120" height="700" fill="#fbf9f5"/><defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1b2b45"/></marker><marker id="ara" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7d5a1e"/></marker></defs><text x="36" y="30" font-size="17" fill="#1b2b45" text-anchor="start" font-weight="bold">虚函数：一次调用，四步查表</text><text x="36" y="56" font-size="13" fill="#57534c" text-anchor="start" font-weight="normal">Shape* p = new Circle(); p-&gt;draw(); 输出 Circle draw —— 因为 p 的静态类型不决定调用谁。</text><rect x="40" y="96" width="320" height="420" rx="12" fill="#fdfbf7" stroke="#d8d0c1" stroke-width="1"/><text x="56" y="124" font-size="13" fill="#1b2b45" text-anchor="start" font-weight="bold">① 类层次</text><rect x="60" y="140" width="220" height="64" rx="10" fill="#f3ead9" stroke="#d8d0c1" stroke-width="1"/><text x="170" y="168" font-size="14" fill="#1b2b45" text-anchor="middle" font-weight="bold">Shape</text><text x="170" y="190" font-size="11" fill="#57534c" text-anchor="middle" font-weight="normal" font-family="Consolas, Cascadia Mono, monospace">virtual void draw()</text><rect x="60" y="250" width="220" height="64" rx="10" fill="#f3ead9" stroke="#d8d0c1" stroke-width="1"/><text x="170" y="278" font-size="14" fill="#1b2b45" text-anchor="middle" font-weight="bold">Oval : Shape</text><text x="170" y="300" font-size="11" fill="#57534c" text-anchor="middle" font-weight="normal" font-family="Consolas, Cascadia Mono, monospace">draw() override · get_x_rad()</text><rect x="60" y="360" width="220" height="64" rx="10" fill="#f3ead9" stroke="#d8d0c1" stroke-width="1"/><text x="170" y="388" font-size="14" fill="#1b2b45" text-anchor="middle" font-weight="bold">Circle : Oval</text><text x="170" y="410" font-size="11" fill="#57534c" text-anchor="middle" font-weight="normal" font-family="Consolas, Cascadia Mono, monospace">draw() override</text><line x1="170" y1="204" x2="170" y2="246" stroke="#1b2b45" stroke-width="1.8" marker-end="url(#ar)"/><text x="182" y="230" font-size="11" fill="#57534c" text-anchor="start" font-weight="normal">继承</text><line x1="170" y1="314" x2="170" y2="356" stroke="#1b2b45" stroke-width="1.8" marker-end="url(#ar)"/><text x="182" y="340" font-size="11" fill="#57534c" text-anchor="start" font-weight="normal">继承</text><text x="56" y="470" font-size="12" fill="#57534c" text-anchor="start" font-weight="normal">只有 Shape 里声明为 virtual 的函数，</text><text x="56" y="492" font-size="12" fill="#57534c" text-anchor="start" font-weight="normal">才能通过 Shape* 多态调用。</text><rect x="380" y="96" width="350" height="420" rx="12" fill="#fdfbf7" stroke="#d8d0c1" stroke-width="1"/><text x="396" y="124" font-size="12.5" fill="#1b2b45" text-anchor="start" font-weight="bold">② 对象里存了指向表的指针</text><text x="396" y="152" font-size="12" fill="#57534c" text-anchor="start" font-weight="bold">Circle 对象</text><rect x="396" y="164" width="240" height="86" rx="8" fill="#fbf9f5" stroke="#1b2b45" stroke-width="1"/><rect x="396" y="164" width="70" height="86" fill="#e9e2d2" stroke="#d8d0c1"/><text x="431.0" y="212" font-size="12" fill="#1b2b45" text-anchor="middle" font-weight="normal" font-family="Consolas, Cascadia Mono, monospace">vptr</text><rect x="466" y="164" width="85" height="86" fill="#f3ead9" stroke="#d8d0c1"/><text x="508.5" y="212" font-size="12" fill="#1b2b45" text-anchor="middle" font-weight="normal" font-family="Consolas, Cascadia Mono, monospace">x_rad</text><rect x="551" y="164" width="85" height="86" fill="#f3ead9" stroke="#d8d0c1"/><text x="593.5" y="212" font-size="12" fill="#1b2b45" text-anchor="middle" font-weight="normal" font-family="Consolas, Cascadia Mono, monospace">y_rad</text><text x="396" y="274" font-size="11.5" fill="#57534c" text-anchor="start" font-weight="normal">vptr 指向 Circle 的虚函数表</text><rect x="396" y="300" width="240" height="90" rx="8" fill="#fbf9f5" stroke="#d8d0c1" stroke-width="1"/><text x="516" y="326" font-size="12" fill="#7d5a1e" text-anchor="middle" font-weight="bold">Circle 的 vtable</text><line x1="400" y1="336" x2="632" y2="336" stroke="#d8d0c1" stroke-width="1"/><text x="412" y="366" font-size="12" fill="#1b2b45" text-anchor="start" font-weight="normal" font-family="Consolas, Cascadia Mono, monospace">[0]  &amp;Circle::draw</text><line x1="466" y1="250" x2="466" y2="296" stroke="#7d5a1e" stroke-width="2" marker-end="url(#ara)"/><text x="396" y="424" font-size="11" fill="#57534c" text-anchor="start" font-weight="normal">槽位顺序由基类 Shape 的声明决定；</text><text x="396" y="444" font-size="11" fill="#57534c" text-anchor="start" font-weight="normal">派生类只是把槽里的地址换成自己的。</text><text x="396" y="476" font-size="11.5" fill="#7d5a1e" text-anchor="start" font-weight="normal">代价：每个对象多一个指针。</text><rect x="750" y="96" width="330" height="420" rx="12" fill="#fdfbf7" stroke="#d8d0c1" stroke-width="1"/><text x="766" y="124" font-size="13" fill="#1b2b45" text-anchor="start" font-weight="bold">③ 一次调用的四步</text><circle cx="778" cy="153" r="11" fill="#7d5a1e"/><text x="778" y="157" font-size="11" fill="#fbf9f5" text-anchor="middle" font-weight="bold">1</text><text x="798" y="158" font-size="11" fill="#57534c" text-anchor="start" font-weight="bold">编译期</text><text x="798" y="178" font-size="11.5" fill="#1b2b45" text-anchor="start" font-weight="normal">p-&gt;draw() 被编成</text><text x="798" y="196" font-size="11.5" fill="#1b2b45" text-anchor="start" font-weight="normal">「取 vptr 的第 0 槽」</text><circle cx="778" cy="227" r="11" fill="#7d5a1e"/><text x="778" y="231" font-size="11" fill="#fbf9f5" text-anchor="middle" font-weight="bold">2</text><text x="798" y="232" font-size="11" fill="#57534c" text-anchor="start" font-weight="bold">运行期 1</text><text x="798" y="252" font-size="11.5" fill="#1b2b45" text-anchor="start" font-weight="normal">读出 p 指向对象里的 vptr</text><circle cx="778" cy="283" r="11" fill="#7d5a1e"/><text x="778" y="287" font-size="11" fill="#fbf9f5" text-anchor="middle" font-weight="bold">3</text><text x="798" y="288" font-size="11" fill="#57534c" text-anchor="start" font-weight="bold">运行期 2</text><text x="798" y="308" font-size="11.5" fill="#1b2b45" text-anchor="start" font-weight="normal">按槽号查到 &amp;Circle::draw</text><circle cx="778" cy="339" r="11" fill="#7d5a1e"/><text x="778" y="343" font-size="11" fill="#fbf9f5" text-anchor="middle" font-weight="bold">4</text><text x="798" y="344" font-size="11" fill="#57534c" text-anchor="start" font-weight="bold">调用</text><text x="798" y="364" font-size="11.5" fill="#1b2b45" text-anchor="start" font-weight="normal">跳转执行，打印 Circle draw</text><line x1="766" y1="400" x2="1064" y2="400" stroke="#d8d0c1" stroke-width="1"/><text x="766" y="428" font-size="11" fill="#57534c" text-anchor="start" font-weight="normal">非虚函数不查表：编译器直接绑到</text><text x="766" y="448" font-size="11" fill="#57534c" text-anchor="start" font-weight="normal">静态类型上的那个版本。</text><text x="766" y="476" font-size="11" fill="#7d5a1e" text-anchor="start" font-weight="normal">这就是同为成员函数、行为却不同的原因。</text><rect x="40" y="540" width="1040" height="130" rx="12" fill="#f3ead9" stroke="#d8d0c1" stroke-width="1"/><text x="60" y="570" font-size="13" fill="#1b2b45" text-anchor="start" font-weight="bold">三个常见坑</text><text x="60" y="600" font-size="12.5" fill="#57534c" text-anchor="start" font-weight="normal">① 忘了 virtual：p-&gt;draw() 调 Shape 版本，输出 Shape draw。</text><text x="60" y="626" font-size="12.5" fill="#57534c" text-anchor="start" font-weight="normal">② 对象切片：按值传 Shape s = circle; 只复制 Shape 部分，派生数据丢失。</text><text x="60" y="652" font-size="12.5" fill="#57534c" text-anchor="start" font-weight="normal">③ 构造/析构中调虚函数：对象还没建成或已拆掉，调不到派生版本。</text></svg>