ize="11.5" fill="#9c4a2f" font-weight="bold" text-anchor="middle" font-family="'Segoe UI', 'Microsoft YaHei', 'PingFang SC', 'Noto Sans SC', Helvetica, Arial, sans-serif">链接阶段</text><text x="856" y="513" font-size="11.5" fill="#57534c" font-weight="normal" text-anchor="start" font-family="'Segoe UI', 'Microsoft YaHei', 'PingFang SC', 'Noto Sans SC', Helvetica, Arial, sans-serif">多个翻译单元各定义了一次</text><rect x="40" y="648" width="1040" height="150" rx="12" fill="#f3ead9" stroke="none" stroke-width="1"/><text x="60" y="676" font-size="14" fill="#1b2b45" font-weight="bold" text-anchor="start" font-family="'Segoe UI', 'Microsoft YaHei', 'PingFang SC', 'Noto Sans SC', Helvetica, Arial, sans-serif">声明与定义的分工</text><text x="60" y="702" font-size="13" fill="#57534c" font-weight="normal" text-anchor="start" font-family="'Segoe UI', 'Microsoft YaHei', 'PingFang SC', 'Noto Sans SC', Helvetica, Arial, sans-serif">头文件放声明，实现文件放定义；#pragma once 防止重复包含。</text><text x="60" y="728" font-size="13" fill="#57534c" font-weight="normal" text-anchor="start" font-family="'Segoe UI', 'Microsoft YaHei', 'PingFang SC', 'Noto Sans SC', Helvetica, Arial, sans-serif">编译错误属于单个翻译单元；链接错误属于跨文件符号解析。</text><text x="60" y="754" font-size="13" fill="#57534c" font-weight="normal" text-anchor="start" font-family="'Segoe UI', 'Microsoft YaHei', 'PingFang SC', 'Noto Sans SC', Helvetica, Arial, sans-serif">inline 与类内定义是例外：允许每个翻译单元各有一份定义。</text></svg>
