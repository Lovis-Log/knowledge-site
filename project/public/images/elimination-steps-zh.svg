, 'PingFang SC', 'Noto Sans SC', Helvetica, Arial, sans-serif">回代：从最后一行往上</text><rect x="72" y="576" width="190" height="42" rx="8" fill="#fffdf9" stroke="#d8d0c1" stroke-width="1"/><text x="167" y="602" font-size="12.5" fill="#1b2b45" font-weight="normal" text-anchor="middle" font-family="Consolas, monospace">5z = −10 → z = −2</text><line x1="268" y1="597" x2="284.05" y2="597" stroke="#7d5a1e" stroke-width="1.8"/><path d="M 290 597 L 283.5 599.6 L 283.5 594.4 Z" fill="#7d5a1e"/><rect x="300" y="576" width="190" height="42" rx="8" fill="#fffdf9" stroke="#d8d0c1" stroke-width="1"/><text x="395" y="602" font-size="12.5" fill="#1b2b45" font-weight="normal" text-anchor="middle" font-family="Consolas, monospace">2y − 2z = 6 → y = 1</text><line x1="496" y1="597" x2="512.05" y2="597" stroke="#7d5a1e" stroke-width="1.8"/><path d="M 518 597 L 511.5 599.6 L 511.5 594.4 Z" fill="#7d5a1e"/><rect x="528" y="576" width="190" height="42" rx="8" fill="#fffdf9" stroke="#d8d0c1" stroke-width="1"/><text x="623" y="602" font-size="12.5" fill="#1b2b45" font-weight="normal" text-anchor="middle" font-family="Consolas, monospace">x + 2y + z = 2 → x = 2</text><rect x="72" y="628" width="163.25" height="24" rx="12" fill="#f3ead9" stroke="none" stroke-width="1"/><text x="153.62" y="644.32" font-size="12.5" fill="#7d5a1e" font-weight="bold" text-anchor="middle" font-family="'Segoe UI', 'Microsoft YaHei', 'PingFang SC', 'Noto Sans SC', Helvetica, Arial, sans-serif">解 (x, y, z) = (2, 1, −2)</text></svg>
