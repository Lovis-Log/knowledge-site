<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 520" width="900" height="520" font-family="Segoe UI, Helvetica, Arial, sans-serif" role="img"><title>Projection of b onto the line through a</title><defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1b2b45"/></marker><marker id="ara" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7d5a1e"/></marker></defs><rect width="900" height="520" fill="#fbf9f5"/><line x1="80" y1="420" x2="800" y2="420" stroke="#d8d0c1" stroke-width="10"/><line x1="100" y1="420" x2="720" y2="420" stroke="#1b2b45" stroke-width="2" marker-end="url(#ar)"/><text x="730" y="425" font-size="16" fill="#1b2b45" text-anchor="start" font-weight="normal">a</text><line x1="100" y1="420" x2="520" y2="120" stroke="#1b2b45" stroke-width="2" marker-end="url(#ar)"/><text x="270" y="240" font-size="16" fill="#1b2b45" text-anchor="start" font-weight="normal">b</text><line x1="520" y1="420" x2="520" y2="120" stroke="#7d5a1e" stroke-width="2.5" stroke-dasharray="7 6"/><text x="535" y="270" font-size="16" fill="#7d5a1e" text-anchor="start" font-weight="normal">e = b − p</text><path d="M520,400 h20 v20" fill="none" stroke="#7d5a1e" stroke-width="2"/><circle cx="520" cy="420" r="5" fill="#7d5a1e"/><text x="555" y="455" font-size="16" fill="#1b2b45" text-anchor="start" font-weight="normal">p = a (a<tspan dy="-6" font-size="11">T</tspan><tspan dy="6"> </tspan>b) / (a<tspan dy="-6" font-size="11">T</tspan><tspan dy="6"> </tspan>a)</text><text x="450" y="490" font-size="14" fill="#57534c" text-anchor="middle" font-weight="normal">e ⟂ a:  the error is orthogonal to the line</text></svg>