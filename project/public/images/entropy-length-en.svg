<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 838" width="1120" height="838" role="img" lang="en"><rect width="1120" height="838" fill="#fbf9f5"/><text x="40" y="50" font-size="21" fill="#1b2b45" font-weight="bold" text-anchor="start" font-family="'Segoe UI', 'Microsoft YaHei', 'PingFang SC', 'Noto Sans SC', Helvetica, Arial, sans-serif">The limit of compression: expected length vs entropy</text><text x="40" y="80" font-size="13" fill="#57534c" font-weight="normal" text-anchor="start" font-family="'Segoe UI', 'Microsoft YaHei', 'PingFang SC', 'Noto Sans SC', Helvetica, Arial, sans-serif">k=2, p=(7/8,1/8), n=2: naive code 2.0 bits, improved code 1.359 bits, entropy bound 1.088 bits</text><rect x="40" y="104" width="560" height="520" rx="14" fill="#fffdf9" stroke="#d8d0c1" stroke-width="1"/><text x="58" y="137" font-size="14" fill="#1b2b45" font-weight="bold" text-anchor="start" font-family="'Segoe UI', 'Microsoft YaHei', 'PingFang SC', 'Noto Sans SC', Helvetica, Arial, sans-serif">① Codes for the four messages</text><text x="70" y="180" font-size="11.5" fill="#746e64" font-weight="bold" text-anchor="start" font-family="'Segoe UI', 'Microsoft YaHei', 'PingFang SC', 'Noto Sans SC', Helvetica, Arial, sans-serif">message</text><text x="180" y="180" font-size="11.5" fill="#746e64" font-weight="bold" text-anchor="start" font-family="'Segoe UI', 'Microsoft YaHei', 'PingFang SC', 'Noto Sans SC', Helvetica, Arial, sans-serif">probability</text><text x="390" y="180" font-size="11.5" fill="#746e64" font-weight="bold" text-anchor="middle" font-family="'Segoe UI', 'Microsoft YaHei', 'PingFang SC', 'Noto Sans SC', Helvetica, Arial, sans-serif">naive code</text><text x="500" y="180" font-size="11.5" fill="#746e64" font-weight="bold" text-anchor="middle" font-family="'Segoe UI', 'Microsoft YaHei', 'PingFang SC', 'Noto Sans SC', Helvetica, Arial, sans-serif">improved code</text><line x1="70" y1="192" x2="560" y2="192" stroke="#d8d0c1" stroke-width="1"/><rect x="60" y="206" width="505" height="40" rx="6" fill="#f3ead9" stroke="none" stroke-width="1"/><text x="70" y="226" font-size="13" fill="#1b2b45" font-weight="normal" text-anchor="start" font-family="Consolas, monospace">a₁a₁</text><text x="180" y="226" font-size="12.5" fill="#57534c" font-weight="normal" text-anchor="start" font-family="Consolas, monospace">49/64</text><rect x="250" y="215" width="99.53" height="14" rx="3" fill="#e4eaf2" stroke="none" stroke-width="1"/><text x="390" y="226" font-size="12.5" fill="#57534c" font-weight="normal" text-anchor="middle" font-family="Consolas, monospace">00 (2)</text><text x="500" y="226" font-size="12.5" fill="#7d5a1e" font-weight="bold" text-anchor="middle" font-family="Consolas, monospace">0 (1)</text><text x="70" y="278" font-size="13" fill="#1b2b45" font-weight="normal" text-anchor="start" font-family="Consolas, monospace">a₁a₂</text><text x="180" y="278" font-size="12.5" fill="#57534c" font-weight="normal" text-anchor="start" font-family="Consolas, monospace">7/64</text><rect x="250" y="267" width="14.22" height="14" rx="3" fill="#e4eaf2" stroke="none" stroke-width="1"/><text x="390" y="278" font-size="12.5" fill="#57534c" font-weight="normal" text-anchor="middle" font-family="Consolas, monospace">01 (2)</text><text x="500" y="278" font-size="12.5" fill="#7d5a1e" font-weight="normal" text-anchor="middle" font-family="Consolas, monospace">10 (2)</text><text x="70" y="330" font-size="13" fill="#1b2b45" font-weight="normal" text-anchor="start" font-family="Consolas, monospace">a₂a₁</text><text x="180" y="330" font-size="12.5" fill="#57534c" font-weight="normal" text-anchor="start" font-family="Consolas, monospace">7/64</text><rect x="250" y="319" width="14.22" height="14" rx="3" fill="#e4eaf2" stroke="none" stroke-width="1"/><text x="390" y="330" font-size="12.5" fill="#57534c" font-weight="normal" text-anchor="middle" font-family="Consolas, monospace">10 (2)</text><text x="500" y="330" font-size="12.5" fill="#7d5a1e" font-weight="normal" text-anchor="middle" font-family="Consolas, monospace">110 (3)</text><text x="70" y="382" font-size="13" fill="#1b2b45" font-weight="normal" text-anchor="start" font-family="Consolas, monospace">a₂a₂</text><text x="180" y="382" font-size="12.5" fill="#57534c" font-weight="normal" text-anchor="start" font-family="Consolas, monospace">1/64</text><rect x="250" y="371" width="3" height="14" rx="3" fill="#e4eaf2" stroke="none" stroke-width="1"/><text x="390" y="382" font-size="12.5" fill="#57534c" font-weight="normal" text-anchor="middle" font-family="Consolas, monospace">11 (2)</text><text x="500" y="382" font-size="12.5" fill="#7d5a1e" font-weight="normal" text-anchor="middle" font-family="Consolas, monospace">111 (3)</text><text x="70" y="430" font-size="12" fill="#57534c" font-weight="normal" text-anchor="start" font-family="'Segoe UI', 'Microsoft YaHei', 'PingFang SC', 'Noto Sans SC', Helvetica, Arial, sans-serif">The improved code compresses the most likely a₁a₁ to 1 bit, at the cost of</text><text x="70" y="448" font-size="12" fill="#57534c" font-weight="normal" text-anchor="start" font-family="'Segoe UI', 'Microsoft YaHei', 'PingFang SC', 'Noto Sans SC', Helvetica, Arial, sans-serif">lengthening the rare messages.</text><rect x="620" y="104" width="460" height="520" rx="14" fill="#fffdf9" stroke="#d8d0c1" stroke-width="1"/><text x="638" y="137" font-size="14" fill="#1b2b45" font-weight="bold" text-anchor="start" font-family="'Segoe UI', 'Microsoft YaHei', 'PingFang SC', 'Noto Sans SC', Helvetica, Arial, sans-serif">② Three lengths</text><text x="740" y="252" font-size="12" fill="#1b2b45" font-weight="normal" text-anchor="end" font-family="'Segoe UI', 'Microsoft YaHei', 'PingFang SC', 'Noto Sans SC', Helvetica, Arial, sans-serif">naive</text><rect x="760" y="230" width="236.36" height="30" rx="4" fill="#c9d5e6" stroke="none" stroke-width="1"/><text x="1006.36" y="251" font-size="12" fill="#1b2b45" font-weight="bold" text-anchor="start" font-family="Consolas, monospace">2.000</text><text x="740" y="327" font-size="12" fill="#1b2b45" font-weight="normal" text-anchor="end" font-family="'Segoe UI', 'Microsoft YaHei', 'PingFang SC', 'Noto Sans SC', Helvetica, Arial, sans-serif">improved</text><rect x="760" y="305" width="160.65" height="30" rx="4" fill="#7d5a1e" stroke="none" stroke-width="1"/><text x="930.65" y="326" font-size="12" fill="#7d5a1e" font-weight="bold" text-anchor="start" font-family="Consolas, monospace">1.359</text><text x="740" y="402" font-size="12" fill="#1b2b45" font-weight="normal" text-anchor="end" font-family="'Segoe UI', 'Microsoft YaHei', 'PingFang SC', 'Noto Sans SC', Helvetica, Arial, sans-serif">entropy bound</text><rect x="760" y="380" width="128.58" height="30" rx="4" fill="#9c4a2f" stroke="none" stroke-width="1"/><text x="898.58" y="401" font-size="12" fill="#9c4a2f" font-weight="bold" text-anchor="start" font-family="Consolas, monospace">1.088</text><line x1="888.58" y1="210" x2="888.58" y2="420" stroke="#9c4a2f" stroke-width="1.2" stroke-dasharray="5 4"/><text x="894.58" y="214" font-size="11.5" fill="#9c4a2f" font-weight="bold" text-anchor="start" font-family="'Segoe UI', 'Microsoft YaHei', 'PingFang SC', 'Noto Sans SC', Helvetica, Arial, sans-serif">lower bound</text><text x="650" y="460" font-size="13" fill="#1b2b45" font-weight="normal" text-anchor="start" font-family="Consolas, monospace">E[L] = 87/64 ≈ 1.359</text><text x="650" y="490" font-size="13" fill="#9c4a2f" font-weight="normal" text-anchor="start" font-family="Consolas, monospace">2H(p) = 2 × 0.544 = 1.088</text><text x="650" y="522" font-size="11.5" fill="#57534c" font-weight="normal" text-anchor="start" font-family="'Segoe UI', 'Microsoft YaHei', 'PingFang SC', 'Noto Sans SC', Helvetica, Arial, sans-serif">The expected length can beat the naive code but cannot beat entropy;</text><text x="650" y="539.25" font-size="11.5" fill="#57534c" font-weight="normal" text-anchor="start" font-family="'Segoe UI', 'Microsoft YaHei', 'PingFang SC', 'Noto Sans SC', Helvetica, Arial, sans-serif">it approaches it as n grows.</text><rect x="40" y="648" width="1040" height="150" rx="12" fill="#f3ead9" stroke="none" stroke-width="1"/><text x="60" y="676" font-size="14" fill="#1b2b45" font-weight="bold" text-anchor="start" font-family="'Segoe UI', 'Microsoft YaHei', 'PingFang SC', 'Noto Sans SC', Helvetica, Arial, sans-serif">Shannon&#39;s noiseless coding theorem</text><text x="60" y="702" font-size="13" fill="#57534c" font-weight="normal" text-anchor="start" font-family="'Segoe UI', 'Microsoft YaHei', 'PingFang SC', 'Noto Sans SC', Helvetica, Arial, sans-serif">Each message needs at least H(p) bits per symbol—so n messages need nH(p) bits.</text><text x="60" y="728" font-size="13" fill="#57534c" font-weight="normal" text-anchor="start" font-family="'Segoe UI', 'Microsoft YaHei', 'PingFang SC', 'Noto Sans SC', Helvetica, Arial, sans-serif">The upper bound is an explicit construction; the block code here needs an END marker.</text><text x="60" y="754" font-size="13" fill="#57534c" font-weight="normal" text-anchor="start" font-family="'Segoe UI', 'Microsoft YaHei', 'PingFang SC', 'Noto Sans SC', Helvetica, Arial, sans-serif">The uniform distribution has maximum entropy and is the hardest to compress.</text></svg>
