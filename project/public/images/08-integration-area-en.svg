5" font-weight="bold" text-anchor="middle" font-family="'Segoe UI', 'Microsoft YaHei', 'PingFang SC', 'Noto Sans SC', Helvetica, Arial, sans-serif">area = distance travelled</text><line x1="703.48" y1="240" x2="758.26" y2="216.77" stroke="#7d5a1e" stroke-width="1.2"/><path d="M 762.95 214.78 L 758.69 219 L 756.95 214.9 Z" fill="#7d5a1e"/><text x="770.95" y="209.78" font-size="12" fill="#7d5a1e" font-weight="bold" text-anchor="start" font-family="'Segoe UI', 'Microsoft YaHei', 'PingFang SC', 'Noto Sans SC', Helvetica, Arial, sans-serif">ds ≈ v(T)·dt</text><text x="687.14" y="453.33" font-size="11.5" fill="#7d5a1e" font-weight="bold" text-anchor="middle" font-family="'Segoe UI', 'Microsoft YaHei', 'PingFang SC', 'Noto Sans SC', Helvetica, Arial, sans-serif">dt</text><text x="673.81" y="514" font-size="13" fill="#7d5a1e" font-weight="bold" text-anchor="middle" font-family="'Segoe UI', 'Microsoft YaHei', 'PingFang SC', 'Noto Sans SC', Helvetica, Arial, sans-serif">T</text><rect x="40" y="542.55" width="1040" height="124" rx="12" fill="#f3ead9" stroke="none" stroke-width="1"/><text x="60" y="570.55" font-size="14" fill="#1b2b45" font-weight="bold" text-anchor="start" font-family="'Segoe UI', 'Microsoft YaHei', 'PingFang SC', 'Noto Sans SC', Helvetica, Arial, sans-serif">Takeaway</text><text x="60" y="596.55" font-size="13" fill="#57534c" font-weight="normal" text-anchor="start" font-family="'Segoe UI', 'Microsoft YaHei', 'PingFang SC', 'Noto Sans SC', Helvetica, Arial, sans-serif">Treat the right endpoint T as a variable: A(T) = ∫₀ᵀ v dt, and A′(T) = v(T) — the area function&#39;s derivative is the curve&#39;s height.</text><text x="60" y="622.55" font-size="13" fill="#57534c" font-weight="normal" text-anchor="start" font-family="'Segoe UI', 'Microsoft YaHei', 'PingFang SC', 'Noto Sans SC', Helvetica, Arial, sans-serif">So finding the area becomes finding an antiderivative: v(t) = 8t − t² has antiderivative 4t² − t³/3, evaluated at the two limits.</text></svg>
