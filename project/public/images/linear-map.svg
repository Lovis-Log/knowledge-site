<svg xmlns="http://www.w3.org/2000/svg" width="800" height="400" viewBox="0 0 800 400" role="img" aria-label="线性映射把正方形网格变成平行四边形网格">
  <rect width="800" height="400" fill="#FBF9F4"/>
  <g stroke="#E6E1D6" stroke-width="1">
    <path d="M70 60 H330 M70 120 H330 M70 180 H330 M70 240 H330 M70 300 H330"/>
    <path d="M70 60 V300 M135 60 V300 M200 60 V300 M265 60 V300 M330 60 V300"/>
  </g>
  <rect x="70" y="60" width="260" height="240" fill="none" stroke="#6E6A63" stroke-width="1.5"/>
  <path d="M400 200 H470" stroke="#9A3412" stroke-width="2" marker-end="url(#arrow2)"/>
  <defs>
    <marker id="arrow2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#9A3412"/>
    </marker>
  </defs>
  <g stroke="#E6E1D6" stroke-width="1">
    <path d="M520 70 L740 150 M490 130 L710 210 M460 190 L680 270 M430 250 L650 330 M400 310 L620 390"/>
    <path d="M400 310 L520 70 M460 290 L580 50 M520 270 L640 30 M580 250 L700 10 M640 230 L760 -10"/>
  </g>
  <path d="M400 310 L520 70 L760 -10 L640 230 Z" fill="none" stroke="#9A3412" stroke-width="2"/>
  <g fill="#1F1E1B" font-family="system-ui, 'PingFang SC', 'Microsoft YaHei', sans-serif" text-anchor="middle">
    <text x="200" y="345" font-size="14" fill="#6E6A63">标准网格</text>
    <text x="580" y="345" font-size="14" fill="#6E6A63">被 A 拉伸后的网格</text>
    <text x="435" y="190" font-size="13" fill="#9A3412">A</text>
  </g>
</svg>
