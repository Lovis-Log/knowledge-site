h="2.2"/><text x="214.38" y="209.88" font-size="12" fill="#1b2b45" font-weight="bold" text-anchor="start" font-family="'Segoe UI', 'Microsoft YaHei', 'PingFang SC', 'Noto Sans SC', Helvetica, Arial, sans-serif">一直合作  2/(1−δ)</text><line x1="155" y1="235.33" x2="198.75" y2="235.33" stroke="#9c4a2f" stroke-width="2.2"/><text x="214.38" y="239.33" font-size="12" fill="#9c4a2f" font-weight="bold" text-anchor="start" font-family="'Segoe UI', 'Microsoft YaHei', 'PingFang SC', 'Noto Sans SC', Helvetica, Arial, sans-serif">背叛一次  3</text><text x="155" y="324.62" font-size="11.5" fill="#57534c" font-weight="normal" text-anchor="start" font-family="'Segoe UI', 'Microsoft YaHei', 'PingFang SC', 'Noto Sans SC', Helvetica, Arial, sans-serif">δ &lt; 1/3：背叛更划算</text><text x="539.38" y="357.88" font-size="11.5" fill="#7d5a1e" font-weight="normal" text-anchor="start" font-family="'Segoe UI', 'Microsoft YaHei', 'PingFang SC', 'Noto Sans SC', Helvetica, Arial, sans-serif">合作撑得住</text><rect x="690" y="175" width="390" height="340" rx="14" fill="#fffdf9" stroke="#d8d0c1" stroke-width="1"/><text x="708" y="208" font-size="14" fill="#1b2b45" font-weight="bold" text-anchor="start" font-family="'Segoe UI', 'Microsoft YaHei', 'PingFang SC', 'Noto Sans SC', Helvetica, Arial, sans-serif">门槛是怎么来的</text><rect x="706" y="213" width="358" height="36" rx="8" fill="#f3ead9" stroke="none" stroke-width="1"/><text x="716" y="237" font-size="12.5" fill="#7d5a1e" font-weight="bold" text-anchor="start" font-family="'Segoe UI', 'Microsoft YaHei', 'PingFang SC', 'Noto Sans SC', Helvetica, Arial, sans-serif">2/(1−δ) ≥ 3   ⇔   δ ≥ 1/3</text><text x="710" y="285" font-size="12.5" fill="#1b2b45" font-weight="normal" text-anchor="start" font-family="'Segoe UI', 'Microsoft YaHei', 'PingFang SC', 'Noto Sans SC', Helvetica, Arial, sans-serif">今天多拿   3 − 2 = 1</text><text x="710" y="311" font-size="12.5" fill="#1b2b45" font-weight="normal" text-anchor="start" font-family="'Segoe UI', 'Microsoft YaHei', 'PingFang SC', 'Noto Sans SC', Helvetica, Arial, sans-serif">此后每期少拿   2 − 0 = 2</text><text x="710" y="341" font-size="12.5" fill="#57534c" font-weight="normal" text-anchor="start" font-family="'Segoe UI', 'Microsoft YaHei', 'PingFang SC', 'Noto Sans SC', Helvetica, Arial, sans-serif">永久损失的现值   δ·2/(1−δ)</text><line x1="708" y1="359" x2="1062" y2="359" stroke="#d8d0c1" stroke-width="1"/><text x="710" y="383" font-size="12" fill="#57534c" font-weight="normal" text-anchor="start" font-family="'Segoe UI', 'Microsoft YaHei', 'PingFang SC', 'Noto Sans SC', Helvetica, Arial, sans-serif">阈值就是「一次性收益」与「永久损失」的比值。</text><text x="710" y="407" font-size="12" fill="#57534c" font-weight="normal" text-anchor="start" font-family="'Segoe UI', 'Microsoft YaHei', 'PingFang SC', 'Noto Sans SC', Helvetica, Arial, sans-serif">δ 越大，未来越重，惩罚越有效。</text><rect x="40" y="617.02" width="1040" height="124" rx="12" fill="#f3ead9" stroke="none" stroke-width="1"/><text x="60" y="645.02" font-size="14" fill="#1b2b45" font-weight="bold" text-anchor="start" font-family="'Segoe UI', 'Microsoft YaHei', 'PingFang SC', 'Noto Sans SC', Helvetica, Arial, sans-serif">要点</text><text x="60" y="671.02" font-size="13" fill="#57534c" font-weight="normal" text-anchor="start" font-family="'Segoe UI', 'Microsoft YaHei', 'PingFang SC', 'Noto Sans SC', Helvetica, Arial, sans-serif">δ = 0 时退化成一次性博弈，唯一的均衡是背叛。</text><text x="60" y="697.02" font-size="13" fill="#57534c" font-weight="normal" text-anchor="start" font-family="'Segoe UI', 'Microsoft YaHei', 'PingFang SC', 'Noto Sans SC', Helvetica, Arial, sans-serif">同样的算法可以套到任何「合作—背叛」型阶段博弈上。</text></svg>
